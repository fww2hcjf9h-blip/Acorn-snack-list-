<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c6cf2">
<link rel="manifest" href="manifest.webmanifest">
<title>Little Sprouts • Snack Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#25283d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f6f7fb}.top{padding:28px 20px 18px;background:linear-gradient(145deg,#8877f4,#65b8f2);color:#fff;border-radius:0 0 30px 30px}
.top small{opacity:.85}.top h1{margin:5px 0 0;font-size:27px}.content{padding:16px 16px 100px}.switch{display:flex;background:#e9eaf4;padding:4px;border-radius:16px;margin-bottom:15px}.switch button{flex:1;border:0;background:transparent;padding:11px;border-radius:13px;font-weight:800;color:#62677d}.switch .on{background:#fff;color:#6556dc;box-shadow:0 2px 8px #0001}
.card{background:#fff;border:1px solid #e8e9f1;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #30334d0b}.card h2{font-size:18px;margin:0 0 4px}.muted{color:#7a7f93;font-size:13px}.food{display:flex;align-items:center;justify-content:space-between;background:#f7f7fb;border-radius:13px;padding:10px 12px;margin-top:8px}.food span{font-weight:650}.btn{border:0;border-radius:13px;padding:11px 14px;background:#7868ed;color:white;font-weight:800}.btn.light{background:#eeeef7;color:#393d52}.children{margin-top:8px}.child{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eeeef3}.child:last-child{border-bottom:0}.check{width:27px;height:27px;accent-color:#7868ed}.avatar{width:42px;height:42px;border-radius:50%;background:#ebe8ff;display:grid;place-items:center;font-weight:900;color:#6354d8}.name{font-weight:800}.allergy{font-size:12px;font-weight:800;color:#d54e55;margin-top:2px}.none{font-size:12px;color:#8b90a2}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7e8ef;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.nav{max-width:500px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#85899a;font-weight:700;padding:7px 15px}.nav .active{color:#6556dc}.hidden{display:none}.input{width:100%;padding:13px;border:1px solid #dedfea;border-radius:13px;font-size:16px;margin:7px 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.danger{color:#d54e55}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#25283d;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:20}
</style>
</head>
<body>
<div class="app">
<header class="top"><small id="date"></small><h1>🌱 Little Sprouts</h1><small>Snack tracker</small></header>
<main class="content">
<section id="home">
<div class="switch"><button id="am" class="on" onclick="session='AM';render()">☀️ AM Snack</button><button id="pm" onclick="session='PM';render()">🌙 PM Snack</button></div>
<div class="card"><div class="row"><div><h2 id="title">AM Snack</h2><div class="muted">Today's snack</div></div><button class="btn" onclick="addFood()">+ Add</button></div><div id="foods"></div></div>
<div class="card"><div class="row"><div><h2>Children</h2><div class="muted" id="progress"></div></div></div><div id="children"></div></div>
</section>
<section id="people" class="hidden">
<div class="card"><h2>Add child</h2><div class="muted">Use demo information while testing. Don't enter real children's details yet.</div>
<input class="input" id="name" placeholder="Child's name"><input class="input" id="allergy" placeholder="Allergy / dietary requirement">
<label><input id="a" type="checkbox" checked> AM attendance</label>&nbsp;&nbsp;<label><input id="p" type="checkbox" checked> PM attendance</label><br><br><button class="btn" onclick="addChild()">Save child</button></div>
<div class="card"><h2>Children</h2><div id="manage"></div></div>
</section>
<section id="history" class="hidden"><div class="card"><h2>Snack history</h2><div class="muted">Recent records on this device</div><div id="logs" style="margin-top:12px"></div></div></section>
</main>
<nav class="bottom"><div class="nav"><button class="active" id="n1" onclick="tab('home',this)">🏠<br>Home</button><button id="n2" onclick="tab('people',this)">👶<br>Children</button><button id="n3" onclick="tab('history',this)">📅<br>History</button></div></nav>
<div id="toast" class="toast"></div>
</div>
<script>
const key=new Date().toISOString().slice(0,10);
let state=JSON.parse(localStorage.getItem('sprouts')||'null')||{children:[{id:1,name:'Emma',allergy:'Peanuts',am:true,pm:true},{id:2,name:'Jack',allergy:'None',am:true,pm:true},{id:3,name:'Lily',allergy:'Milk',am:true,pm:false}],days:{}};
let session='AM'; state.days[key] ||= {AM:{foods:['Apple','Toast'],done:[]},PM:{foods:['Banana'],done:[]}};
function save(){localStorage.setItem('sprouts',JSON.stringify(state))}
function tab(id,b){['home','people','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function addFood(){let x=prompt('What food is being served?');if(x?.trim()){state.days[key][session].foods.push(x.trim());save();render();toast('Snack added')}}
function addChild(){let n=name.value.trim();if(!n)return toast('Enter a name');state.children.push({id:Date.now(),name:n,allergy:allergy.value.trim()||'None',am:a.checked,pm:p.checked});name.value='';allergy.value='';save();render();toast('Child added')}
function toggle(id){let d=state.days[key][session].done,i=d.indexOf(id);i<0?d.push(id):d.splice(i,1);save();render()}
function removeChild(id){state.children=state.children.filter(c=>c.id!==id);save();render()}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1400)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
date.textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
title.textContent=session==='AM'?'☀️ AM Snack':'🌙 PM Snack';am.classList.toggle('on',session==='AM');pm.classList.toggle('on',session==='PM');
let d=state.days[key][session], kids=state.children.filter(c=>c[session.toLowerCase()]);
foods.innerHTML=d.foods.map(x=>`<div class="food"><span>🍎 ${esc(x)}</span></div>`).join('')||'<div class="muted" style="margin-top:12px">No food added yet.</div>';
progress.textContent=`${d.done.filter(id=>kids.some(c=>c.id===id)).length} of ${kids.length} children completed`;
children.innerHTML=kids.map(c=>`<div class="child"><input class="check" type="checkbox" ${d.done.includes(c.id)?'checked':''} onchange="toggle(${c.id})"><div class="avatar">${esc(c.name[0])}</div><div><div class="name">${esc(c.name)}</div><div class="${c.allergy.toLowerCase()==='none'?'none':'allergy'}">${c.allergy.toLowerCase()==='none'?'No allergies':'⚠️ '+esc(c.allergy)}</div></div></div>`).join('');
manage.innerHTML=state.children.map(c=>`<div class="child"><div class="avatar">${esc(c.name[0])}</div><div style="flex:1"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.allergy)} · AM ${c.am?'✓':'—'} · PM ${c.pm?'✓':'—'}</div></div><button class="btn light danger" onclick="removeChild(${c.id})">Remove</button></div>`).join('');
let entries=Object.entries(state.days).sort().reverse().slice(0,10);logs.innerHTML=entries.map(([dt,v])=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${new Date(dt+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</b><br><span class="muted">☀️ AM ${v.AM.done.length} completed · ${v.AM.foods.join(', ')||'—'}<br>🌙 PM ${v.PM.done.length} completed · ${v.PM.foods.join(', ')||'—'}</span></div>`).join('');
}
render();
</script>
</body>
</html>
