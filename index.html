<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

document.addEventListener("DOMContentLoaded",function(){

const supabase=window.supabase.createClient(
"https://zzyyetnklrwzdzoraqqz.supabase.co",
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0"
);

const $=id=>document.getElementById(id);

let adults=[];
let selected=0;
let currentAdult=null;

let date=new Date().toISOString().slice(0,10);
let snackTime="am";
let groupTime="am";

let data={};


/* MESSAGE */

function message(id,text,type){

const el=$(id);

el.textContent=text;

el.className="message "+type;

}


/* PHOTOS */

function showPhoto(el,url){

el.innerHTML="";

if(url){

const img=document.createElement("img");

img.src=url;

el.appendChild(img);

}else{

el.textContent="👤";

}

}


function photoData(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=function(){

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");

const size=500;

let w=img.width;
let h=img.height;

if(w>h){
h=h*size/w;
w=size;
}else{
w=w*size/h;
h=size;
}

canvas.width=w;
canvas.height=h;

canvas.getContext("2d").drawImage(
img,0,0,w,h
);

resolve(
canvas.toDataURL("image/jpeg",.7)
);

};

img.onerror=reject;

img.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

}


/* LOAD ADULTS */

async function loadAdults(){

const result=await supabase.rpc(
"list_adults"
);

if(result.error){

console.error(result.error);

message(
"loginMessage",
"Could not load adult accounts.",
"error"
);

return;

}

adults=result.data||[];

if(selected>=adults.length)
selected=Math.max(0,adults.length-1);

drawAdults();

}


/* DRAW ADULTS */

function drawAdults(){

if(!adults.length){

$("carousel").classList.add("hidden");
$("dots").classList.add("hidden");

$("loginName").textContent="No adults";

return;

}

$("carousel").classList.remove("hidden");
$("dots").classList.remove("hidden");

const adult=adults[selected];

$("loginName").textContent=adult.name;

showPhoto(
$("loginPhoto"),
adult.photo_url
);

$("dots").innerHTML="";

adults.forEach(function(a,i){

const d=document.createElement("div");

d.className=
"dot"+(i===selected?" active":"");

$("dots").appendChild(d);

});

}


/* ARROWS */

$("prev").onclick=function(){

if(!adults.length)return;

selected--;

if(selected<0)
selected=adults.length-1;

drawAdults();

};


$("next").onclick=function(){

if(!adults.length)return;

selected++;

if(selected>=adults.length)
selected=0;

drawAdults();

};


/* LOGIN */

$("loginButton").onclick=async function(){

if(!adults.length){

message(
"loginMessage",
"No adult accounts yet. Tap + to add one.",
"error"
);

return;

}

const code=$("loginCode").value.trim();

if(!/^[0-9]{4}$/.test(code)){

message(
"loginMessage",
"Please enter your 4-digit code.",
"error"
);

return;

}

const adult=adults[selected];

const result=await supabase.rpc(
"login_adult",
{
p_name:adult.name,
p_code:code
}
);

if(result.error){

console.error(result.error);

message(
"loginMessage",
"Incorrect code.",
"error"
);

return;

}

let logged=result.data;

if(Array.isArray(logged))
logged=logged[0];

currentAdult=logged;

localStorage.setItem(
"acornAdult",
JSON.stringify(currentAdult)
);

$("loginCode").value="";

openApp();

};


/* ADD ADULT MODAL */

$("addButton").onclick=function(){
$("adultModal").classList.remove("hidden");
};

$("addAdult").onclick=function(){

$("menu").classList.add("hidden");

$("adultModal").classList.remove("hidden");

};

$("closeAdult").onclick=function(){
$("adultModal").classList.add("hidden");
};


$("newPhotoFile").onchange=async function(){

const file=this.files[0];

if(!file)return;

const photo=await photoData(file);

$("newPhoto").dataset.photo=photo;

showPhoto($("newPhoto"),photo);

};


/* CREATE ADULT */

$("createAdult").onclick=async function(){

const name=$("newName").value.trim();

const code=$("newCode").value.trim();

const confirm=$("newConfirm").value.trim();

if(!name){

message(
"adultMessage",
"Please enter a name.",
"error"
);

return;

}

if(!/^[0-9]{4}$/.test(code)){

message(
"adultMessage",
"Code must be 4 numbers.",
"error"
);

return;

}

if(code!==confirm){

message(
"adultMessage",
"The codes don't match.",
"error"
);

return;

}

const result=await supabase.rpc(
"create_adult",
{
p_name:name,
p_code:code
}
);

if(result.error){

console.error(result.error);

message(
"adultMessage",
result.error.message,
"error"
);

return;

}

let newAdult=result.data;

if(Array.isArray(newAdult))
newAdult=newAdult[0];

const photo=$("newPhoto").dataset.photo||"";

if(photo && newAdult){

await supabase
.from("adults")
.update({photo_url:photo})
.eq("id",newAdult.id);

}

message(
"adultMessage",
"Adult created!",
"success"
);

$("newName").value="";
$("newCode").value="";
$("newConfirm").value="";

await loadAdults();

setTimeout(function(){

$("adultModal").classList.add("hidden");

},700);

};


/* PROFILE MENU */

$("profileButton").onclick=function(){

$("menu").classList.toggle("hidden");

};


/* EDIT PROFILE */

$("editProfile").onclick=function(){

$("menu").classList.add("hidden");

$("profileName").value=currentAdult.name||"";

$("profilePhoto").dataset.photo=
currentAdult.photo_url||"";

showPhoto(
$("profilePhoto"),
currentAdult.photo_url
);

$("profileModal").classList.remove("hidden");

};


$("closeProfile").onclick=function(){

$("profileModal").classList.add("hidden");

};


$("profileFile").onchange=async function(){

const file=this.files[0];

if(!file)return;

const photo=await photoData(file);

$("profilePhoto").dataset.photo=photo;

showPhoto($("profilePhoto"),photo);

};


/* PROFILE SAVE */

$("saveProfile").onclick=async function(){

const name=$("profileName").value.trim();

const photo=
$("profilePhoto").dataset.photo||"";

if(!name){

message(
"profileMessage",
"Please enter your name.",
"error"
);

return;

}

/*
The current SQL gives public SELECT access to adults
but not UPDATE access.

So save the photo/name locally for now.
The shared profile update can be added once the main
app is working.
*/

currentAdult.name=name;
currentAdult.photo_url=photo;

localStorage.setItem(
"acornAdult",
JSON.stringify(currentAdult)
);

$("menuName").textContent=name;

showPhoto(
$("miniAvatar"),
photo
);

showPhoto(
$("menuAvatar"),
photo
);

message(
"profileMessage",
"Profile saved on this device.",
"success"
);

setTimeout(function(){

$("profileModal").classList.add("hidden");

},700);

};


/* LOGOUT */

$("logout").onclick=function(){

localStorage.removeItem("acornAdult");

currentAdult=null;

$("app").classList.add("hidden");

$("loginScreen").classList.remove("hidden");

$("menu").classList.add("hidden");

loadAdults();

};


/* OPEN APP */

async function openApp(){

$("loginScreen").classList.add("hidden");

$("app").classList.remove("hidden");

$("date").value=date;

$("menuName").textContent=currentAdult.name;

showPhoto(
$("miniAvatar"),
currentAdult.photo_url
);

showPhoto(
$("menuAvatar"),
currentAdult.photo_url
);

await loadData();

render();

}


/* DATA */

async function loadData(){

data={};

const snacks=await supabase
.from("snack_lists")
.select("*")
.order("list_date")
.order("id");

const sun=await supabase
.from("suncream_lists")
.select("*")
.order("list_date")
.order("id");

if(snacks.error){

console.error(snacks.error);

alert(snacks.error.message);

return;

}

if(sun.error){

console.error(sun.error);

alert(sun.error.message);

return;

}

(snacks.data||[]).forEach(function(x){

if(!data[x.list_date])
data[x.list_date]={am:[],pm:[],sun:[]};

data[x.list_date][x.snack_time].push(x);

});

(sun.data||[]).forEach(function(x){

if(!data[x.list_date])
data[x.list_date]={am:[],pm:[],sun:[]};

data[x.list_date].sun.push(x);

});

}


/* NAVIGATION */

function page(which){

$("snackPage").classList.toggle(
"hidden",which!=="snack"
);

$("groupPage").classList.toggle(
"hidden",which!=="group"
);

$("sunPage").classList.toggle(
"hidden",which!=="sun"
);

$("snackNav").classList.toggle(
"active",which==="snack"
);

$("groupNav").classList.toggle(
"active",which==="group"
);

$("sunNav").classList.toggle(
"active",which==="sun"
);

render();

}

$("snackNav").onclick=function(){page("snack")};
$("groupNav").onclick=function(){page("group")};
$("sunNav").onclick=function(){page("sun")};


/* SNACK TABS */

$("am").onclick=function(){

snackTime="am";

$("am").classList.add("active");
$("pm").classList.remove("active");

$("snackTitle").textContent="AM Snack";

renderSnacks();

};

$("pm").onclick=function(){

snackTime="pm";

$("pm").classList.add("active");
$("am").classList.remove("active");

$("snackTitle").textContent="PM Snack";

renderSnacks();

};


/* GROUP TABS */

$("groupAm").onclick=function(){

groupTime="am";

$("groupAm").classList.add("active");
$("groupPm").classList.remove("active");

renderGroups();

};

$("groupPm").onclick=function(){

groupTime="pm";

$("groupPm").classList.add("active");
$("groupAm").classList.remove("active");

renderGroups();

};


/* ADD SNACK */

$("addSnack").onclick=async function(){

const name=$("child").value.trim();

if(!name){

alert("Please enter the child's name.");

return;

}

const result=await supabase
.from("snack_lists")
.insert({
adult_id:currentAdult.id,
list_date:date,
snack_time:snackTime,
child_name:name,
allergy_status:$("allergy").value,
alternative_milk:$("milk").value.trim(),
done:false,
amount:"",
food:""
});

if(result.error){

alert(result.error.message);

return;

}

$("child").value="";
$("milk").value="";

await loadData();

renderSnacks();

};


/* RENDER SNACKS */

function renderSnacks(){

const box=$("snacks");

box.innerHTML="";

if(!data[date]){
data[date]={am:[],pm:[],sun:[]};
}

const list=data[date][snackTime];

if(!list.length){

box.innerHTML=
'<div class="empty">No children added yet.</div>';

return;

}

list.forEach(function(child){

const item=document.createElement("div");

item.className=
"child"+(child.done?" done":"");

const top=document.createElement("div");

top.className="child-top";

const tick=document.createElement("button");

tick.className="tick";

tick.textContent=child.done?"✓":"";

tick.onclick=async function(){

await supabase
.from("snack_lists")
.update({done:!child.done})
.eq("id",child.id);

await loadData();

renderSnacks();

};

const name=document.createElement("div");

name.className="child-name";

name.textContent=child.child_name;

const badge=document.createElement("span");

badge.className="badge "+
(
child.allergy_status==="red"
?"red"
:
child.allergy_status==="green"
?"green"
:"none"
);

badge.textContent=
child.allergy_status==="red"
?"RED"
:
child.allergy_status==="green"
?"GREEN"
:"NONE";

const note=document.createElement("button");

note.className="note";

note.textContent="📝";

note.onclick=function(){

const box=document.createElement("div");

box.className="note-box";

const amounts=[
"Little",
"Half",
"Almost all",
"All"
];

const title=document.createElement("b");

title.textContent="How much did they have?";

box.appendChild(title);

const amountsBox=document.createElement("div");

amountsBox.className="amounts";

amounts.forEach(function(amount){

const b=document.createElement("button");

b.className=
"amount"+
(child.amount===amount?" selected":"");

b.textContent=amount;

b.onclick=async function(){

await supabase
.from("snack_lists")
.update({amount:amount})
.eq("id",child.id);

await loadData();

renderSnacks();

};

amountsBox.appendChild(b);

});

box.appendChild(amountsBox);

const input=document.createElement("input");

input.value=child.food||"";

input.placeholder="What did they eat?";

box.appendChild(input);

const save=document.createElement("button");

save.className="primary";

save.textContent="Save";

save.style.marginTop="8px";

save.onclick=async function(){

await supabase
.from("snack_lists")
.update({
food:input.value.trim()
})
.eq("id",child.id);

await loadData();

renderSnacks();

};

box.appendChild(save);

item.appendChild(box);

};

const remove=document.createElement("button");

remove.className="remove";

remove.textContent="Remove";

remove.onclick=async function(){

if(!confirm("Remove "+child.child_name+"?"))
return;

await supabase
.from("snack_lists")
.delete()
.eq("id",child.id);

await loadData();

renderSnacks();

};

top.append(
tick,
name,
badge,
note,
remove
);

item.appendChild(top);

if(child.alternative_milk){

const detail=document.createElement("div");

detail.className="detail";

detail.textContent=
"Alternative milk: "+
child.alternative_milk;

item.appendChild(detail);

}

if(child.amount||child.food){

const eaten=document.createElement("div");

eaten.className="eaten";

eaten.textContent=
"Eaten: "+
(child.amount||"")+
(child.food?" — "+child.food:"");

item.appendChild(eaten);

}

box.appendChild(item);

});

}


/* GROUPED */

function renderGroups(){

const box=$("groups");

box.innerHTML="";

if(!data[date]){
data[date]={am:[],pm:[],sun:[]};
}

const list=data[date][groupTime];

const groups={};

list.forEach(function(child){

if(!child.food)return;

const key=child.food.trim().toLowerCase();

if(!groups[key])
groups[key]=[];

groups[key].push(child.child_name);

});

const keys=Object.keys(groups);

if(!keys.length){

box.innerHTML=
'<div class="empty">No food recorded yet.</div>';

return;

}

keys.forEach(function(key){

const group=document.createElement("div");

group.className="group";

const title=document.createElement("div");

title.className="group-title";

title.textContent=key;

const names=document.createElement("div");

names.className="group-names";

names.textContent=
groups[key].join(" • ");

group.append(title,names);

box.appendChild(group);

});

}


/* SUNCREAM */

$("addSun").onclick=async function(){

const name=$("sunChild").value.trim();

if(!name){

alert("Please enter the child's name.");

return;

}

});

$("sunProduct").value="";

data[date]={am:[],pm:[],sun:[]};
}

if(!list.length){

box.innerHTML=
'<div class="empty">No children added yet.</div>';

return;

}

list.forEach(function(child){

const item=document.createElement("div");

item.className=
"child"+(child.done?" done":"");

const top=document.createElement("div");

top.className="child-top";

const tick=document.createElement("button");

tick.className="tick";

tick.textContent=child.done?"✓":"";

tick.onclick=async function(){

await supabase
.from("suncream_lists")
.update({done:!child.done})
.eq("id",child.id);

await loadData();

renderSun();

};

const name=document.createElement("div");

name.className="child-name";

name.textContent=child.child_name;

const remove=document.createElement("button");

remove.className="remove";

remove.textContent="Remove";

remove.onclick=async function(){

.from("suncream_lists")

/* SAVED DAYS */

function renderSaved(){

const box=$("savedDays");

box.innerHTML="";

const dates=Object.keys(data).sort().reverse();

if(!dates.length){

box.innerHTML=
'<div class="empty">No saved days yet.</div>';

return;

}

dates.forEach(function(d){

const row=document.createElement("div");

row.className="saved";

const title=document.createElement("strong");

title.textContent=
new Date(d+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

const open=document.createElement("button");

open.className="secondary";

open.textContent="Open";

open.onclick=async function(){

date=d;

$("date").value=d;

await loadData();

render();

};

row.append(title,open);

box.appendChild(row);

});

}


/* DATE */

$("date").onchange=async function(){

date=this.value;

await loadData();

render();

};


/* RENDER */

function render(){

$("date").value=date;

if(!$("snackPage").classList.contains("hidden"))
renderSnacks();

if(!$("groupPage").classList.contains("hidden"))
renderGroups();

if(!$("sunPage").classList.contains("hidden"))
renderSun();

renderSaved();

}


/* START */

async function start(){

$("date").value=date;

await loadAdults();

const saved=
localStorage.getItem("acornAdult");

if(saved){

try{

const savedAdult=JSON.parse(saved);

if(savedAdult && savedAdult.id){

currentAdult=savedAdult;

openApp();

}

}catch(e){

localStorage.removeItem("acornAdult");

}

}

}

start();

});

</script>
