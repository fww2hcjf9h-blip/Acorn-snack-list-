<style>
*{box-sizing:border-box}

body{

button,input,select{font:inherit}

.login-box{

.message{

.grey-button{

/* ADULT SELECTOR */

.selector{

}

.arrow{

.adult-card{

.modal{

</style>

<script>

const SUPABASE_URL =
"https://zzyyetnklrwzdzoraqqz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0";

let adults=[];
let selectedAdult=0;
let currentAdult=null;

let snacks=[];
let suncream=[];

let snackTime="am";

let currentDate=
new Date().toISOString().slice(0,10);


function $(id){
  return document.getElementById(id);
}


function show(id){
  $(id).classList.remove("hidden");
}


function hide(id){
  $(id).classList.add("hidden");
}


function message(id,text,type){

  const el=$(id);

  el.textContent=text;

  el.className=
    "message "+type;
}


function photo(element,url){

  element.innerHTML="";

  if(url){

    const img=document.createElement("img");

    img.src=url;

    element.appendChild(img);

  }else{

    element.textContent="👤";

  }
}


/* SUPABASE */

async function supabase(path,options={}){

  const response=
    await fetch(
      SUPABASE_URL+path,
      {
        ...options,
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY,
          "Content-Type":
            "application/json",
          ...(options.headers||{})
        }
      }
    );

  const text=
    await response.text();

  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.hint ||
      data?.error ||
      text ||
      "Supabase error"
    );

  }

  return data;
}


/* LOAD ADULTS */

async function loadAdults(){

  try{

    const data=
      await supabase(
        "/rest/v1/rpc/list_adults",
        {
          method:"POST",
          body:"{}"
        }
      );

    adults=
      Array.isArray(data)
        ?data
        :[];

    if(adults.length===0){

      hide("adultSelector");
      show("noAccounts");

    }else{

      hide("noAccounts");
      show("adultSelector");

      if(selectedAdult>=adults.length){
        selectedAdult=0;
      }

      drawAdult();

    }

  }catch(error){

    console.error(error);

    message(
      "loginMessage",
      "Couldn't load adult accounts: "+
      error.message,
      "error"
    );

  }
}


/* DRAW SELECTED ADULT */

function drawAdult(){

  if(!adults.length)return;

  const adult=
    adults[selectedAdult];

  $("adultName").textContent=
    adult.name;

  photo(
    $("adultPhoto"),
    adult.photo_url
  );

  $("dots").innerHTML="";

  adults.forEach(
    function(_,index){

      const dot=
        document.createElement("div");

      dot.className=
        "dot "+
        (
          index===selectedAdult
          ?"active"
          :""
        );

      $("dots").appendChild(dot);

    }
  );
}


/* ARROWS */

$("previous").onclick=function(){

  if(!adults.length)return;

  selectedAdult--;

  if(selectedAdult<0)
    selectedAdult=
      adults.length-1;

  drawAdult();
};


$("next").onclick=function(){

  if(!adults.length)return;

  selectedAdult++;

  if(selectedAdult>=adults.length)
    selectedAdult=0;

  drawAdult();
};


/* PHOTO CONVERSION */

function convertPhoto(file){

  return new Promise(
    function(resolve,reject){

      const reader=
        new FileReader();

      reader.onload=function(){

        const image=
          new Image();

        image.onload=function(){

          const canvas=
            document.createElement("canvas");

          const max=500;

          let w=image.width;
          let h=image.height;

          if(w>h){

            h=h*(max/w);
            w=max;

          }else{

            w=w*(max/h);
            h=max;

          }

          canvas.width=w;
          canvas.height=h;

          canvas
            .getContext("2d")
            .drawImage(
              image,
              0,
              0,
              w,
              h
            );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .7
            )
          );

        };

        image.onerror=reject;

        image.src=reader.result;

      };

      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );
}


/* OPEN ADD ADULT */

function openAdult(){

  $("newName").value="";
  $("newCode").value="";
  $("confirmCode").value="";

  $("newPhoto").dataset.photo="";

  photo(
    $("newPhoto"),
    ""
  );

  hide("loginMessage");
  hide("adultMessage");

  show("adultModal");
}


$("plusButton").onclick=openAdult;

$("addFirstAdult").onclick=openAdult;


$("cancelAdult").onclick=function(){

  hide("adultModal");

};


/* NEW PHOTO */

$("photoFile").onchange=
async function(){

  const file=
    this.files[0];

  if(!file)return;

  try{

    const result=
      await convertPhoto(file);

    $("newPhoto").dataset.photo=
      result;

    photo(
      $("newPhoto"),
      result
    );

  }catch{

    message(
      "adultMessage",
      "The photo could not be added.",
      "error"
    );

  }
};


/* CREATE ADULT */

$("createAdult").onclick=
async function(){

  hide("adultMessage");

  const name=
    $("newName").value.trim();

  const code=
    $("newCode").value.trim();

  const confirm=
    $("confirmCode").value.trim();

  const picture=
    $("newPhoto").dataset.photo||"";


  if(!name){

    message(
      "adultMessage",
      "Please enter the adult's name.",
      "error"
    );

    return;
  }


  if(!/^[0-9]{4}$/.test(code)){

    message(
      "adultMessage",
      "The code must be exactly 4 numbers.",
      "error"
    );

    return;
  }


  if(code!==confirm){

    message(
      "adultMessage",
      "The two codes don't match.",
      "error"
    );

    return;
  }


  const button=
    $("createAdult");

  button.disabled=true;
  button.textContent=
    "Creating...";


  try{

    await supabase(
      "/rest/v1/rpc/create_adult",
      {
        method:"POST",
        body:JSON.stringify({
          p_name:name,
          p_code:code,
          p_photo:picture
        })
      }
    );


    await loadAdults();


    const index=
      adults.findIndex(
        a=>
          a.name.toLowerCase()===
          name.toLowerCase()
      );


    if(index>=0){

      selectedAdult=index;

      drawAdult();

    }


    hide("adultModal");

    message(
      "loginMessage",
      name+
      " has been added. Select their account and enter their code.",
      "success"
    );


  }catch(error){

    message(
      "adultMessage",
      error.message,
      "error"
    );

  }


  button.disabled=false;
  button.textContent=
    "Create account";
};


/* LOGIN */

$("loginButton").onclick=
async function(){

  hide("loginMessage");

  if(!adults.length){

    message(
      "loginMessage",
      "No adult accounts yet. Tap + to add one.",
      "error"
    );

    return;
  }


  const adult=
    adults[selectedAdult];

  const code=
    $("loginCode").value.trim();


  if(!/^[0-9]{4}$/.test(code)){

    message(
      "loginMessage",
      "Please enter your 4-digit code.",
      "error"
    );

    return;
  }


  try{

    const result=
      await supabase(
        "/rest/v1/rpc/login_adult",
        {
          method:"POST",
          body:JSON.stringify({
            p_name:adult.name,
            p_code:code
          })
        }
      );


    currentAdult=
      Array.isArray(result)
      ?result[0]
      :result;


    localStorage.setItem(
      "acornAdult",
      JSON.stringify(currentAdult)
    );


    $("loginCode").value="";

    openApp();

  }catch(error){

    message(
      "loginMessage",
      "Incorrect code.",
      "error"
    );

  }

};


/* OPEN APP */

function openApp(){

  hide("loginScreen");

  show("app");

  $("menuName").textContent=
    currentAdult.name;

  photo(
    $("smallPhoto"),
    currentAdult.photo_url
  );

  $("date").value=
    currentDate;

  loadLists();
}


/* LOGOUT */

$("logout").onclick=function(){

  localStorage.removeItem(
    "acornAdult"
  );

  currentAdult=null;

  hide("menu");

  hide("app");

  show("loginScreen");

  $("loginCode").value="";

  loadAdults();
};


/* PROFILE MENU */

$("profileButton").onclick=function(){

  $("menu").classList.toggle(
    "hidden"
  );

};


$("addAnother").onclick=function(){

  hide("menu");

  openAdult();

};


$("editProfile").onclick=function(){

  hide("menu");

  $("profileName").value=
    currentAdult.name;

  $("profilePhoto").dataset.photo=
    currentAdult.photo_url||"";

  photo(
    $("profilePhoto"),
    currentAdult.photo_url
  );

  hide("profileMessage");

  show("profileModal");
};


$("cancelProfile").onclick=function(){

  hide("profileModal");

};


/* PROFILE PHOTO */

$("profileFile").onchange=
async function(){

  const file=
    this.files[0];

  if(!file)return;

  try{

    const result=
      await convertPhoto(file);

    $("profilePhoto").dataset.photo=
      result;

    photo(
      $("profilePhoto"),
      result
    );

  }catch{

    message(
      "profileMessage",
      "The photo could not be added.",
      "error"
    );

  }
};


/* SAVE PROFILE */

$("saveProfile").onclick=
async function(){

  const name=
    $("profileName").value.trim();

  const picture=
    $("profilePhoto").dataset.photo||"";


  if(!name){

    message(
      "profileMessage",
      "Please enter a name.",
      "error"
    );

    return;
  }


  try{

    await supabase(
      "/rest/v1/adults?id=eq."+
      encodeURIComponent(
        currentAdult.id
      ),
      {
        method:"PATCH",
        headers:{
          "Prefer":
            "return=minimal"
        },
        body:JSON.stringify({
          name:name,
          photo_url:picture
        })
      }
    );


    currentAdult.name=name;
    currentAdult.photo_url=
      picture;


    localStorage.setItem(
      "acornAdult",
      JSON.stringify(
        currentAdult
      )
    );


    $("menuName").textContent=
      name;

    photo(
      $("smallPhoto"),
      picture
    );


    await loadAdults();

    hide("profileModal");


  }catch(error){

    message(
      "profileMessage",
      error.message,
      "error"
    );

  }
};


/* DATE */

$("date").onchange=function(){

  currentDate=
    this.value;

  loadLists();

};


/* SNACK TABS */

$("amButton").onclick=function(){

  snackTime="am";

  $("amButton")
    .classList.add("active");

  $("pmButton")
    .classList.remove("active");

  $("snackHeading")
    .textContent="AM Snack";

  renderSnacks();
};


$("pmButton").onclick=function(){

  snackTime="pm";

  $("pmButton")
    .classList.add("active");

  $("amButton")
    .classList.remove("active");

  $("snackHeading")
    .textContent="PM Snack";

  renderSnacks();
};


/* NAVIGATION */

$("snackNav").onclick=function(){

  show("snackPage");
  hide("sunPage");

  $("snackNav")
    .classList.add("active");

  $("sunNav")
    .classList.remove("active");

};


$("sunNav").onclick=function(){

  hide("snackPage");
  show("sunPage");

  $("snackNav")
    .classList.remove("active");

  $("sunNav")
    .classList.add("active");

  renderSun();
};


/* LOAD LISTS */

async function loadLists(){

  try{

    snacks=
      await supabase(
        "/rest/v1/snack_lists?select=*&order=id.asc"
      );

    suncream=
      await supabase(
        "/rest/v1/suncream_lists?select=*&order=id.asc"
      );

    renderSnacks();
    renderSun();

  }catch(error){

    console.error(error);

  }
}


/* ADD SNACK */

$("addSnack").onclick=
async function(){

  const name=
    $("childName")
    .value
    .trim();

  if(!name){

    alert(
      "Please enter the child's name."
    );

    return;
  }


  try{

    await supabase(
      "/rest/v1/snack_lists",
      {
        method:"POST",
        headers:{
          "Prefer":
            "return=minimal"
        },
        body:JSON.stringify({

          adult_id:
            currentAdult.id,

          list_date:
            currentDate,

          snack_time:
            snackTime,

          child_name:
            name,

          allergy_status:
            $("allergy").value,

          alternative_milk:
            $("milk").value,

          done:false

        })
      }
    );


    $("childName").value="";
    $("milk").value="";

    loadLists();

  }catch(error){

    alert(error.message);

  }
};


/* RENDER SNACKS */

function renderSnacks(){

  const box=
    $("snackList");

  box.innerHTML="";


  const list=
    snacks.filter(
      x=>
        x.list_date===
        currentDate &&
        x.snack_time===
        snackTime
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No children added yet.</div>';

    return;
  }


  list.forEach(
    function(child){

      const item=
        document.createElement("div");

      item.className=
        "child";


      if(child.done)
        item.classList.add("done");


      const top=
        document.createElement("div");

      top.className=
        "child-top";


      const tick=
        document.createElement("button");

      tick.className=
        "tick";

      tick.textContent=
        child.done
        ?"✓"
        :"";


      tick.onclick=
      async function(){

        await supabase(
          "/rest/v1/snack_lists?id=eq."+
          child.id,
          {
            method:"PATCH",
            body:JSON.stringify({
              done:!child.done
            })
          }
        );

        loadLists();

      };


      const name=
        document.createElement("div");

      name.className=
        "child-name";

      name.textContent=
        child.child_name;


      const remove=
        document.createElement("button");

      remove.className=
        "remove";

      remove.textContent=
        "Remove";


      remove.onclick=
      async function(){

        if(!confirm(
          "Remove "+
          child.child_name+
          "?"
        ))return;


        await supabase(
          "/rest/v1/snack_lists?id=eq."+
          child.id,
          {
            method:"DELETE"
          }
        );

        loadLists();

      };


      top.append(
        tick,
        name,
        remove
      );

      item.appendChild(top);


      if(child.alternative_milk){

        const detail=
          document.createElement("div");

        detail.style.marginTop=
          "7px";

        detail.style.marginLeft=
          "43px";

        detail.textContent=
          "Alternative milk: "+
          child.alternative_milk;

        item.appendChild(detail);

      }


      box.appendChild(item);

    }
  );
}

/* START */

async function start(){

  $("date").value=
    currentDate;

  await loadAdults();


  const saved=
    localStorage.getItem(
      "acornAdult"
    );


  if(saved){

    try{

      currentAdult=
        JSON.parse(saved);

      if(currentAdult &&
         currentAdult.id){

        openApp();

      }

    }catch{

      localStorage.removeItem(
        "acornAdult"
      );

    }

  }

}


start();
