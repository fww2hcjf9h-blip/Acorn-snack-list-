<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

button,input,select{font:inherit}
button{cursor:pointer}

.main{

.card{

label{

input,select{

}

.row{

.field{

.green{

.tabs{

.child-top{

.child-name{

.small-btn{

.modal{

.photo-label{

</style>

<script>

const SUPABASE_URL =
"https://zzyyetnklrwzdzoraqqz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0";


let adults=[];
let adultIndex=0;
let currentAdult=null;

let entries=[];

let snackTime="am";
let groupTime="am";

let selectedDate=
new Date().toISOString().slice(0,10);


const $=id=>document.getElementById(id);


function show(id){
  $(id).classList.remove("hidden");
}


function hide(id){
  $(id).classList.add("hidden");
}


function setMessage(id,text,type){

  const e=$(id);

  e.textContent=text;

  e.className=
    "message "+type;
}


function setPhoto(element,url){

  element.innerHTML="";

  if(url){

    const img=
      document.createElement("img");

    img.src=url;

    element.appendChild(img);

  }else{

    element.textContent="👤";

  }
}


/* SUPABASE REQUEST */

async function db(path,options={}){

  const r=
    await fetch(
      SUPABASE_URL+path,
      {
        ...options,
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:
            "Bearer "+SUPABASE_KEY,
          "Content-Type":
            "application/json",
          ...(options.headers||{})
        }
      }
    );

  const text=
    await r.text();

  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!r.ok){

    throw new Error(
      data?.message ||
      data?.hint ||
      data?.error ||
      text ||
      "Database error"
    );

  }

  return data;
}


/* ADULTS */

async function loadAdults(){

  try{

    const data=
      await db(
        "/rest/v1/rpc/list_adults",
        {
          method:"POST",
          body:"{}"
        }
      );

    adults=
      Array.isArray(data)
      ?data
      :[];

    if(!adults.length){

      hide("selector");
      show("noAccounts");

    }else{

      hide("noAccounts");
      show("selector");

      if(adultIndex>=adults.length)
        adultIndex=0;

      drawAdult();

    }

  }catch(e){

    setMessage(
      "loginMessage",
      e.message,
      "error"
    );

  }
}


function drawAdult(){

  if(!adults.length)return;

  const adult=
    adults[adultIndex];

  $("adultName").textContent=
    adult.name;

  setPhoto(
    $("adultPhoto"),
    adult.photo_url
  );

  $("dots").innerHTML="";

  adults.forEach(
    (_,i)=>{

      const d=
        document.createElement("div");

      d.className=
        "dot "+
        (i===adultIndex?"active":"");

      $("dots").appendChild(d);

    }
  );

}


$("left").onclick=function(){

  if(!adults.length)return;

  adultIndex--;

  if(adultIndex<0)
    adultIndex=adults.length-1;

  drawAdult();

};


$("right").onclick=function(){

  if(!adults.length)return;

  adultIndex++;

  if(adultIndex>=adults.length)
    adultIndex=0;

  drawAdult();

};


/* PHOTO */

function resizePhoto(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=()=>{

        const img=
          new Image();

        img.onload=()=>{

          const canvas=
            document.createElement("canvas");

          const max=500;

          let w=img.width;
          let h=img.height;

          if(w>h){

            h*=max/w;
            w=max;

          }else{

            w*=max/h;
            h=max;

          }

          canvas.width=w;
          canvas.height=h;

          canvas
            .getContext("2d")
            .drawImage(
              img,0,0,w,h
            );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .72
            )
          );

        };

        img.onerror=reject;
        img.src=reader.result;

      };

      reader.onerror=reject;
      reader.readAsDataURL(file);

    }
  );

}


/* ADD ADULT */

function openAdult(){

  $("newAdultName").value="";
  $("newCode").value="";
  $("confirmCode").value="";

  $("newPhoto").dataset.photo="";

  setPhoto(
    $("newPhoto"),
    ""
  );

  hide("adultError");
  show("adultModal");

}


$("plus").onclick=openAdult;
$("firstAdd").onclick=openAdult;


$("cancelAdult").onclick=()=>
  hide("adultModal");


$("newPhotoFile").onchange=
async function(){

  if(!this.files[0])return;

  try{

    const p=
      await resizePhoto(
        this.files[0]
      );

    $("newPhoto").dataset.photo=p;

    setPhoto(
      $("newPhoto"),
      p
    );

  }catch{

    setMessage(
      "adultError",
      "Couldn't add that photo.",
      "error"
    );

  }

};


$("createAdult").onclick=
async function(){

  const name=
    $("newAdultName")
    .value.trim();

  const code=
    $("newCode")
    .value.trim();

  const confirm=
    $("confirmCode")
    .value.trim();

  const photo=
    $("newPhoto").dataset.photo||"";


  if(!name){

    setMessage(
      "adultError",
      "Please enter a name.",
      "error"
    );

    return;
  }

  if(!/^\d{4}$/.test(code)){

    setMessage(
      "adultError",
      "The code must be exactly 4 numbers.",
      "error"
    );

    return;
  }

  if(code!==confirm){

    setMessage(
      "adultError",
      "The codes don't match.",
      "error"
    );

    return;
  }


  try{

    await db(
      "/rest/v1/rpc/create_adult",
      {
        method:"POST",
        body:JSON.stringify({
          p_name:name,
          p_code:code,
          p_photo:photo
        })
      }
    );

    hide("adultModal");

    await loadAdults();

    const i=
      adults.findIndex(
        a=>
          a.name.toLowerCase()===
          name.toLowerCase()
      );

    if(i>=0){

      adultIndex=i;

      drawAdult();

    }

    setMessage(
      "loginMessage",
      "Adult added. Select the account and enter the code.",
      "success"
    );

  }catch(e){

    setMessage(
      "adultError",
      e.message,
      "error"
    );

  }

};


/* LOGIN */

$("loginBtn").onclick=
async function(){

  if(!adults.length){

    setMessage(
      "loginMessage",
      "There are no adult accounts yet. Tap + to add one.",
      "error"
    );

    return;
  }


  const adult=
    adults[adultIndex];

  const code=
    $("loginCode")
    .value.trim();


  if(!/^\d{4}$/.test(code)){

    setMessage(
      "loginMessage",
      "Enter your 4-digit code.",
      "error"
    );

    return;
  }


  try{

    const result=
      await db(
        "/rest/v1/rpc/login_adult",
        {
          method:"POST",
          body:JSON.stringify({
            p_name:adult.name,
            p_code:code
          })
        }
      );

    currentAdult=
      Array.isArray(result)
      ?result[0]
      :result;

    localStorage.setItem(
      "acornAdult",
      JSON.stringify(
        currentAdult
      )
    );

    $("loginCode").value="";

    openApp();

  }catch{

    setMessage(
      "loginMessage",
      "Incorrect code.",
      "error"
    );

  }

};


/* APP */

function openApp(){

  hide("loginScreen");
  show("app");

  $("menuName").textContent=
    currentAdult.name;

  setPhoto(
    $("smallPhoto"),
    currentAdult.photo_url
  );

  $("date").value=
    selectedDate;

  loadEntries();

}


/* LOGOUT */

$("logout").onclick=function(){

  localStorage.removeItem(
    "acornAdult"
  );

  currentAdult=null;

  hide("menu");
  hide("app");

  show("loginScreen");

  loadAdults();

};


/* PROFILE MENU */

$("profileBtn").onclick=()=>
  $("menu").classList.toggle("hidden");


$("addAdultAgain").onclick=()=>{

  hide("menu");
  openAdult();

};


$("editProfile").onclick=()=>{

  hide("menu");

  $("profileName").value=
    currentAdult.name;

  $("profilePhoto").dataset.photo=
    currentAdult.photo_url||"";

  setPhoto(
    $("profilePhoto"),
    currentAdult.photo_url
  );

  hide("profileError");

  show("profileModal");

};


$("cancelProfile").onclick=()=>
  hide("profileModal");


$("profileFile").onchange=
async function(){

  if(!this.files[0])return;

  try{

    const p=
      await resizePhoto(
        this.files[0]
      );

    $("profilePhoto").dataset.photo=p;

    setPhoto(
      $("profilePhoto"),
      p
    );

  }catch{

    setMessage(
      "profileError",
      "Couldn't add that photo.",
      "error"
    );

  }

};


$("saveProfile").onclick=
async function(){

  const name=
    $("profileName")
    .value.trim();

  const photo=
    $("profilePhoto")
    .dataset.photo||"";


  if(!name){

    setMessage(
      "profileError",
      "Please enter a name.",
      "error"
    );

    return;
  }


  try{

    await db(
      "/rest/v1/adults?id=eq."+
      encodeURIComponent(
        currentAdult.id
      ),
      {
        method:"PATCH",
        headers:{
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          name:name,
          photo_url:photo
        })
      }
    );


    currentAdult.name=name;
    currentAdult.photo_url=photo;

    localStorage.setItem(
      "acornAdult",
      JSON.stringify(
        currentAdult
      )
    );

    $("menuName").textContent=name;

    setPhoto(
      $("smallPhoto"),
      photo
    );

    await loadAdults();

    hide("profileModal");

  }catch(e){

    setMessage(
      "profileError",
      e.message,
      "error"
    );

  }

};


/* DATE */

$("date").onchange=function(){

  selectedDate=this.value;

  loadEntries();

};


/* LOAD SHARED ENTRIES */

async function loadEntries(){

  try{

    entries=
      await db(
        "/rest/v1/acorn_entries?select=*&order=id.asc"
      );

    renderSnacks();
    renderGroup();
    renderSun();

  }catch(e){

    console.error(e);

  }

}


/* SNACK AM PM */

$("amBtn").onclick=()=>{

  snackTime="am";

  $("amBtn").classList.add("active");
  $("pmBtn").classList.remove("active");

  $("listTitle").textContent=
    "AM Snack List";

  renderSnacks();

};


$("pmBtn").onclick=()=>{

  snackTime="pm";

  $("pmBtn").classList.add("active");
  $("amBtn").classList.remove("active");

  $("listTitle").textContent=
    "PM Snack List";

  renderSnacks();

};


/* ADD CHILD */

$("addChild").onclick=
async function(){

  const name=
    $("childName")
    .value.trim();

  if(!name){

    alert("Please enter the child's name.");

    return;

  }


  try{

    await db(
      "/rest/v1/acorn_entries",
      {
        method:"POST",
        headers:{
          Prefer:"return=minimal"
        },
        body:JSON.stringify({

          list_date:selectedDate,

          snack_time:snackTime,

          child_name:name,

          allergy_status:
            $("allergy").value,

          alternative_milk:
            $("milk").value.trim(),

          amount:"",

          food:"",

          done:false

        })
      }
    );


    $("childName").value="";
    $("milk").value="";

    await loadEntries();

  }catch(e){

    alert(e.message);

  }

};


/* RENDER SNACK LIST */

function renderSnacks(){

  const box=
    $("snackList");

  box.innerHTML="";


  const list=
    entries.filter(
      e=>
        e.list_date===selectedDate &&
        e.snack_time===snackTime &&
        !e.suncream_product
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No children added yet.</div>';

    return;

  }


  list.forEach(e=>{

    const item=
      document.createElement("div");

    item.className=
      "child "+
      (e.done?"done":"");


    const top=
      document.createElement("div");

    top.className="child-top";


    const tick=
      document.createElement("button");

    tick.className="tick";

    tick.textContent=
      e.done?"✓":"";


    tick.onclick=
    ()=>toggleDone(e);


    const name=
      document.createElement("div");

    name.className="child-name";

    name.textContent=
      e.child_name;


    const edit=
      document.createElement("button");

    edit.className=
      "small-btn edit-btn";

    edit.textContent="✏️ Edit";

    edit.onclick=
      ()=>openChildEdit(e);


    const del=
      document.createElement("button");

    del.className=
      "small-btn delete-btn";

    del.textContent="Delete";

    del.onclick=
      ()=>deleteEntry(e.id);


    top.append(
      tick,
      name,
      edit,
      del
    );


    item.appendChild(top);


    const details=
      document.createElement("div");

    details.className="details";


    let html="";


    if(e.allergy_status==="red")
      html+="🔴 Allergy<br>";

    if(e.allergy_status==="green")
      html+="🟢 Preference<br>";

    if(e.alternative_milk)
      html+=
        "<strong>Milk:</strong> "+
        escapeHtml(e.alternative_milk)+
        "<br>";


    if(e.amount)
      html+=
        "<strong>Amount:</strong> "+
        escapeHtml(e.amount)+
        "<br>";


    if(e.food)
      html+=
        "<strong>Had:</strong> "+
        escapeHtml(e.food);


    details.innerHTML=html;

    item.appendChild(details);


    box.appendChild(item);

  });

}


/* EDIT CHILD */

function openChildEdit(e){

  $("editId").value=e.id;

  $("editChildName").value=
    e.child_name||"";

  $("editAllergy").value=
    e.allergy_status||"none";

  $("editMilk").value=
    e.alternative_milk||"";

  $("editAmount").value=
    e.amount||"";

  $("editFood").value=
    e.food||"";

  show("childModal");

}


$("cancelChild").onclick=()=>
  hide("childModal");


$("saveChild").onclick=
async function(){

  const id=
    $("editId").value;


  try{

    await db(
      "/rest/v1/acorn_entries?id=eq."+id,
      {
        method:"PATCH",
        headers:{
          Prefer:"return=minimal"
        },
        body:JSON.stringify({

          child_name:
            $("editChildName")
            .value.trim(),

          allergy_status:
            $("editAllergy").value,

          alternative_milk:
            $("editMilk")
            .value.trim(),

          amount:
            $("editAmount")
            .value.trim(),

          food:
            $("editFood")
            .value.trim(),

          updated_at:
            new Date().toISOString()

        })
      }
    );


    hide("childModal");

    await loadEntries();

  }catch(e){

    alert(e.message);

  }

};


/* TOGGLE DONE */

async function toggleDone(e){

  try{

    await db(
      "/rest/v1/acorn_entries?id=eq."+e.id,
      {
        method:"PATCH",
        headers:{
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          done:!e.done
        })
      }
    );

    await loadEntries();

  }catch(err){

    alert(err.message);

  }

}


/* DELETE */

async function deleteEntry(id){

  if(!confirm(
    "Delete this child from the list?"
  ))return;


  try{

    await db(
      "/rest/v1/acorn_entries?id=eq."+id,
      {
        method:"DELETE"
      }
    );

    await loadEntries();

  }catch(e){

    alert(e.message);

  }

}


/* GROUPED PAGE */

$("groupAm").onclick=()=>{

  groupTime="am";

  $("groupAm").classList.add("active");
  $("groupPm").classList.remove("active");

  renderGroup();

};


$("groupPm").onclick=()=>{

  groupTime="pm";

  $("groupPm").classList.add("active");
  $("groupAm").classList.remove("active");

  renderGroup();

};


function renderGroup(){

  const box=
    $("groupList");

  box.innerHTML="";


  const list=
    entries.filter(
      e=>
        e.list_date===selectedDate &&
        e.snack_time===groupTime &&
        !e.suncream_product &&
        e.food
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">Nothing has been recorded yet.</div>';

    return;

  }


  const groups={};


  list.forEach(e=>{

    const amount=
      e.amount||"Amount not entered";

    const food=
      e.food||"Food not entered";

    const key=
      amount+"|||"+food;


    if(!groups[key])
      groups[key]=[];

    groups[key].push(e.child_name);

  });


  Object.keys(groups)
    .sort()
    .forEach(key=>{

      const parts=
        key.split("|||");

      const group=
        document.createElement("div");

      group.className=
        "group-box";


      const title=
        document.createElement("div");

      title.className=
        "group-title";

      title.textContent=
        parts[0]+" — "+parts[1];


      group.appendChild(title);


      groups[key]
        .forEach(name=>{

          const child=
            document.createElement("div");

          child.className=
            "group-child";

          child.textContent=
            "• "+name;

          group.appendChild(child);

        });


      box.appendChild(group);

    });

}


/* SUNCREAM */

$("addSun").onclick=
async function(){

  const name=
    $("sunChild")
    .value.trim();

  if(!name){

    alert(
      "Please enter the child's name."
    );

    return;

  }


  try{

    await db(
      "/rest/v1/acorn_entries",
      {
        method:"POST",
        headers:{
          Prefer:"return=minimal"
        },
        body:JSON.stringify({

          list_date:selectedDate,

          snack_time:"am",

          child_name:name,

          suncream_product:
            $("sunProduct")
            .value.trim(),

          suncream_done:false

        })
      }
    );


    $("sunChild").value="";
    $("sunProduct").value="";

    await loadEntries();

  }catch(e){

    alert(e.message);

  }

};


function renderSun(){

  const box=
    $("sunList");

  box.innerHTML="";


  const list=
    entries.filter(
      e=>
        e.list_date===selectedDate &&
        e.suncream_product
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No children added yet.</div>';

    return;

  }


  list.forEach(e=>{

    const item=
      document.createElement("div");

    item.className=
      "child "+
      (e.suncream_done?"done":"");


    const top=
      document.createElement("div");

    top.className="child-top";


    const tick=
      document.createElement("button");

    tick.className="tick";

    tick.textContent=
      e.suncream_done?"✓":"";


    tick.onclick=
    async()=>{

      await db(
        "/rest/v1/acorn_entries?id=eq."+e.id,
        {
          method:"PATCH",
          body:JSON.stringify({
            suncream_done:
              !e.suncream_done
          })
        }
      );

      loadEntries();

    };


    const name=
      document.createElement("div");

    name.className="child-name";

    name.textContent=
      e.child_name;


    const edit=
      document.createElement("button");

    edit.className=
      "small-btn edit-btn";

    edit.textContent="✏️ Edit";

    edit.onclick=()=>{

      $("sunChild").value=
        e.child_name;

      $("sunProduct").value=
        e.suncream_product;

      $("sunChild").focus();

    };


    top.append(
      tick,
      name,
      edit
    );


    item.appendChild(top);


    const details=
      document.createElement("div");

    details.className="details";

    details.innerHTML=
      "<strong>Product:</strong> "+
      escapeHtml(
        e.suncream_product
      );

    item.appendChild(details);


    box.appendChild(item);

  });

}


/* NAVIGATION */

$("snackNav").onclick=()=>{

  show("snackPage");
  hide("groupPage");
  hide("sunPage");

  $("snackNav").classList.add("active");
  $("groupNav").classList.remove("active");
  $("sunNav").classList.remove("active");

};


$("groupNav").onclick=()=>{

  hide("snackPage");
  show("groupPage");
  hide("sunPage");

  $("snackNav").classList.remove("active");
  $("groupNav").classList.add("active");
  $("sunNav").classList.remove("active");

  renderGroup();

};


$("sunNav").onclick=()=>{

  hide("snackPage");
  hide("groupPage");
  show("sunPage");

  $("snackNav").classList.remove("active");
  $("groupNav").classList.remove("active");
  $("sunNav").classList.add("active");

  renderSun();

};


/* ESCAPE HTML */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* START */

async function start(){

  $("date").value=
    selectedDate;

  await loadAdults();


  const saved=
    localStorage.getItem(
      "acornAdult"
    );


  if(saved){

    try{

      currentAdult=
        JSON.parse(saved);

      if(currentAdult?.id){

        openApp();

      }

    }catch{

      localStorage.removeItem(
        "acornAdult"
      );

    }

  }

}


start();

</script>
