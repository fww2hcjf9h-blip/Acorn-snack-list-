
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f3f7f3;
color:#29372d;
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:520px;
background:white;
border-radius:30px;
padding:30px 20px;
box-shadow:0 8px 35px rgba(0,0,0,.08);
text-align:center;
}

.logo{
font-size:52px;
font-weight:900;
color:#40774d;
}

.login-title{
font-size:28px;
font-weight:900;
margin:8px 0 25px;
}

.selector{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.arrow{
width:48px;
height:48px;
border:0;
border-radius:50%;
background:#e7eee8;
color:#40774d;
font-size:36px;
}

.adult-card{
width:245px;
min-height:320px;
border:4px solid #40774d;
border-radius:28px;
background:#f0f5f0;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.adult-photo{
width:175px;
height:175px;
border-radius:50%;
background:#dfe8df;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
}

.adult-photo img{
width:100%;
height:100%;
object-fit:cover;
}

.adult-name{
margin-top:15px;
font-size:27px;
font-weight:900;
color:#40774d;
}

.dots{
display:flex;
justify-content:center;
gap:6px;
margin:15px;
}

.dot{
width:8px;
height:8px;
border-radius:10px;
background:#ccd6cd;
}

.dot.active{
width:22px;
background:#40774d;
}

.no-account{
padding:20px;
}

.no-icon{
font-size:65px;
}

.no-text{
font-size:20px;
font-weight:800;
color:#687169;
margin:10px 0 20px;
}

.code{
text-align:center;
font-size:25px;
letter-spacing:8px;
}

.plus{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border:0;
border-radius:50%;
background:#40774d;
color:white;
font-size:40px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

/* GENERAL */

.green{
width:100%;
border:0;
border-radius:12px;
padding:14px;
background:#40774d;
color:white;
font-weight:900;
}

.grey{
width:100%;
border:0;
border-radius:12px;
padding:13px;
background:#e7eee8;
color:#315b3d;
font-weight:800;
margin-top:8px;
}

label{
display:block;
font-weight:800;
text-align:left;
margin:10px 0 6px;
}

input,select{
width:100%;
padding:13px;
border:2px solid #d5ded6;
border-radius:12px;
background:white;
}

.message{
padding:12px;
border-radius:12px;
margin:12px 0;
font-weight:800;
}

.error{
background:#f7dddd;
color:#922e2e;
}

.success{
background:#dff0e1;
color:#28613a;
}

/* APP */

.top{
background:#40774d;
color:white;
padding:12px 15px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:20;
}

.title{
font-size:24px;
font-weight:900;
}

.top-right{
display:flex;
align-items:center;
gap:8px;
}

.small-photo{
width:40px;
height:40px;
border-radius:50%;
background:#e2e9e2;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.small-photo img{
width:100%;
height:100%;
object-fit:cover;
}

.profile-btn{
border:0;
border-radius:10px;
padding:9px 12px;
color:#315b3d;
font-weight:800;
}

.nav{
display:flex;
gap:7px;
padding:8px;
background:white;
overflow-x:auto;
position:sticky;
top:64px;
z-index:15;
}

.nav button{
white-space:nowrap;
border:0;
border-radius:10px;
padding:10px 15px;
background:#e7eee8;
color:#315b3d;
font-weight:800;
}

.nav button.active{
background:#40774d;
color:white;
}

.main{
max-width:950px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:17px;
padding:16px;
margin-bottom:14px;
box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.tabs button{
flex:1;
border:0;
border-radius:11px;
padding:12px;
background:#e7eee8;
color:#315b3d;
font-weight:900;
}

.tabs button.active{
background:#40774d;
color:white;
}

/* CHILD */

.child{
border:1px solid #dce4dd;
border-radius:14px;
padding:12px;
margin-bottom:9px;
background:white;
}

.child.done{
background:#edf5ee;
}

.child-top{
display:flex;
align-items:center;
gap:7px;
}

.tick{
width:37px;
height:37px;
border:0;
border-radius:50%;
background:#e7eee8;
color:#40774d;
font-weight:900;
flex:none;
}

.done .tick{
background:#40774d;
color:white;
}

.child-name{
flex:1;
font-size:18px;
font-weight:900;
}

.record{
border:0;
border-radius:9px;
padding:9px 11px;
background:#e7eee8;
color:#315b3d;
font-weight:900;
flex:none;
}

.child-edit{
width:100%;
margin-top:10px;
border:0;
border-radius:10px;
padding:10px;
background:#eef2ee;
color:#315b3d;
font-weight:800;
}

.details{
margin:9px 0 0 44px;
line-height:1.5;
color:#59645b;
}

.empty{
text-align:center;
padding:25px;
color:#687169;
}

/* GROUP */

.group-box{
border:1px solid #dce4dd;
border-radius:14px;
padding:14px;
margin-bottom:12px;
}

.group-title{
font-size:19px;
font-weight:900;
color:#40774d;
margin-bottom:8px;
}

.group-child{
padding:4px 0;
font-weight:700;
}

/* MENU */

.menu{
position:fixed;
right:12px;
top:68px;
width:255px;
background:white;
border-radius:15px;
padding:14px;
box-shadow:0 5px 25px rgba(0,0,0,.2);
z-index:50;
}

.menu button{
width:100%;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
z-index:100;
background:rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.modal-box{
width:100%;
max-width:470px;
max-height:90vh;
overflow:auto;
background:white;
border-radius:22px;
padding:22px;
}

.preview{
width:125px;
height:125px;
border-radius:50%;
background:#e0e9e0;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
margin:10px auto 15px;
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
}

.photo-label{
display:block;
text-align:center;
padding:13px;
border-radius:12px;
background:#e7eee8;
color:#315b3d;
font-weight:800;
}

.photo-label input{
display:none;
}

/* AMOUNT */

.amount-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.amount{
border:2px solid #d5ded6;
background:white;
color:#315b3d;
border-radius:12px;
padding:14px 8px;
font-weight:900;
}

.amount.selected{
background:#40774d;
border-color:#40774d;
color:white;
}

@media(max-width:600px){

.adult-card{
width:220px;
}

.adult-photo{
width:150px;
height:150px;
}

.adult-name{
font-size:24px;
}

}
</style>
</head>

<script>

/*
==================================================
ACORN
This version works without Supabase for the
actual app controls.

Everything is stored in this browser.
==================================================
*/

const STORAGE_KEY="ACORN_FINAL_DATA";

let data={
adults:[],
entries:[]
};

let adultIndex=0;
let currentAdult=null;
let snackTime="am";
let groupTime="am";
let selectedDate=new Date().toISOString().slice(0,10);

let recordId=null;
let recordAmount="";


function $(id){
return document.getElementById(id);
}


function show(id){
$(id).classList.remove("hidden");
}


function hide(id){
$(id).classList.add("hidden");
}


function saveData(){
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);
}


function loadData(){

try{

const saved=
localStorage.getItem(STORAGE_KEY);

if(saved){

const parsed=
JSON.parse(saved);

if(parsed &&
Array.isArray(parsed.adults) &&
Array.isArray(parsed.entries)){

data=parsed;

}

}

}catch(error){

console.log(error);

}

}


function photo(element,url){

element.innerHTML="";

if(url){

const image=
document.createElement("img");

image.src=url;

image.onload=function(){

element.innerHTML="";
element.appendChild(image);

};

image.onerror=function(){
element.textContent="👤";
};

}else{

element.textContent="👤";

}

}


/* LOGIN */

function drawAdults(){

if(data.adults.length===0){

hide("selector");
show("noAccounts");

return;

}

hide("noAccounts");
show("selector");

if(adultIndex>=data.adults.length)
adultIndex=0;

const adult=
data.adults[adultIndex];

$("adultName").textContent=
adult.name;

/*
THIS IS THE PROFILE PHOTO.
It is taken directly from the selected
adult's saved profile.
*/

photo(
$("adultPhoto"),
adult.photo
);

$("dots").innerHTML="";

data.adults.forEach(
function(_,index){

const dot=
document.createElement("div");

dot.className=
"dot "+
(index===adultIndex?"active":"");

$("dots").appendChild(dot);

});

}


$("left").onclick=function(){

if(!data.adults.length)return;

adultIndex--;

if(adultIndex<0)
adultIndex=data.adults.length-1;

drawAdults();

};


$("right").onclick=function(){

if(!data.adults.length)return;

adultIndex++;

if(adultIndex>=data.adults.length)
adultIndex=0;

drawAdults();

};


/* ADD ADULT */

function openAdult(){

$("newAdultName").value="";
$("newCode").value="";
$("confirmCode").value="";

$("newPhoto").dataset.photo="";

photo(
$("newPhoto"),
""
);

hide("adultError");

show("adultModal");

}


$("plus").onclick=openAdult;
$("firstAdd").onclick=openAdult;


$("cancelAdult").onclick=function(){
hide("adultModal");
};


$("newPhotoFile").onchange=function(){

const file=this.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(){

$("newPhoto").dataset.photo=
reader.result;

photo(
$("newPhoto"),
reader.result
);

};

reader.readAsDataURL(file);

};


$("createAdult").onclick=function(){

const name=
$("newAdultName")
.value.trim();

const code=
$("newCode")
.value.trim();

const confirm=
$("confirmCode")
.value.trim();

const picture=
$("newPhoto").dataset.photo||"";


if(!name){

$("adultError").textContent=
"Please enter the adult's name.";

$("adultError").className=
"message error";

return;

}


if(!/^[0-9]{4}$/.test(code)){

$("adultError").textContent=
"Code must be exactly 4 numbers.";

$("adultError").className=
"message error";

return;

}


if(code!==confirm){

$("adultError").textContent=
"The codes don't match.";

$("adultError").className=
"message error";

return;

}


const exists=
data.adults.some(
adult=>
adult.name.toLowerCase()===
name.toLowerCase()
);


if(exists){

$("adultError").textContent=
"That adult already exists.";

$("adultError").className=
"message error";

return;

}


const adult={
id:Date.now().toString(),
name:name,
code:code,
photo:picture
};


data.adults.push(adult);

saveData();

adultIndex=
data.adults.length-1;

hide("adultModal");

drawAdults();

$("loginMessage").textContent=
name+" has been added. Select them and enter their code.";

$("loginMessage").className=
"message success";

};


/* LOGIN */

$("loginBtn").onclick=function(){

if(!data.adults.length){

$("loginMessage").textContent=
"No adult accounts yet.";

$("loginMessage").className=
"message error";

return;

}


const adult=
data.adults[adultIndex];

const code=
$("loginCode").value.trim();


if(code!==adult.code){

$("loginMessage").textContent=
"Incorrect code.";

$("loginMessage").className=
"message error";

return;

}


currentAdult=adult;

localStorage.setItem(
"ACORN_CURRENT_ADULT",
adult.id
);

$("loginCode").value="";

openApp();

};


function openApp(){

hide("loginScreen");
show("app");

$("menuName").textContent=
currentAdult.name;

photo(
$("smallPhoto"),
currentAdult.photo
);

$("date").value=
selectedDate;

renderAll();

}


/* LOGOUT */

$("logout").onclick=function(){

currentAdult=null;

localStorage.removeItem(
"ACORN_CURRENT_ADULT"
);

hide("menu");
hide("app");
show("loginScreen");

$("loginCode").value="";

drawAdults();

};


/* PROFILE */

$("profileBtn").onclick=function(){

$("menu").classList.toggle(
"hidden"
);

};


$("editProfile").onclick=function(){

hide("menu");

$("profileName").value=
currentAdult.name;

$("profilePhoto").dataset.photo=
currentAdult.photo||"";

photo(
$("profilePhoto"),
currentAdult.photo
);

hide("profileError");

show("profileModal");

};


$("cancelProfile").onclick=function(){
hide("profileModal");
};


$("profileFile").onchange=function(){

const file=this.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(){

$("profilePhoto").dataset.photo=
reader.result;

photo(
$("profilePhoto"),
reader.result
);

};

reader.readAsDataURL(file);

};


$("saveProfile").onclick=function(){

const name=
$("profileName")
.value.trim();

if(!name){

$("profileError").textContent=
"Please enter a name.";

$("profileError").className=
"message error";

return;

}


currentAdult.name=name;

currentAdult.photo=
$("profilePhoto").dataset.photo||"";


const index=
data.adults.findIndex(
adult=>
adult.id===currentAdult.id
);


if(index!==-1){

data.adults[index]=currentAdult;

}

saveData();

$("menuName").textContent=
currentAdult.name;

photo(
$("smallPhoto"),
currentAdult.photo
);

hide("profileModal");

drawAdults();

};


$("addAdultAgain").onclick=function(){

hide("menu");

openAdult();

};


/* DATE */

$("date").onchange=function(){

selectedDate=this.value;

renderAll();

};


/* AM / PM */

$("amBtn").onclick=function(){

snackTime="am";

$("amBtn").classList.add("active");
$("pmBtn").classList.remove("active");

$("listTitle").textContent=
"AM Snack List";

renderSnacks();

};


$("pmBtn").onclick=function(){

snackTime="pm";

$("pmBtn").classList.add("active");
$("amBtn").classList.remove("active");

$("listTitle").textContent=
"PM Snack List";

renderSnacks();

};


/* ADD CHILD */

$("addChild").onclick=function(){

const name=
$("childName")
.value.trim();

if(!name){

alert("Please enter the child's name.");

return;

}


const entry={

id:Date.now().toString(),

date:selectedDate,

time:snackTime,

child:name,

allergy:$("allergy").value,

milk:$("milk").value.trim(),

amount:"",

food:"",

done:false

};


data.entries.push(entry);

saveData();

$("childName").value="";
$("milk").value="";

renderAll();

};


/* SNACK LIST */

function getSnacks(){

return data.entries.filter(
entry=>
entry.date===selectedDate &&
entry.time===snackTime
);

}


function renderSnacks(){

const box=
$("snackList");

box.innerHTML="";

const list=getSnacks();


if(!list.length){

box.innerHTML=
'<div class="empty">No children added yet.</div>';

return;

}


list.forEach(function(entry){

const child=
document.createElement("div");

child.className=
"child "+
(entry.done?"done":"");


const top=
document.createElement("div");

top.className="child-top";


const tick=
document.createElement("button");

tick.className="tick";

tick.textContent=
entry.done?"✓":"";

tick.onclick=function(){

entry.done=!entry.done;

saveData();

renderAll();

};


const name=
document.createElement("div");

name.className="child-name";

name.textContent=
entry.child;


const record=
document.createElement("button");

record.className="record";

record.textContent="📝";

record.title=
"Record what they had";

record.onclick=function(){

openRecord(entry);

};


top.append(
tick,
name,
record
);


child.appendChild(top);


const details=
document.createElement("div");

details.className="details";

let text="";


if(entry.allergy==="red")
text+="🔴 Allergy<br>";

if(entry.allergy==="green")
text+="🟢 Preference<br>";

if(entry.milk)
text+="Milk: "+entry.milk+"<br>";

if(entry.amount)
text+="Amount: <strong>"+entry.amount+"</strong><br>";

if(entry.food)
text+="Had: <strong>"+entry.food+"</strong>";


details.innerHTML=text;

child.appendChild(details);


const edit=
document.createElement("button");

edit.className="child-edit";

edit.textContent=
"✏️ Edit child details";

edit.onclick=function(){

openChildEditor(entry);

};

child.appendChild(edit);

box.appendChild(child);

});

}


/* RECORD */

function openRecord(entry){

recordId=entry.id;

recordAmount=
entry.amount||"";

$("recordChildName").textContent=
entry.child;

$("recordFood").value=
entry.food||"";


document
.querySelectorAll(".amount")
.forEach(
button=>{
button.classList.toggle(
"selected",
button.dataset.value===recordAmount
);
}
);

show("recordModal");

}


document
.querySelectorAll(".amount")
.forEach(
button=>{

button.onclick=function(){

recordAmount=
this.dataset.value;

document
.querySelectorAll(".amount")
.forEach(
b=>b.classList.remove("selected")
);

this.classList.add("selected");

};

});


$("cancelRecord").onclick=function(){

hide("recordModal");

recordId=null;

};


$("saveRecord").onclick=function(){

if(!recordId)return;

const entry=
data.entries.find(
e=>e.id===recordId
);

if(!entry)return;

entry.amount=
recordAmount;

entry.food=
$("recordFood")
.value.trim();

saveData();

hide("recordModal");

recordId=null;

renderAll();

};


/* EDIT CHILD */

function openChildEditor(entry){

$("editId").value=
entry.id;

$("editChildName").value=
entry.child;

$("editAllergy").value=
entry.allergy||"none";

$("editMilk").value=
entry.milk||"";

show("childModal");

}


$("cancelChild").onclick=function(){
hide("childModal");
};


$("saveChild").onclick=function(){

const id=
$("editId").value;

const entry=
data.entries.find(
e=>e.id===id
);

if(!entry)return;

entry.child=
$("editChildName")
.value.trim();

entry.allergy=
$("editAllergy").value;

entry.milk=
$("editMilk")
.value.trim();

saveData();

hide("childModal");

renderAll();

};


/* GROUP */

$("groupAm").onclick=function(){

groupTime="am";

$("groupAm").classList.add("active");
$("groupPm").classList.remove("active");

renderGroup();

};


$("groupPm").onclick=function(){

groupTime="pm";

$("groupPm").classList.add("active");
$("groupAm").classList.remove("active");

renderGroup();

};


function renderGroup(){

const box=
$("groupList");

box.innerHTML="";


const list=
data.entries.filter(
entry=>
entry.date===selectedDate &&
entry.time===groupTime &&
entry.food
);


if(!list.length){

box.innerHTML=
'<div class="empty">Nothing has been recorded yet.</div>';

return;

}


const groups={};


list.forEach(function(entry){

const amount=
entry.amount||"Amount not recorded";

const food=
entry.food||"Food not recorded";

const key=
amount+"|||"+food;

if(!groups[key])
groups[key]=[];

groups[key].push(entry.child);

});


Object.keys(groups)
.forEach(function(key){

const parts=
key.split("|||");

const group=
document.createElement("div");

group.className=
"group-box";


const title=
document.createElement("div");

title.className=
"group-title";

title.textContent=
parts[0]+" — "+parts[1];

group.appendChild(title);


groups[key].forEach(function(childName){

const child=
document.createElement("div");

child.className=
"group-child";

child.textContent=
"• "+childName;

group.appendChild(child);

});


box.appendChild(group);

});

}


/* SUNCREAM */

function getSuncream(){

return data.entries.filter(
entry=>
entry.date===selectedDate &&
entry.suncream===true
);

}


$("addSun").onclick=function(){

const name=
$("sunChild")
.value.trim();

if(!name){

alert("Please enter the child's name.");

return;

}


const entry={

id:Date.now().toString(),

date:selectedDate,

time:"sun",

child:name,

allergy:"none",

milk:"",

amount:"",

food:"",

done:false,

suncream:true,

product:
$("sunProduct")
.value.trim(),

sunDone:false

};


data.entries.push(entry);

saveData();

$("sunChild").value="";
$("sunProduct").value="";

renderSun();

};


function renderSun(){

const box=
$("sunList");

box.innerHTML="";

const list=
getSuncream();


if(!list.length){

box.innerHTML=
'<div class="empty">No children added yet.</div>';

return;

}


list.forEach(function(entry){

const child=
document.createElement("div");

child.className=
"child "+
(entry.sunDone?"done":"");


const top=
document.createElement("div");

top.className=
"child-top";


const tick=
document.createElement("button");

tick.className="tick";

tick.textContent=
entry.sunDone?"✓":"";

tick.onclick=function(){

entry.sunDone=!entry.sunDone;

saveData();

renderSun();

};


const name=
document.createElement("div");

name.className="child-name";

name.textContent=
entry.child;


top.append(
tick,
name
);

child.appendChild(top);


const details=
document.createElement("div");

details.className="details";

details.textContent=
"Product: "+
(entry.product||"Not entered");

child.appendChild(details);


box.appendChild(child);

});

}


/* NAVIGATION */

$("snackNav").onclick=function(){

show("snackPage");
hide("groupPage");
hide("sunPage");

$("snackNav").classList.add("active");
$("groupNav").classList.remove("active");
$("sunNav").classList.remove("active");

};


$("groupNav").onclick=function(){

hide("snackPage");
show("groupPage");
hide("sunPage");

$("snackNav").classList.remove("active");
$("groupNav").classList.add("active");
$("sunNav").classList.remove("active");

renderGroup();

};


$("sunNav").onclick=function(){

hide("snackPage");
hide("groupPage");
show("sunPage");

$("snackNav").classList.remove("active");
$("groupNav").classList.remove("active");
$("sunNav").classList.add("active");

renderSun();

};


/* RENDER EVERYTHING */

function renderAll(){

renderSnacks();
renderGroup();
renderSun();

}


/* START */

function start(){

loadData();

$("date").value=
selectedDate;

drawAdults();


const savedAdult=
localStorage.getItem(
"ACORN_CURRENT_ADULT"
);


if(savedAdult){

const adult=
data.adults.find(
a=>a.id===savedAdult
);


if(adult){

currentAdult=adult;

openApp();

}

}

}


start();

</script>

</body>
</html>
