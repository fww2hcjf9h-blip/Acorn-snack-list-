<!-- SUPABASE LIBRARY -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const supabase = window.supabase.createClient(
"https://zzyyetnklrwzdzoraqqz.supabase.co",
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0"
);


const $ = id => document.getElementById(id);

let adults=[];
let adultIndex=0;
let currentAdult=null;

let currentDate=new Date()
.toLocaleDateString("en-CA");

let snackTime="am";
let groupedTime="am";

let database={};

let noteOpen=null;


/* -------------------------
HELPERS
------------------------- */

function showMessage(id,text,type){

const box=$(id);

box.textContent=text;

box.className="message "+type;

}


function hideMessage(id){

$(id).className="message hidden";

}


function makeDay(date){

if(!database[date]){

database[date]={
am:[],
pm:[],
suncream:[]
};

}

}


function setImage(element,url){

element.innerHTML="";

if(url){

const img=document.createElement("img");

img.src=url;

element.appendChild(img);

}else{

element.textContent="👤";

}

}


function compressPhoto(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const max=500;

let w=img.width;
let h=img.height;

if(w>h && w>max){

h*=max/w;
w=max;

}

if(h>w && h>max){

w*=max/h;
h=max;

}

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

canvas
.getContext("2d")
.drawImage(img,0,0,w,h);

resolve(
canvas.toDataURL("image/jpeg",.72)
);

};

img.onerror=reject;

img.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

}


/* -------------------------
ADULTS
------------------------- */

async function loadAdults(){

const result=await supabase
.from("adults")
.select("id,name,photo_url")
.order("name");

if(result.error){

console.error(result.error);

showMessage(
"loginMessage",
"Could not load adult accounts.",
"error"
);

return;

}

adults=result.data||[];

if(adultIndex>=adults.length){

adultIndex=Math.max(0,adults.length-1);

}

renderAdults();

}


function renderAdults(){

if(!adults.length){

$("profileCarousel").classList.add("hidden");

$("dots").classList.add("hidden");

$("loginArea").classList.add("hidden");

$("noAdults").classList.remove("hidden");

return;

}

$("profileCarousel").classList.remove("hidden");

$("dots").classList.remove("hidden");

$("loginArea").classList.remove("hidden");

$("noAdults").classList.add("hidden");

const adult=adults[adultIndex];

$("loginName").textContent=adult.name;

setImage(
$("loginPhoto"),
adult.photo_url
);

$("dots").innerHTML="";

adults.forEach((a,i)=>{

const dot=document.createElement("div");

dot.className=
"dot"+(i===adultIndex?" active":"");

$("dots").appendChild(dot);

});

}


$("prevAdult").onclick=()=>{

if(!adults.length)return;

adultIndex--;

if(adultIndex<0){

adultIndex=adults.length-1;

}

renderAdults();

};


$("nextAdult").onclick=()=>{

if(!adults.length)return;

adultIndex++;

if(adultIndex>=adults.length){

adultIndex=0;

}

renderAdults();

};


/* -------------------------
LOGIN
------------------------- */

async function login(){

hideMessage("loginMessage");

if(!adults.length){

showMessage(
"loginMessage",
"No adult accounts have been created yet.",
"error"
);

return;

}

const adult=adults[adultIndex];

const code=$("loginCode").value.trim();

if(!/^[0-9]{4}$/.test(code)){

showMessage(
"loginMessage",
"Please enter your 4-digit code.",
"error"
);

return;

}


/*
Uses the adult login function
created in the Supabase SQL.
*/

const result=await supabase.rpc(
"login_adult",
{
p_name:adult.name,
p_code:code
}
);

if(result.error){

console.error(result.error);

showMessage(
"loginMessage",
"Incorrect code.",
"error"
);

return;

}

let returned=result.data;

if(Array.isArray(returned)){

returned=returned[0];

}

currentAdult={
...adult,
...(returned||{})
};

localStorage.setItem(
"acornAdult",
JSON.stringify(currentAdult)
);

$("loginCode").value="";

await showApp();

}


$("loginButton").onclick=login;


$("loginCode").onkeydown=e=>{

if(e.key==="Enter")login();

};


/* -------------------------
ADD ADULT
------------------------- */

function openAdultModal(){

$("adultModal").classList.remove("hidden");

$("newName").value="";
$("newCode").value="";
$("newConfirm").value="";

$("newPhoto").dataset.photo="";

setImage($("newPhoto"),"");

hideMessage("adultMessage");

}


$("addLogin").onclick=openAdultModal;


$("addAdult").onclick=()=>{

$("profileMenu").classList.add("hidden");

openAdultModal();

};


$("closeAdult").onclick=()=>{

$("adultModal").classList.add("hidden");

};


$("newPhotoFile").onchange=async function(){

const file=this.files[0];

if(!file)return;

try{

const photo=await compressPhoto(file);

$("newPhoto").dataset.photo=photo;

setImage(
$("newPhoto"),
photo
);

}catch(e){

alert("The photo could not be used.");

}

};


$("createAdult").onclick=async()=>{

hideMessage("adultMessage");

const name=$("newName").value.trim();

const code=$("newCode").value.trim();

const confirmCode=$("newConfirm").value.trim();

if(!name){

showMessage(
"adultMessage",
"Please enter the adult's name.",
"error"
);

return;

}

if(!/^[0-9]{4}$/.test(code)){

showMessage(
"adultMessage",
"Code must be exactly 4 numbers.",
"error"
);

return;

}

if(code!==confirmCode){

showMessage(
"adultMessage",
"The codes do not match.",
"error"
);

return;

}


const result=await supabase.rpc(
"create_adult",
{
p_name:name,
p_code:code
}
);

if(result.error){

console.error(result.error);

showMessage(
"adultMessage",
result.error.message,
"error"
);

return;

}

let newAdult=result.data;

if(Array.isArray(newAdult)){

newAdult=newAdult[0];

}

if(!newAdult || !newAdult.id){

showMessage(
"adultMessage",
"Account was created but no account ID was returned.",
"error"
);

return;

}


const photo=
$("newPhoto").dataset.photo||"";


if(photo){

const photoResult=await supabase
.from("adults")
.update({
photo_url:photo
})
.eq("id",newAdult.id);

if(photoResult.error){

console.error(photoResult.error);

showMessage(
"adultMessage",
"Account created, but the photo could not be saved.",
"error"
);

return;

}

}


showMessage(
"adultMessage",
"Adult account created!",
"success"
);

await loadAdults();

const index=adults.findIndex(
a=>a.id===newAdult.id
);

if(index>=0){

adultIndex=index;

renderAdults();

}

setTimeout(()=>{

$("adultModal").classList.add("hidden");

},700);

};

/* -------------------------
DATABASE
------------------------- */

async function loadDatabase(){

database={};

const snacks=await supabase
.from("snack_lists")
.select("*")
.order("list_date")
.order("id");

if(snacks.error){

alert(snacks.error.message);

return;

}

const sun=await supabase
.from("suncream_lists")
.select("*")
.order("list_date")
.order("id");

if(sun.error){

alert(sun.error.message);

return;

}


(snacks.data||[]).forEach(item=>{

makeDay(item.list_date);

const list=
item.snack_time==="am"
?database[item.list_date].am
:database[item.list_date].pm;

list.push({

id:item.id,
name:item.child_name,
status:item.allergy_status||"none",
milk:item.alternative_milk||"",
done:!!item.done,
amount:item.amount||"",
food:item.food||""

});

});


(sun.data||[]).forEach(item=>{

makeDay(item.list_date);

database[item.list_date].suncream.push({

id:item.id,
name:item.child_name,
product:item.product||"",
done:!!item.done

});

});

}

);

);

}

/* -------------------------
SNACKS
------------------------- */

async function addSnack(){

const name=$("childName").value.trim();

if(!name){

alert("Please enter the child's name.");

return;

}

const result=await supabase
.from("snack_lists")
.insert({

user_id:currentAdult.id,

list_date:currentDate,

snack_time:snackTime,

child_name:name,

allergy_status:$("allergy").value,

alternative_milk:$("milk").value.trim(),

done:false,

amount:"",

food:""

});

if(result.error){

alert(result.error.message);

return;

}

$("childName").value="";

$("milk").value="";

$("allergy").value="none";

await loadDatabase();

renderSnacks();

}


$("addSnack").onclick=addSnack;


function renderSnacks(){

makeDay(currentDate);

const list=
database[currentDate][snackTime];

const box=$("snackList");

box.innerHTML="";

if(!list.length){

box.innerHTML=
'<div class="empty">No children added yet.</div>';

return;

}


list.forEach((child,index)=>{

const item=document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=document.createElement("div");

top.className="child-top";


const tick=document.createElement("button");

tick.className="tick";

tick.textContent=
child.done?"✓":"";

tick.onclick=async()=>{

const result=await supabase
.from("snack_lists")
.update({done:!child.done})
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

child.done=!child.done;

renderSnacks();

};


const name=document.createElement("div");

name.className="child-name";

name.textContent=child.name;


const badge=document.createElement("span");

badge.className="badge "+
(
child.status==="red"
?"red"
:child.status==="green"
?"green"
:"none"
);

badge.textContent=
child.status==="red"
?"RED"
:child.status==="green"
?"GREEN"
:"NONE";


const note=document.createElement("button");

note.className="note";

note.textContent="📝";

note.onclick=()=>{

noteOpen=
noteOpen===child.id
?null
:child.id;

renderSnacks();

};


const remove=document.createElement("button");

remove.className="danger";

remove.textContent="Remove";

remove.onclick=async()=>{

if(!confirm("Remove "+child.name+"?"))return;

const result=await supabase
.from("snack_lists")
.delete()
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

await loadDatabase();

renderSnacks();

};


top.append(
tick,
name,
badge,
note,
remove
);

item.appendChild(top);


if(child.milk){

const detail=document.createElement("div");

detail.className="detail";

detail.textContent=
"Alternative milk: "+child.milk;

item.appendChild(detail);

}


if(child.amount||child.food){

const eaten=document.createElement("div");

eaten.className="eaten";

eaten.textContent=
"Eaten: "+
child.amount+
(
child.food
?" — "+child.food
:""
);

item.appendChild(eaten);

}


if(noteOpen===child.id){

item.appendChild(
makeNoteBox(child)
);

}


box.appendChild(item);

});

}


function makeNoteBox(child){

const box=document.createElement("div");

box.className="note-box";

const label=document.createElement("label");

label.textContent="How much did they have?";

box.appendChild(label);

const amounts=[
"Little",
"Half",
"Almost all",
"All"
];

const buttons=document.createElement("div");

buttons.className="amounts";

amounts.forEach(value=>{

const button=document.createElement("button");

button.className=
"amount"+
(child.amount===value?" selected":"");

button.textContent=value;

button.onclick=async()=>{

child.amount=value;

await saveNote(child);

};

buttons.appendChild(button);

});

box.appendChild(buttons);


const foodLabel=document.createElement("label");

foodLabel.textContent="What did they have?";

box.appendChild(foodLabel);


const input=document.createElement("input");

input.value=child.food;

input.placeholder=
"e.g. banana, yoghurt, apple";

box.appendChild(input);


const buttonsRow=document.createElement("div");

buttonsRow.className="note-buttons";


const save=document.createElement("button");

save.className="primary";

save.textContent="Save";

save.onclick=async()=>{

child.food=input.value.trim();

await saveNote(child);

};


const close=document.createElement("button");

close.className="secondary";

close.textContent="Close";

close.onclick=()=>{

noteOpen=null;

renderSnacks();

};


buttonsRow.append(save,close);

box.appendChild(buttonsRow);

return box;

}


async function saveNote(child){

const result=await supabase
.from("snack_lists")
.update({

amount:child.amount||"",
food:child.food||""

})
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

noteOpen=null;

renderSnacks();

}


/* -------------------------
GROUPED
------------------------- */

function renderGrouped(){

makeDay(currentDate);

const list=
database[currentDate][groupedTime];

const box=$("groupedList");

box.innerHTML="";

const groups={};

list.forEach(child=>{

if(!child.food)return;

const key=child.food.trim().toLowerCase();

if(!groups[key]){

groups[key]={
food:child.food.trim(),
names:[]
};

}

groups[key].names.push(child.name);

});


const entries=Object.values(groups);

if(!entries.length){

box.innerHTML=
'<div class="empty">No food has been recorded yet.</div>';

return;

}


entries.forEach(group=>{

const section=document.createElement("div");

section.className="group";

const title=document.createElement("div");

title.className="group-title";

title.textContent=group.food;

const names=document.createElement("div");

names.className="group-names";

names.textContent=
group.names.join(" • ");

const item=document.createElement("div");

item.className="group-item";

item.append(title,names);

section.appendChild(item);

box.appendChild(section);

});

}

/* -------------------------
SAVED DAYS
------------------------- */

function renderSavedDays(){

const box=$("savedDays");

box.innerHTML="";

const dates=Object.keys(database)
.sort()
.reverse();

if(!dates.length){

box.innerHTML=
'<div class="empty">No saved days yet.</div>';

return;

}

dates.forEach(date=>{

const row=document.createElement("div");

row.className="saved-day";

const title=document.createElement("strong");

title.textContent=
new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

const open=document.createElement("button");

open.className="secondary";

open.textContent="Open";

open.onclick=async()=>{

currentDate=date;

$("date").value=date;

await loadDatabase();

render();

};

row.append(title,open);

box.appendChild(row);

});

}


/* -------------------------
DATE
------------------------- */

$("date").onchange=async()=>{

currentDate=$("date").value;

await loadDatabase();

render();

};


/* -------------------------
RENDER
------------------------- */

function render(){

$("date").value=currentDate;

if(!$("snackPage").classList.contains("hidden")){

renderSnacks();

}

if(!$("groupedPage").classList.contains("hidden")){

renderGrouped();

}

if(!$("suncreamPage").classList.contains("hidden")){

renderSuncream();

}

renderSavedDays();

}


/* -------------------------
START
------------------------- */

async function start(){

await loadAdults();

const saved=
localStorage.getItem("acornAdult");

if(saved){

try{

const savedAdult=JSON.parse(saved);

const found=adults.find(
a=>a.id===savedAdult.id
);

if(found){

currentAdult={
...found,
...savedAdult
};

await showApp();

}

}catch(e){

localStorage.removeItem("acornAdult");

}

}

}

start();

</script>
