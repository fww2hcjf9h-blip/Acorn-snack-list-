<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f7f3;
  color:#29372d;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* ================= LOGIN ================= */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:520px;
  background:white;
  border-radius:30px;
  padding:30px 20px;
  box-shadow:0 8px 35px rgba(0,0,0,.08);
  text-align:center;
}

.logo{
  font-size:52px;
  font-weight:900;
  color:#40774d;
}

.login-title{
  font-size:28px;
  font-weight:900;
  margin:8px 0 25px;
}

.selector{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.arrow{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#e7eee8;
  color:#40774d;
  font-size:36px;
}

.adult-card{
  width:245px;
  min-height:320px;
  border:4px solid #40774d;
  border-radius:28px;
  background:#f0f5f0;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.adult-photo{
  width:175px;
  height:175px;
  border-radius:50%;
  background:#dfe8df;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.adult-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.adult-name{
  margin-top:15px;
  font-size:27px;
  font-weight:900;
  color:#40774d;
}

.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:15px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:10px;
  background:#ccd6cd;
}

.dot.active{
  width:22px;
  background:#40774d;
}

.no-account{
  padding:20px;
}

.no-icon{
  font-size:65px;
}

.no-text{
  font-size:20px;
  font-weight:800;
  color:#687169;
  margin:10px 0 20px;
}

.code{
  text-align:center;
  font-size:25px;
  letter-spacing:8px;
}

.plus{
  position:fixed;
  right:20px;
  bottom:20px;
  width:65px;
  height:65px;
  border:0;
  border-radius:50%;
  background:#40774d;
  color:white;
  font-size:40px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}


/* ================= GENERAL ================= */

.green{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#40774d;
  color:white;
  font-weight:900;
}

.grey{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#e7eee8;
  color:#315b3d;
  font-weight:800;
  margin-top:8px;
}

label{
  display:block;
  font-weight:800;
  text-align:left;
  margin:10px 0 6px;
}

input,
select{
  width:100%;
  padding:13px;
  border:2px solid #d5ded6;
  border-radius:12px;
  background:white;
}

.message{
  padding:12px;
  border-radius:12px;
  margin:12px 0;
  font-weight:800;
}

.error{
  background:#f7dddd;
  color:#922e2e;
}

.success{
  background:#dff0e1;
  color:#28613a;
}


/* ================= APP ================= */

.top{
  background:#40774d;
  color:white;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.title{
  font-size:24px;
  font-weight:900;
}

.top-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.small-photo{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e2e9e2;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-btn{
  border:0;
  border-radius:10px;
  padding:9px 12px;
  color:#315b3d;
  font-weight:800;
}

.nav{
  display:flex;
  gap:7px;
  padding:8px;
  background:white;
  overflow-x:auto;
  position:sticky;
  top:64px;
  z-index:15;
}

.nav button{
  white-space:nowrap;
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:#e7eee8;
  color:#315b3d;
  font-weight:800;
}

.nav button.active{
  background:#40774d;
  color:white;
}

.main{
  max-width:950px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:17px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.field{
  flex:1 1 180px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.tabs button{
  flex:1;
  border:0;
  border-radius:11px;
  padding:12px;
  background:#e7eee8;
  color:#315b3d;
  font-weight:900;
}

.tabs button.active{
  background:#40774d;
  color:white;
}


/* ================= CHILD ================= */

.child{
  border:1px solid #dce4dd;
  border-radius:14px;
  padding:12px;
  margin-bottom:9px;
  background:white;
}

.child.done{
  background:#edf5ee;
}

.child-top{
  display:flex;
  align-items:center;
  gap:7px;
}

.tick{
  width:37px;
  height:37px;
  border:0;
  border-radius:50%;
  background:#e7eee8;
  color:#40774d;
  font-weight:900;
  flex:none;
}

.done .tick{
  background:#40774d;
  color:white;
}

.child-name{
  flex:1;
  font-size:18px;
  font-weight:900;
}

.record{
  flex:none;
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#e7eee8;
  color:#315b3d;
  font-weight:900;
}

.remove-child{
  flex:none;
  border:0;
  border-radius:9px;
  padding:9px;
  background:#f5dddd;
  color:#922e2e;
  font-weight:800;
}

.details{
  margin:9px 0 0 44px;
  line-height:1.5;
  color:#59645b;
}

.empty{
  text-align:center;
  padding:25px;
  color:#687169;
}


/* ================= SAVED DAYS ================= */

.saved-days-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.saved-days-title h2{
  margin:0;
}

.saved-day{
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 0;
  border-bottom:1px solid #e2e8e2;
}

.saved-day:last-child{
  border-bottom:0;
}

.saved-day-open{
  flex:1;
  text-align:left;
  border:0;
  background:transparent;
  color:#315b3d;
  font-weight:900;
  padding:8px 0;
}

.saved-day-delete{
  border:0;
  border-radius:9px;
  padding:8px 10px;
  background:#f5dddd;
  color:#922e2e;
  font-weight:800;
}


/* ================= GROUP ================= */

.group-box{
  border:1px solid #dce4dd;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.group-title{
  font-size:19px;
  font-weight:900;
  color:#40774d;
  margin-bottom:8px;
}

.group-child{
  padding:4px 0;
  font-weight:700;
}


/* ================= MENU ================= */

.menu{
  position:fixed;
  right:12px;
  top:68px;
  width:255px;
  background:white;
  border-radius:15px;
  padding:14px;
  box-shadow:0 5px 25px rgba(0,0,0,.2);
  z-index:50;
}

.menu button{
  width:100%;
}


/* ================= MODALS ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-box{
  width:100%;
  max-width:470px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:22px;
}

.preview{
  width:125px;
  height:125px;
  border-radius:50%;
  background:#e0e9e0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  margin:10px auto 15px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-label{
  display:block;
  text-align:center;
  padding:13px;
  border-radius:12px;
  background:#e7eee8;
  color:#315b3d;
  font-weight:800;
}

.photo-label input{
  display:none;
}


/* ================= AMOUNT ================= */

.amount-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.amount{
  border:2px solid #d5ded6;
  background:white;
  color:#315b3d;
  border-radius:12px;
  padding:14px 8px;
  font-weight:900;
}

.amount.selected{
  background:#40774d;
  border-color:#40774d;
  color:white;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

  .adult-card{
    width:220px;
  }

  .adult-photo{
    width:150px;
    height:150px;
  }

  .adult-name{
    font-size:24px;
  }

  .remove-child{
    display:block;
  }

}
</style>
</head>

<script>

/* =====================================================
   ACORN DATA
   ===================================================== */

const STORAGE_KEY =
"ACORN_FINAL_DATA";

const CURRENT_ADULT_KEY =
"ACORN_CURRENT_ADULT";


let data={
  adults:[],
  entries:[]
};


let adultIndex=0;
let currentAdult=null;

let snackTime="am";
let groupTime="am";

let selectedDate=
new Date()
.toISOString()
.slice(0,10);

let recordId=null;
let recordAmount="";


/* =====================================================
   BASIC FUNCTIONS
   ===================================================== */

function $(id){
  return document.getElementById(id);
}


function show(id){
  $(id).classList.remove("hidden");
}


function hide(id){
  $(id).classList.add("hidden");
}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function loadData(){

  try{

    const saved=
      localStorage.getItem(
        STORAGE_KEY
      );

    if(saved){

      const parsed=
        JSON.parse(saved);

      if(
        parsed &&
        Array.isArray(parsed.adults) &&
        Array.isArray(parsed.entries)
      ){

        data=parsed;

      }

    }

  }catch(error){

    console.log(error);

  }

}


/* =====================================================
   PHOTO
   ===================================================== */

function setPhoto(element,url){

  element.innerHTML="";

  if(url){

    const image=
      document.createElement("img");

    image.src=url;

    image.alt="Profile photo";

    image.onload=function(){

      element.innerHTML="";

      element.appendChild(image);

    };

    image.onerror=function(){

      element.textContent="👤";

    };

  }else{

    element.textContent="👤";

  }

}


/* =====================================================
   LOGIN ADULTS
   ===================================================== */

function drawAdults(){

  if(data.adults.length===0){

    hide("selector");
    show("noAccounts");

    return;

  }


  hide("noAccounts");
  show("selector");


  if(
    adultIndex>=
    data.adults.length
  ){

    adultIndex=0;

  }


  const adult=
    data.adults[adultIndex];


  $("adultName").textContent=
    adult.name;


  setPhoto(
    $("adultPhoto"),
    adult.photo
  );


  $("dots").innerHTML="";


  data.adults.forEach(
    function(_,index){

      const dot=
        document.createElement("div");

      dot.className=
        "dot "+
        (
          index===adultIndex
          ?"active"
          :""
        );

      $("dots")
        .appendChild(dot);

    }
  );

}


/* PREVIOUS */

$("left").onclick=function(){

  if(!data.adults.length)
    return;

  adultIndex--;

  if(adultIndex<0){

    adultIndex=
      data.adults.length-1;

  }

  drawAdults();

};


/* NEXT */

$("right").onclick=function(){

  if(!data.adults.length)
    return;

  adultIndex++;

  if(
    adultIndex>=
    data.adults.length
  ){

    adultIndex=0;

  }

  drawAdults();

};


/* =====================================================
   ADD ADULT
   ===================================================== */

function openAdult(){

  $("newAdultName").value="";
  $("newCode").value="";
  $("confirmCode").value="";

  $("newPhoto")
    .dataset.photo="";

  setPhoto(
    $("newPhoto"),
    ""
  );

  hide("adultError");

  show("adultModal");

}


$("plus").onclick=
openAdult;


$("firstAdd").onclick=
openAdult;


$("cancelAdult").onclick=
function(){

  hide("adultModal");

};


/* PHOTO FOR NEW ADULT */

$("newPhotoFile").onchange=
function(){

  const file=
    this.files[0];

  if(!file)
    return;


  const reader=
    new FileReader();


  reader.onload=
  function(){

    $("newPhoto")
      .dataset.photo=
      reader.result;


    setPhoto(
      $("newPhoto"),
      reader.result
    );

  };


  reader.readAsDataURL(file);

};


/* CREATE ADULT */

$("createAdult").onclick=
function(){

  const name=
    $("newAdultName")
    .value
    .trim();

  const code=
    $("newCode")
    .value
    .trim();

  const confirm=
    $("confirmCode")
    .value
    .trim();

  const picture=
    $("newPhoto")
    .dataset.photo||"";


  if(!name){

    $("adultError")
      .textContent=
      "Please enter the adult's name.";

    $("adultError")
      .className=
      "message error";

    return;

  }


  if(!/^[0-9]{4}$/.test(code)){

    $("adultError")
      .textContent=
      "The code must be exactly 4 numbers.";

    $("adultError")
      .className=
      "message error";

    return;

  }


  if(code!==confirm){

    $("adultError")
      .textContent=
      "The codes don't match.";

    $("adultError")
      .className=
      "message error";

    return;

  }


  const exists=
    data.adults.some(
      adult=>
        adult.name
        .toLowerCase()===
        name.toLowerCase()
    );


  if(exists){

    $("adultError")
      .textContent=
      "That adult already exists.";

    $("adultError")
      .className=
      "message error";

    return;

  }


  const adult={

    id:
      Date.now().toString(),

    name:name,

    code:code,

    photo:picture

  };


  data.adults.push(adult);

  saveData();


  adultIndex=
    data.adults.length-1;


  hide("adultModal");

  drawAdults();


  $("loginMessage")
    .textContent=
    name+
    " has been added. Select their account and enter their code.";


  $("loginMessage")
    .className=
    "message success";

};


/* =====================================================
   LOGIN
   ===================================================== */

$("loginBtn").onclick=
function(){

  if(!data.adults.length){

    $("loginMessage")
      .textContent=
      "No adult accounts yet.";

    $("loginMessage")
      .className=
      "message error";

    return;

  }


  const adult=
    data.adults[adultIndex];


  const code=
    $("loginCode")
    .value
    .trim();


  if(code!==adult.code){

    $("loginMessage")
      .textContent=
      "Incorrect code.";

    $("loginMessage")
      .className=
      "message error";

    return;

  }


  currentAdult=
    adult;


  localStorage.setItem(
    CURRENT_ADULT_KEY,
    adult.id
  );


  $("loginCode").value="";


  openApp();

};

/* =====================================================
   SNACK LIST
   ===================================================== */

function renderSnacks(){

  const box=
    $("snackList");

  box.innerHTML="";


  const list=
    data.entries.filter(
      entry=>
        entry.date===
        selectedDate &&

        entry.time===
        snackTime &&

        !entry.suncream
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No children added yet.</div>';

    return;

  }


  list.forEach(
    function(entry){

      const child=
        document.createElement("div");

      child.className=
        "child "+
        (
          entry.done
          ?"done"
          :""
        );


      const top=
        document.createElement("div");

      top.className=
        "child-top";


      /* TICK */

      const tick=
        document.createElement("button");

      tick.className=
        "tick";

      tick.textContent=
        entry.done
        ?"✓"
        :"";


      tick.onclick=
      function(){

        entry.done=
          !entry.done;

        saveData();

        renderAll();

      };


      /* NAME */

      const name=
        document.createElement("div");

      name.className=
        "child-name";

      name.textContent=
        entry.child;


      /* RECORD BUTTON */

      const record=
        document.createElement("button");

      record.className=
        "record";

      record.textContent=
        "📝";

      record.title=
        "Record what they had";


      record.onclick=
      function(){

        openRecord(entry);

      };


      /* REMOVE BUTTON */

      const remove=
        document.createElement("button");

      remove.className=
        "remove-child";

      remove.textContent=
        "Remove";


      remove.onclick=
      function(){

        removeChild(entry);

      };


      top.append(
        tick,
        name,
        record,
        remove
      );


      child.appendChild(top);


      /* DETAILS */

      const details=
        document.createElement("div");

      details.className=
        "details";


      let text="";


      if(entry.allergy==="red"){

        text+=
          "🔴 Allergy<br>";

      }


      if(entry.allergy==="green"){

        text+=
          "🟢 Preference<br>";

      }


      if(entry.milk){

        text+=
          "Milk: "+
          entry.milk+
          "<br>";

      }


      if(entry.amount){

        text+=
          "Amount: <strong>"+
          entry.amount+
          "</strong><br>";

      }


      if(entry.food){

        text+=
          "Had: <strong>"+
          entry.food+
          "</strong>";

      }


      details.innerHTML=
        text;


      child.appendChild(details);


      box.appendChild(child);

    }
  );

}


/* =====================================================
   REMOVE CHILD
   ===================================================== */

function removeChild(entry){

  const yes=
    confirm(
      "Remove "+
      entry.child+
      " from this day's list?"
    );


  if(!yes)
    return;


  data.entries=
    data.entries.filter(
      item=>
        item.id!==entry.id
    );


  saveData();

  renderAll();

}


/* =====================================================
   RECORD SNACK
   ===================================================== */

function openRecord(entry){

  recordId=
    entry.id;


  recordAmount=
    entry.amount||"";


  $("recordChildName")
    .textContent=
    entry.child;


  $("recordFood").value=
    entry.food||"";


  document
    .querySelectorAll(".amount")
    .forEach(
      button=>{

        button.classList.toggle(
          "selected",
          button.dataset.value===
          recordAmount
        );

      }
    );


  show("recordModal");

}


/* AMOUNT BUTTONS */

document
.querySelectorAll(".amount")
.forEach(
  button=>{

    button.onclick=
    function(){

      recordAmount=
        this.dataset.value;


      document
        .querySelectorAll(".amount")
        .forEach(

            .remove("selected")

      this.classList.add(

);

$("cancelRecord").onclick=

$("saveRecord").onclick=

function renderGroup(){

  const box=
    $("groupList");

  box.innerHTML="";


  const list=
    data.entries.filter(
      entry=>
        entry.date===
        selectedDate &&

        entry.time===
        groupTime &&

        !entry.suncream &&

        entry.food
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">Nothing has been recorded yet.</div>';

    return;

  }


  const groups={};


  list.forEach(
    function(entry){

      const amount=
        entry.amount||
        "Amount not recorded";


      const food=
        entry.food||
        "Food not recorded";


      const key=
        amount+
        "|||"+
        food;


      if(!groups[key]){

        groups[key]=[];

      }


      groups[key]
        .push(
          entry.child
        );

    }
  );


  Object.keys(groups)
    .forEach(
      function(key){

        const parts=
          key.split("|||");


        const group=
          document.createElement("div");

        group.className=
          "group-box";


        const title=
          document.createElement("div");

        title.className=
          "group-title";

        title.textContent=
          parts[0]+
          " — "+
          parts[1];


        group.appendChild(title);


        groups[key]
          .forEach(
            function(childName){

              const child=
                document.createElement("div");

              child.className=
                "group-child";

              child.textContent=
                "• "+
                childName;


              group.appendChild(
                child
              );

            }
          );


        box.appendChild(
          group
        );

      }
    );

}

          )
        ){

        }


        data.entries=
          data.entries.filter(
            item=>
              item.id!==entry.id
          );


        saveData();

        renderSun();

      };


      top.append(
        tick,
        name,
        remove
      );


      child.appendChild(top);

      details.className=
        "details";

      details.textContent=

          entry.product||
          "Not entered"
        );


      child.appendChild(
        details
      );


      box.appendChild(
        child
      );

    }
  );

}


/* =====================================================
   SAVED DAYS
   ===================================================== */

function getSavedDates(){

  const dates=
    data.entries
      .map(
        entry=>
          entry.date
      )
      .filter(Boolean);


  return [
    ...new Set(dates)
  ].sort(
    (a,b)=>
      b.localeCompare(a)
  );

}


function formatDate(dateString){

  const date=
    new Date(
      dateString+
      "T12:00:00"
    );


  return date.toLocaleDateString(
    "en-GB",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


function renderSavedDays(){

  const box=
    $("savedDays");

  box.innerHTML="";


  const dates=
    getSavedDates();


  if(!dates.length){

    box.innerHTML=
      '<div class="empty">No saved days yet.</div>';

    return;

  }


  dates.forEach(
    function(date){

      const row=
        document.createElement("div");

      row.className=
        "saved-day";


      const open=
        document.createElement("button");

      open.className=
        "saved-day-open";

      open.textContent=
        "📅 "+
        formatDate(date);


      open.onclick=
      function(){

        selectedDate=date;

        $("date").value=
          date;

        renderAll();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      };


      const remove=
        document.createElement("button");

      remove.className=
        "saved-day-delete";

      remove.textContent=
        "🗑️ Delete";


      remove.onclick=
      function(){

        const yes=
          confirm(
            "Delete the saved day "+
            formatDate(date)+
            "? This will remove all the children and records for this day."
          );


        if(!yes)
          return;


        data.entries=
          data.entries.filter(
            entry=>
              entry.date!==date
          );


        saveData();


        if(selectedDate===date){

          selectedDate=
            new Date()
            .toISOString()
            .slice(0,10);

          $("date").value=
            selectedDate;

        }


        renderAll();

      };


      row.append(
        open,
        remove
      );


      box.appendChild(
        row
      );

    }
  );

}

/* =====================================================
   START
   ===================================================== */

function start(){

  loadData();


  $("date").value=
    selectedDate;


  drawAdults();


  const savedAdult=
    localStorage.getItem(
      CURRENT_ADULT_KEY
    );


  if(savedAdult){

    const adult=
      data.adults.find(
        a=>
          a.id===
          savedAdult
      );


    if(adult){

      currentAdult=
        adult;

      openApp();

    }

  }

}


start();
