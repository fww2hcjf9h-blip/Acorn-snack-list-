<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f8f4;
  color: #263326;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  background: white;
  padding: 18px 20px;
  border-bottom: 1px solid #e4e8df;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-inner {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.profile-button {
  border: 0;
  background: #eef3e9;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  font-size: 20px;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.hidden {
  display: none !important;
}

/* LOGIN */

.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.login-box {
  width: 100%;
  max-width: 430px;
  background: white;
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 8px 35px rgba(0,0,0,.08);
}

.login-box h1 {
  text-align: center;
  margin-bottom: 8px;
}

.login-box p {
  text-align: center;
  color: #687267;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
}

.field input,
.field select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d6ddd2;
  border-radius: 13px;
  background: white;
}

.primary {
  width: 100%;
  border: 0;
  background: #79a66a;
  color: white;
  padding: 14px;
  border-radius: 13px;
  font-weight: 800;
  margin-top: 5px;
}

.secondary {
  width: 100%;
  border: 1px solid #d4ddd0;
  background: white;
  padding: 13px;
  border-radius: 13px;
  font-weight: 700;
  margin-top: 10px;
}

.error {
  background: #fff0f0;
  color: #a33;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.success {
  background: #eef8eb;
  color: #38622f;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
}

/* APP */

.page-title {
  margin-top: 5px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.tab {
  flex: 1;
  border: 0;
  padding: 13px;
  border-radius: 13px;
  background: #e8ede4;
  font-weight: 800;
}

.tab.active {
  background: #79a66a;
  color: white;
}

.date-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.date-row input {
  flex: 1;
  padding: 13px;
  border: 1px solid #d6ddd2;
  border-radius: 13px;
  background: white;
}

.list-card {
  background: white;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 12px;
  border: 1px solid #e4e8df;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.child-name {
  font-size: 19px;
  font-weight: 800;
}

.small-text {
  color: #6d776b;
  font-size: 14px;
  margin-top: 4px;
}

.badge {
  display: inline-block;
  background: #eef3e9;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}

.card-buttons {
  display: flex;
  gap: 8px;
  margin-top: 13px;
}

.card-buttons button {
  flex: 1;
  border: 0;
  padding: 10px;
  border-radius: 10px;
  font-weight: 700;
}

.done-button {
  background: #e5f1df;
}

.edit-button {
  background: #edf0f5;
}

.delete-button {
  background: #fff0f0;
  color: #a33;
}

/* FLOATING ADD */

.add-button {
  position: fixed;
  right: 22px;
  bottom: 25px;
  width: 62px;
  height: 62px;
  border: 0;
  border-radius: 50%;
  background: #79a66a;
  color: white;
  font-size: 34px;
  box-shadow: 0 7px 22px rgba(0,0,0,.2);
  z-index: 30;
}

/* MODAL */

.modal-background {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}

.modal {
  background: white;
  width: 100%;
  max-width: 500px;
  border-radius: 23px;
  padding: 23px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.close {
  border: 0;
  background: #eef1ec;
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.modal-actions button {
  flex: 1;
}

/* PROFILE */

.profile-menu {
  position: fixed;
  top: 75px;
  right: 20px;
  width: 250px;
  background: white;
  border-radius: 18px;
  padding: 15px;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
  z-index: 40;
}

.profile-menu button {
  width: 100%;
  padding: 12px;
  border: 0;
  background: white;
  text-align: left;
  border-radius: 10px;
}

.profile-menu button:hover {
  background: #f1f4ef;
}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: #7a8477;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">
  <div class="login-box">

    <h1>🌳 Acorn</h1>
    <p>Adult login</p>

    <div id="loginMessage"></div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="Email address">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="Password">
    </div>

    <button class="primary" onclick="login()">
      Log in
    </button>

    <button class="secondary" onclick="showSignup()">
      Create adult account
    </button>

  </div>
</div>


<!-- APP -->

<div id="app" class="hidden">

<header>
  <div class="header-inner">

    <div class="logo">🌳 Acorn</div>

    <button class="profile-button" onclick="toggleProfileMenu()">
      👤
    </button>

  </div>
</header>


<div id="profileMenu" class="profile-menu hidden">

  <strong id="profileName">Adult</strong>

  <br><br>

  <button onclick="openProfile()">
    ✏️ Edit profile
  </button>

  <button onclick="logout()">
    🚪 Log out
  </button>

</div>


<div class="container">

  <h1 class="page-title">Daily lists</h1>

  <div class="tabs">

    <button id="snackTab"
            class="tab active"
            onclick="switchList('snacks')">
      🍎 Snacks
    </button>

    <button id="suncreamTab"
            class="tab"
            onclick="switchList('suncream')">
      ☀️ Suncream
    </button>

  </div>


  <div class="date-row">

    <input id="listDate" type="date" onchange="loadCurrentList()">

  </div>


  <div id="listContainer"></div>

</div>

<button class="add-button" onclick="openAddModal()">+</button>

</div>


<!-- ADD / EDIT MODAL -->

<div id="entryModal" class="modal-background hidden">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle">Add child</h2>

      <button class="close" onclick="closeModal()">×</button>

    </div>

    <div id="modalMessage"></div>

    <div class="field">

      <label>Child's name</label>

      <input id="childName" type="text" placeholder="Enter child's name">

    </div>


    <!-- SNACK FIELDS -->

    <div id="snackFields">

      <div class="field">

        <label>Snack time</label>

        <select id="snackTime">

          <option value="am">Morning</option>
          <option value="pm">Afternoon</option>

        </select>

      </div>


      <div class="field">

        <label>Food</label>

        <input id="food" type="text" placeholder="Snack">

      </div>


      <div class="field">

        <label>Amount</label>

        <input id="amount" type="text" placeholder="Amount">

      </div>


      <div class="field">

        <label>Allergy</label>

        <input id="allergy" type="text" placeholder="None / allergy">

      </div>


      <div class="field">

        <label>Alternative milk</label>

        <input id="milk" type="text" placeholder="If needed">

      </div>

    </div>


    <!-- SUNCREAM -->

    <div id="suncreamFields" class="hidden">

      <div class="field">

        <label>Suncream product</label>

        <input id="product" type="text" placeholder="Suncream">

      </div>

    </div>


    <div class="modal-actions">

      <button class="secondary" onclick="closeModal()">
        Cancel
      </button>

      <button class="primary" onclick="saveEntry()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- PROFILE MODAL -->

<div id="profileModal" class="modal-background hidden">

  <div class="modal">

    <div class="modal-header">

      <h2>Edit profile</h2>

      <button class="close" onclick="closeProfile()">
        ×
      </button>

    </div>

    <div id="profileMessage"></div>

    <div class="field">

      <label>Your name</label>

      <input id="profileDisplayName"
             type="text"
             placeholder="Your name">

    </div>

    <button class="primary" onclick="saveProfile()">
      Save profile
    </button>

  </div>

</div>


<script type="module">

/* =========================================================
   SUPABASE
   ========================================================= */

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://zzyyetnklrwzdzoraqqz.supabase.co";


const SUPABASE_ANON_KEY =
  "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   VARIABLES
   ========================================================= */

let currentUser = null;
let currentList = "snacks";
let editingId = null;


/* =========================================================
   START
   ========================================================= */

window.addEventListener("DOMContentLoaded", async () => {

  document.getElementById("listDate").value =
    new Date().toISOString().split("T")[0];

  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (session) {

    currentUser = session.user;

    await showApp();

  } else {

    showLogin();

  }

});


supabase.auth.onAuthStateChange(async (_event, session) => {

  if (session) {

    currentUser = session.user;

    await showApp();

  } else {

    currentUser = null;

    showLogin();

  }

});


/* =========================================================
   LOGIN
   ========================================================= */

window.login = async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if (!email || !password) {

    message.innerHTML =
      '<div class="error">Please enter your email and password.</div>';

    return;

  }

  const { error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    message.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

  }

};


/* =========================================================
   SIGN UP
   ========================================================= */

window.showSignup = async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.innerHTML =
      '<div class="error">Enter an email and password first.</div>';

    return;

  }

  if (password.length < 6) {

    message.innerHTML =
      '<div class="error">Password must be at least 6 characters.</div>';

    return;

  }

  const { error } =
    await supabase.auth.signUp({
      email,
      password
    });

  if (error) {

    message.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

  } else {

    message.innerHTML =
      '<div class="success">Account created. Check your email to confirm your account.</div>';

  }

};


/* =========================================================
   LOGOUT
   ========================================================= */

window.logout = async function() {

  await supabase.auth.signOut();

  document.getElementById("profileMenu")
    .classList.add("hidden");

};


/* =========================================================
   APP
   ========================================================= */

async function showApp() {

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  await loadProfile();

  await loadCurrentList();

}


function showLogin() {

  document.getElementById("loginScreen")
    .classList.remove("hidden");

  document.getElementById("app")
    .classList.add("hidden");

}


/* =========================================================
   PROFILE
   ========================================================= */

async function loadProfile() {

  if (!currentUser) return;

  const { data } =
    await supabase
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  if (data) {

    document.getElementById("profileName")
      .textContent = data.display_name || "Adult";

  } else {

    const defaultName =
      currentUser.email?.split("@")[0] || "Adult";

    await supabase
      .from("profiles")
      .upsert({
        id: currentUser.id,
        display_name: defaultName
      });

    document.getElementById("profileName")
      .textContent = defaultName;

  }

}


window.openProfile = async function() {

  document.getElementById("profileMenu")
    .classList.add("hidden");

  const { data } =
    await supabase
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  document.getElementById("profileDisplayName")
    .value = data?.display_name || "";

  document.getElementById("profileModal")
    .classList.remove("hidden");

};


window.closeProfile = function() {

  document.getElementById("profileModal")
    .classList.add("hidden");

};


window.saveProfile = async function() {

  const name =
    document.getElementById("profileDisplayName")
      .value.trim();

  const message =
    document.getElementById("profileMessage");

  if (!name) {

    message.innerHTML =
      '<div class="error">Please enter your name.</div>';

    return;

  }

  const { error } =
    await supabase
      .from("profiles")
      .upsert({
        id: currentUser.id,
        display_name: name
      });

  if (error) {

    message.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

    return;

  }

  document.getElementById("profileName")
    .textContent = name;

  closeProfile();

};


/* =========================================================
   PROFILE MENU
   ========================================================= */

window.toggleProfileMenu = function() {

  document.getElementById("profileMenu")
    .classList.toggle("hidden");

};


/* =========================================================
   LIST SWITCH
   ========================================================= */

window.switchList = async function(type) {

  currentList = type;

  document.getElementById("snackTab")
    .classList.toggle("active", type === "snacks");

  document.getElementById("suncreamTab")
    .classList.toggle("active", type === "suncream");

  await loadCurrentList();

};


/* =========================================================
   LOAD LIST
   ========================================================= */

window.loadCurrentList = async function() {

  if (!currentUser) return;

  const date =
    document.getElementById("listDate").value;

  const container =
    document.getElementById("listContainer");

  container.innerHTML =
    '<div class="empty">Loading...</div>';

  let query;

  if (currentList === "snacks") {

    query =
      supabase
        .from("snack_lists")
        .select("*")
        .eq("list_date", date)
        .order("child_name", { ascending: true });

  } else {

    query =
      supabase
        .from("suncream_lists")
        .select("*")
        .eq("list_date", date)
        .order("child_name", { ascending: true });

  }

  const { data, error } = await query;

  if (error) {

    container.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

    return;

  }

  renderList(data || []);

};


/* =========================================================
   RENDER
   ========================================================= */

function renderList(items) {

  const container =
    document.getElementById("listContainer");

  if (!items.length) {

    container.innerHTML =
      '<div class="empty">No children added yet.<br><br>Tap + to add a child.</div>';

    return;

  }

  container.innerHTML = "";

  items.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "list-card";

    if (currentList === "snacks") {

      card.innerHTML = `

        <div class="card-top">

          <div>

            <div class="child-name">
              ${escapeHtml(item.child_name)}
            </div>

            <div class="small-text">
              ${item.snack_time === "am"
                ? "Morning snack"
                : "Afternoon snack"}
            </div>

          </div>

          ${item.done
            ? '<span class="badge">✓ Done</span>'
            : '<span class="badge">Not done</span>'}

        </div>

        <div class="small-text">
          🍎 ${escapeHtml(item.food || "No food entered")}
        </div>

        <div class="small-text">
          Amount: ${escapeHtml(item.amount || "-")}
        </div>

        <div class="small-text">
          Allergy: ${escapeHtml(item.allergy_status || "None")}
        </div>

        <div class="small-text">
          Alternative milk: ${escapeHtml(item.alternative_milk || "-")}
        </div>

        <div class="card-buttons">

          <button class="done-button"
                  onclick="toggleDone('${item.id}', ${item.done})">
            ${item.done ? "↩ Undo" : "✓ Done"}
          </button>

          <button class="edit-button"
                  onclick="editEntry('${item.id}')">
            ✏️ Edit
          </button>

          <button class="delete-button"
                  onclick="deleteEntry('${item.id}')">
            🗑 Delete
          </button>

        </div>

      `;

    } else {

      card.innerHTML = `

        <div class="card-top">

          <div class="child-name">
            ${escapeHtml(item.child_name)}
          </div>

          ${item.done
            ? '<span class="badge">✓ Done</span>'
            : '<span class="badge">Not done</span>'}

        </div>

        <div class="small-text">
          ☀️ ${escapeHtml(item.product || "No product entered")}
        </div>

        <div class="card-buttons">

          <button class="done-button"
                  onclick="toggleDone('${item.id}', ${item.done})">
            ${item.done ? "↩ Undo" : "✓ Done"}
          </button>

          <button class="edit-button"
                  onclick="editEntry('${item.id}')">
            ✏️ Edit
          </button>

          <button class="delete-button"
                  onclick="deleteEntry('${item.id}')">
            🗑 Delete
          </button>

        </div>

      `;

    }

    container.appendChild(card);

  });

}


/* =========================================================
   ADD
   ========================================================= */

window.openAddModal = function() {

  editingId = null;

  document.getElementById("modalTitle")
    .textContent = "Add child";

  document.getElementById("childName")
    .value = "";

  document.getElementById("food")
    .value = "";

  document.getElementById("amount")
    .value = "";

  document.getElementById("allergy")
    .value = "";

  document.getElementById("milk")
    .value = "";

  document.getElementById("product")
    .value = "";

  document.getElementById("snackTime")
    .value = "am";

  updateModalFields();

  document.getElementById("entryModal")
    .classList.remove("hidden");

};


function updateModalFields() {

  document.getElementById("snackFields")
    .classList.toggle(
      "hidden",
      currentList !== "snacks"
    );

  document.getElementById("suncreamFields")
    .classList.toggle(
      "hidden",
      currentList !== "suncream"
    );

}


/* =========================================================
   EDIT
   ========================================================= */

window.editEntry = async function(id) {

  editingId = id;

  let table =
    currentList === "snacks"
      ? "snack_lists"
      : "suncream_lists";

  const { data, error } =
    await supabase
      .from(table)
      .select("*")
      .eq("id", id)
      .single();

  if (error) {

    alert(error.message);

    return;

  }

  document.getElementById("modalTitle")
    .textContent = "Edit child";

  document.getElementById("childName")
    .value = data.child_name || "";

  if (currentList === "snacks") {

    document.getElementById("snackTime")
      .value = data.snack_time || "am";

    document.getElementById("food")
      .value = data.food || "";

    document.getElementById("amount")
      .value = data.amount || "";

    document.getElementById("allergy")
      .value = data.allergy_status || "";

    document.getElementById("milk")
      .value = data.alternative_milk || "";

  } else {

    document.getElementById("product")
      .value = data.product || "";

  }

  updateModalFields();

  document.getElementById("entryModal")
    .classList.remove("hidden");

};


/* =========================================================
   SAVE
   ========================================================= */

window.saveEntry = async function() {

  const date =
    document.getElementById("listDate").value;

  const childName =
    document.getElementById("childName")
      .value.trim();

  const message =
    document.getElementById("modalMessage");

  message.innerHTML = "";

  if (!childName) {

    message.innerHTML =
      '<div class="error">Please enter the child’s name.</div>';

    return;

  }

  let table;
  let payload;

  if (currentList === "snacks") {

    table = "snack_lists";

    payload = {

      list_date: date,

      snack_time:
        document.getElementById("snackTime").value,

      child_name: childName,

      allergy_status:
        document.getElementById("allergy").value.trim(),

      alternative_milk:
        document.getElementById("milk").value.trim(),

      amount:
        document.getElementById("amount").value.trim(),

      food:
        document.getElementById("food").value.trim()

    };

  } else {

    table = "suncream_lists";

    payload = {

      list_date: date,

      child_name: childName,

      product:
        document.getElementById("product").value.trim()

    };

  }


  if (editingId) {

    const { error } =
      await supabase
        .from(table)
        .update(payload)
        .eq("id", editingId);

    if (error) {

      message.innerHTML =
        `<div class="error">${escapeHtml(error.message)}</div>`;

      return;

    }

  } else {

    payload.user_id = currentUser.id;

    const { error } =
      await supabase
        .from(table)
        .insert(payload);

    if (error) {

      message.innerHTML =
        `<div class="error">${escapeHtml(error.message)}</div>`;

      return;

    }

  }

  closeModal();

  await loadCurrentList();

};


/* =========================================================
   DONE
   ========================================================= */

window.toggleDone = async function(id, currentValue) {

  const table =
    currentList === "snacks"
      ? "snack_lists"
      : "suncream_lists";

  const { error } =
    await supabase
      .from(table)
      .update({
        done: !currentValue
      })
      .eq("id", id);

  if (error) {

    alert(error.message);

    return;

  }

  await loadCurrentList();

};


/* =========================================================
   DELETE
   ========================================================= */

window.deleteEntry = async function(id) {

  if (!confirm("Delete this child's entry?")) return;

  const table =
    currentList === "snacks"
      ? "snack_lists"
      : "suncream_lists";

  const { error } =
    await supabase
      .from(table)
      .delete()
      .eq("id", id);

  if (error) {

    alert(error.message);

    return;

  }

  await loadCurrentList();

};


/* =========================================================
   MODAL
   ========================================================= */

window.closeModal = function() {

  document.getElementById("entryModal")
    .classList.add("hidden");

};


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}
