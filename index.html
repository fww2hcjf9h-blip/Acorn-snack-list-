<script>

const SUPABASE_URL =
"https://zzyyetnklrwzdzoraqqz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0";


/* ---------------------------
   BASIC SUPABASE REQUEST
---------------------------- */

async function request(path,options={}){

  const headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  const response=await fetch(
    SUPABASE_URL+path,
    {
      ...options,
      headers
    }
  );

  const text=await response.text();

  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.hint ||
      text ||
      "Something went wrong"
    );

  }

  return data;

}


/* ---------------------------
   VARIABLES
---------------------------- */

let adults=[];
let selectedAdult=0;
let currentAdult=null;

let currentDate=
new Date().toISOString().slice(0,10);

let snackTime="am";
let groupTime="am";


/* ---------------------------
   HELPERS
---------------------------- */

function $(id){
  return document.getElementById(id);
}


function show(id){
  $(id).classList.remove("hidden");
}


function hide(id){
  $(id).classList.add("hidden");
}


function showMessage(id,text,type){

  const el=$(id);

  el.textContent=text;

  el.className=
    "message "+type;

}


function clearMessage(id){

  $(id).textContent="";
  $(id).className="message hidden";

}


function putPhoto(element,url){

  element.innerHTML="";

  if(url){

    const img=document.createElement("img");

    img.src=url;

    element.appendChild(img);

  }else{

    element.textContent="👤";

  }

}


/* ---------------------------
   LOAD ADULTS
---------------------------- */

async function loadAdults(){

  try{

    adults=
      await request(
        "/rest/v1/rpc/list_adults",
        {
          method:"POST",
          body:"{}"
        }
      );

    adults=adults||[];

    if(adults.length===0){

      show("noAccounts");
      hide("adultSelector");

    }else{

      hide("noAccounts");
      show("adultSelector");

      if(selectedAdult>=adults.length){
        selectedAdult=0;
      }

      drawAdult();

    }

  }catch(error){

    console.error(error);

    showMessage(
      "loginMessage",
      "We couldn't load the adult accounts: "+error.message,
      "error"
    );

  }

}


/* ---------------------------
   DRAW ADULT SELECTOR
---------------------------- */

function drawAdult(){

  if(!adults.length)return;

  const adult=adults[selectedAdult];

  $("loginName").textContent=adult.name;

  putPhoto(
    $("loginPhoto"),
    adult.photo_url
  );

  $("dots").innerHTML="";

  adults.forEach((adult,index)=>{

    const dot=document.createElement("div");

    dot.className=
      "dot "+
      (index===selectedAdult?"active":"");

    $("dots").appendChild(dot);

  });

}


/* ---------------------------
   ARROWS
---------------------------- */

$("previous").onclick=function(){

  if(!adults.length)return;

  selectedAdult--;

  if(selectedAdult<0){
    selectedAdult=adults.length-1;
  }

  drawAdult();

};


$("next").onclick=function(){

  if(!adults.length)return;

  selectedAdult++;

  if(selectedAdult>=adults.length){
    selectedAdult=0;
  }

  drawAdult();

};


/* ---------------------------
   ADD ADULT OPEN
---------------------------- */

function openAdultModal(){

  clearMessage("adultMessage");

  $("newAdultName").value="";
  $("newAdultCode").value="";
  $("newAdultConfirm").value="";

  $("newPhoto").dataset.photo="";

  putPhoto(
    $("newPhoto"),
    ""
  );

  show("adultModal");

}


$("plusButton").onclick=openAdultModal;

$("firstAdult").onclick=openAdultModal;


$("cancelAdult").onclick=function(){

  hide("adultModal");

};


/* ---------------------------
   PHOTO CONVERTER
---------------------------- */

function convertPhoto(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=function(){

      const image=new Image();

      image.onload=function(){

        const canvas=
          document.createElement("canvas");

        const max=500;

        let width=image.width;
        let height=image.height;

        if(width>height){

          height=
            height*(max/width);

          width=max;

        }else{

          width=
            width*(max/height);

          height=max;

        }

        canvas.width=width;
        canvas.height=height;

        canvas
          .getContext("2d")
          .drawImage(
            image,
            0,
            0,
            width,
            height
          );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            .7
          )
        );

      };

      image.onerror=reject;

      image.src=reader.result;

    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


/* ---------------------------
   NEW PHOTO
---------------------------- */

$("newPhotoFile").onchange=
async function(){

  const file=this.files[0];

  if(!file)return;

  try{

    const photo=
      await convertPhoto(file);

    $("newPhoto").dataset.photo=photo;

    putPhoto(
      $("newPhoto"),
      photo
    );

  }catch(error){

    showMessage(
      "adultMessage",
      "Could not load that photo.",
      "error"
    );

  }

};


/* ---------------------------
   CREATE ADULT
---------------------------- */

$("createAdult").onclick=
async function(){

  clearMessage("adultMessage");

  const name=
    $("newAdultName").value.trim();

  const code=
    $("newAdultCode").value.trim();

  const confirmCode=
    $("newAdultConfirm").value.trim();

  const photo=
    $("newPhoto").dataset.photo||"";


  if(!name){

    showMessage(
      "adultMessage",
      "Please enter the adult's name.",
      "error"
    );

    return;

  }


  if(!/^[0-9]{4}$/.test(code)){

    showMessage(
      "adultMessage",
      "The code must be exactly 4 numbers.",
      "error"
    );

    return;

  }


  if(code!==confirmCode){

    showMessage(
      "adultMessage",
      "The two codes don't match.",
      "error"
    );

    return;

  }


  const button=$("createAdult");

  button.disabled=true;
  button.textContent="Creating...";


  try{

    const result=
      await request(
        "/rest/v1/rpc/create_adult",
        {
          method:"POST",
          body:JSON.stringify({
            p_name:name,
            p_code:code,
            p_photo:photo
          })
        }
      );


    /* Immediately add it to the selector */

    const newAdult=
      Array.isArray(result)
        ?result[0]
        :result;


    await loadAdults();


    const newIndex=
      adults.findIndex(
        a=>a.id===newAdult.id
      );


    if(newIndex>=0){

      selectedAdult=newIndex;

      drawAdult();

    }


    hide("adultModal");

    showMessage(
      "loginMessage",
      name+" has been added! Select their account and enter their code.",
      "success"
    );


  }catch(error){

    console.error(error);

    showMessage(
      "adultMessage",
      error.message,
      "error"
    );

/* ---------------------------
   LOGIN
---------------------------- */

$("loginButton").onclick=
async function(){

  clearMessage("loginMessage");

  if(!adults.length){

    showMessage(
      "loginMessage",
      "There are no adult accounts yet. Tap + to add one.",
      "error"
    );

    return;

  }


  const adult=
    adults[selectedAdult];

  const code=
    $("loginCode").value.trim();


  if(!/^[0-9]{4}$/.test(code)){

    showMessage(
      "loginMessage",
      "Please enter the 4-digit code.",
      "error"
    );

    return;

  }


  const button=$("loginButton");

  button.disabled=true;
  button.textContent="Logging in...";


  try{

    const result=
      await request(
        "/rest/v1/rpc/login_adult",
        {
          method:"POST",
          body:JSON.stringify({
            p_name:adult.name,
            p_code:code
          })
        }
      );


    currentAdult=
      Array.isArray(result)
        ?result[0]
        :result;


    localStorage.setItem(
      "acornAdult",
      JSON.stringify(currentAdult)
    );


    $("loginCode").value="";

    openApp();


  }catch(error){

    console.error(error);

    showMessage(
      "loginMessage",
      "Incorrect code.",
      "error"
    );

  }


  button.disabled=false;
  button.textContent="Log in";

};

/* ---------------------------
   LOAD DATA
---------------------------- */

let snacks=[];
let suncream=[];


async function loadEverything(){

  try{

    snacks=
      await request(
        "/rest/v1/snack_lists?select=*&order=id.asc"
      );

    suncream=
      await request(
        "/rest/v1/suncream_lists?select=*&order=id.asc"
      );


    renderSnacks();
    renderGroups();
    renderSun();

  }catch(error){

    console.error(error);

  }

}


/* ---------------------------
   RENDER SNACKS
---------------------------- */

function renderSnacks(){

  const box=$("snackList");

  box.innerHTML="";

  const list=
    snacks.filter(
      x=>
        x.list_date===currentDate &&
        x.snack_time===snackTime
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No children added yet.</div>';

    return;

  }


  list.forEach(child=>{

    const item=
      document.createElement("div");

    item.className=
      "child"+
      (child.done?" done":"");


    const top=
      document.createElement("div");

    top.className="child-top";


    const tick=
      document.createElement("button");

    tick.className="tick";

    tick.textContent=
      child.done?"✓":"";


    tick.onclick=async function(){

      await request(
        "/rest/v1/snack_lists?id=eq."+child.id,
        {
          method:"PATCH",
          headers:{
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            done:!child.done
          })
        }
      );

      loadEverything();

    };


    const name=
      document.createElement("div");

    name.className="child-name";

    name.textContent=
      child.child_name;


    const badge=
      document.createElement("span");

    badge.className=
      "badge "+child.allergy_status;

    badge.textContent=
      child.allergy_status==="red"
        ?"ALLERGY"
        :
      child.allergy_status==="green"
        ?"PREFERENCE"
        :
        "NONE";


    const remove=
      document.createElement("button");

    remove.className="remove";

    remove.textContent="Remove";


    remove.onclick=async function(){

      if(!confirm(
        "Remove "+child.child_name+"?"
      ))return;

      await request(
        "/rest/v1/snack_lists?id=eq."+child.id,
        {
          method:"DELETE"
        }
      );

      loadEverything();

    };


    top.append(
      tick,
      name,
      badge,
      remove
    );

    item.appendChild(top);


    if(child.alternative_milk){

      const detail=
        document.createElement("div");

      detail.className="detail";

      detail.textContent=
        "Alternative milk: "+
        child.alternative_milk;

      item.appendChild(detail);

    }


    box.appendChild(item);

  });

}


/* ---------------------------
   GROUPED
---------------------------- */

$("groupAm").onclick=function(){

  groupTime="am";

  $("groupAm").classList.add("active");
  $("groupPm").classList.remove("active");

  renderGroups();

};


$("groupPm").onclick=function(){

  groupTime="pm";

  $("groupPm").classList.add("active");
  $("groupAm").classList.remove("active");

  renderGroups();

};


function renderGroups(){

  const box=$("groups");

  box.innerHTML="";


  const list=
    snacks.filter(
      x=>
        x.list_date===currentDate &&
        x.snack_time===groupTime &&
        x.food
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No food has been recorded yet.</div>';

    return;

  }


  const groups={};


  list.forEach(child=>{

    const key=
      child.food.trim();

    if(!groups[key])
      groups[key]=[];

    groups[key].push(
      child.child_name
    );

  });


  Object.keys(groups).forEach(food=>{

    const group=
      document.createElement("div");

    group.className="group";


    const title=
      document.createElement("div");

    title.className="group-title";

    title.textContent=food;


    const names=
      document.createElement("div");

    names.className="group-names";

    names.textContent=
      groups[food].join(" • ");


    group.append(
      title,
      names
    );

    box.appendChild(group);

  });

}

  );

};


$("profileFile").onchange=
async function(){

  const file=this.files[0];

  if(!file)return;

  const photo=
    await convertPhoto(file);

  $("profilePhoto").dataset.photo=
    photo;

  putPhoto(
    $("profilePhoto"),
    photo
  );

};


$("saveProfile").onclick=async function(){

  const name=
    $("profileName").value.trim();

  const photo=
    $("profilePhoto").dataset.photo||"";


  if(!name){

    showMessage(
      "profileMessage",
      "Please enter a name.",
      "error"
    );

    return;

  }


  try{

    await request(
      "/rest/v1/adults?id=eq."+currentAdult.id,
      {
        method:"PATCH",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          name:name,
          photo_url:photo
        })
      }
    );


    currentAdult.name=name;
    currentAdult.photo_url=photo;


    localStorage.setItem(
      "acornAdult",
      JSON.stringify(currentAdult)
    );


    $("menuName").textContent=name;

    putPhoto(
      $("smallPhoto"),
      photo
    );


    showMessage(
      "profileMessage",
      "Profile saved!",
      "success"
    );


    await loadAdults();


    setTimeout(
      ()=>hide("profileModal"),
      600
    );


  }catch(error){

    showMessage(
      "profileMessage",
      error.message,
      "error"
    );

  }

};


/* ---------------------------
   START
---------------------------- */

async function start(){

  $("date").value=currentDate;

  await loadAdults();


  const saved=
    localStorage.getItem("acornAdult");


  if(saved){

    try{

      currentAdult=
        JSON.parse(saved);

      if(currentAdult?.id){

        openApp();

      }

    }catch{

      localStorage.removeItem(
        "acornAdult"
      );

    }

  }

}


start();
