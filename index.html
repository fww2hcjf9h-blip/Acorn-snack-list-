<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{
font:inherit;
}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;

}

.app{
display:flex;

}

.sidebar{

background:white;

}

.logo{

}

.folder-button,
.grouped-button{

}

.folder-button.active,

.grouped-button{

}

.main{

margin:auto;

.header{

color:white;

padding:20px;
margin-bottom:15px;
}

margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;

}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,
select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;

}

.primary{
background:#2f6f45;

.secondary{
background:#e8eee9;
color:#294e34;
}

.danger{

}

.small{

font-size:13px;
}

.snack-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.snack-tab{

background:#e8eee9;
color:#294e34;
}

.snack-tab.active{
background:#2f6f45;

}

border:1px solid #dce2dc;
border-radius:13px;

}

}

.child-top{
display:flex;
align-items:center;
gap:8px;
}

.tick{
width:32px;
height:32px;
padding:0;
border-radius:50%;
background:#edf0ed;
color:#2f6f45;
border:1px solid #ccd4cc;
flex-shrink:0;
}

.child.done .tick{
background:#2f6f45;
color:white;
}

.child-name{
font-weight:bold;
flex:1;
min-width:100px;
}

.badge{
font-size:10px;
font-weight:bold;
padding:5px 7px;
border-radius:7px;
}

.red{
background:#f7dddd;
color:#982626;
}

.green{
background:#dff1e3;
color:#246337;
}

.none{
background:#edf0ed;
color:#596159;
}

.note-button{
background:#eef3ee;
color:#294e34;
padding:7px 9px;
font-size:15px;
}

.note-button.has-note{

color:#246337;
}

.note-box{
margin:12px 0 2px 40px;

}

.amount-buttons{
display:flex;
gap:6px;

margin-bottom:10px;
}

.amount-button{

}

.amount-button.selected{

}

.note-save-row{
display:flex;
gap:7px;
margin-top:10px;
}

.detail{

color:#555;
margin:8px 0 0 40px;
}

.eaten-detail{
font-size:14px;
font-weight:bold;
color:#2f6f45;
margin:7px 0 0 40px;
}

.empty,
.grouped-empty{
text-align:center;
color:#687068;
padding:20px;
}

.grouped-section{
border:1px solid #dce2dc;
border-radius:14px;
margin-bottom:14px;

}

.grouped-heading{
padding:13px 15px;
font-size:18px;
font-weight:bold;

color:#294e34;
}

.grouped-snack{

}

.grouped-snack-name{

font-weight:bold;
color:#2f6f45;
}

.grouped-names{

color:#555;
margin-top:5px;
line-height:1.6;
}

.history-item{
border-top:1px solid #e4e8e4;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.history-buttons{
display:flex;
gap:6px;
}

.hidden{
display:none!important;
}

/* LOGIN */

.login-screen{
position:fixed;
inset:0;
background:#f4f7f4;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.login-box{
background:white;
border-radius:20px;
padding:25px;

}

.login-logo{

.login-subtitle{

.login-tabs{

gap:7px;

}

.login-tabs button{

background:#e8eee9;
color:#294e34;
}

.login-tabs button.active{
background:#2f6f45;

}

.login-message{

border-radius:10px;
margin-bottom:12px;
font-size:14px;
}

.login-message.error{
background:#f7dddd;
color:#8d2525;
}

.login-message.success{
background:#dff1e3;
color:#246337;
}

/* PROFILE */

.fab{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
background:#2f6f45;
color:white;
font-size:30px;
box-shadow:0 4px 15px rgba(0,0,0,.2);
z-index:30;
}

.profile-menu{
position:fixed;
right:20px;
top:75px;
background:white;
border:1px solid #ddd;
border-radius:14px;
padding:12px;
width:240px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
z-index:40;
}

.profile-menu button{
width:100%;
margin-top:7px;
text-align:left;
}

.profile-header{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:#e8eee9;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:22px;
flex-shrink:0;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.profile-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:80;
}

.profile-modal-box{
background:white;
width:100%;
max-width:500px;
border-radius:18px;
padding:20px;
}

@media(max-width:650px){

.app{
display:block;
}

.sidebar{
width:100%;
border-right:0;
border-bottom:1px solid #ddd;
display:flex;
gap:7px;
overflow-x:auto;
padding:9px;
}

.logo{
display:none;
}

.folder-button,
.grouped-button{
width:auto;
white-space:nowrap;
margin:0;
}

.main{
padding:10px;
}

.child-top{
flex-wrap:wrap;
}

}
</style>
</head>

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
==================================================
SUPABASE
==================================================
*/

const supabase=createClient(

"https://zzyyetnklrwzdzoraqqz.supabase.co",

"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0"

);


/*
==================================================
VARIABLES
==================================================
*/

let currentUser=null;

let data={};

let currentDate="";

let currentPage="snacks";

let currentSnack="am";

let groupedSnack="am";

let openNoteIndex=null;

let authMode="login";


/*
==================================================
HELPERS
==================================================
*/

function get(id){

return document.getElementById(id);

}


function getToday(){

const d=new Date();

const local=new Date(

d.getTime()-
d.getTimezoneOffset()*60000

);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={

amSnack:[],

pmSnack:[],

suncream:[]

};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")

.toLocaleDateString(

"en-GB",

{

weekday:"long",

day:"numeric",

month:"long",

year:"numeric"

}

);

}


/*
==================================================
LOGIN MESSAGE
==================================================
*/

function showLoginMessage(text,success=false){

const box=get("loginMessage");

box.textContent=text;

box.classList.remove("hidden");

box.classList.toggle(
"success",
success
);

box.classList.toggle(
"error",
!success
);

}


/*
==================================================
AUTH MODE
==================================================
*/

function setAuthMode(mode){

authMode=mode;

get("loginModeButton")
.classList.toggle(
"active",
mode==="login"
);

get("signupModeButton")
.classList.toggle(
"active",
mode==="signup"
);

get("authNameField")
.classList.toggle(
"hidden",
mode!=="signup"
);

get("authButton").textContent=

mode==="login"
?"Log in"
:"Create account";

get("loginMessage")
.classList.add("hidden");

}


get("loginModeButton")
.addEventListener(
"click",
function(){

setAuthMode("login");

}
);


get("signupModeButton")
.addEventListener(
"click",
function(){

setAuthMode("signup");

}
);


/*
==================================================
LOGIN / CREATE ACCOUNT
==================================================
*/

get("authButton")
.addEventListener(
"click",
submitAuth
);


async function submitAuth(){

const email=
get("authEmail")
.value
.trim();

const password=
get("authPassword")
.value;

if(!email || !password){

showLoginMessage(
"Please enter your email and password."
);

return;

}


if(authMode==="signup"){

const name=
get("authName")
.value
.trim();

if(!name){

showLoginMessage(
"Please enter your name."
);

return;

}


if(password.length<6){

showLoginMessage(
"Your password/code must be at least 6 characters."
);

return;

}


const result=
await supabase.auth.signUp({

email:email,

password:password

});


if(result.error){

showLoginMessage(
result.error.message
);

return;

}


if(result.data.user){

const profileResult=
await supabase
.from("profiles")
.upsert({

id:result.data.user.id,

display_name:name,

photo_url:""

});


if(profileResult.error){

showLoginMessage(
profileResult.error.message
);

return;

}

}


if(!result.data.session){

showLoginMessage(
"Account created. Check your email to confirm your account before logging in.",
true
);

return;

}

}

else{

const result=
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

showLoginMessage(
result.error.message
);

return;

}

}

}


/*
==================================================
START APP
==================================================
*/

async function startApp(user){

currentUser=user;

get("loginScreen")
.classList.add("hidden");

get("app")
.classList.remove("hidden");

await loadProfile();

await loadSharedData();

render();

}


/*
==================================================
LOGIN SCREEN
==================================================
*/

function showLogin(){

currentUser=null;

get("loginScreen")
.classList.remove("hidden");

get("app")
.classList.add("hidden");

}


/*
==================================================
PROFILE
==================================================
*/

async function loadProfile(){

if(!currentUser){

return;

}


let result=
await supabase
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();


if(result.error){

console.log(result.error);

return;

}


let profile=result.data;


if(!profile){

const defaultName=
(currentUser.email || "Adult")
.split("@")[0];


await supabase
.from("profiles")
.upsert({

id:currentUser.id,

display_name:defaultName,

photo_url:""

});


profile={

display_name:defaultName,

photo_url:""

};

}


get("profileMenuName")
.textContent=
profile.display_name || "Adult";


setAvatar(
get("profileAvatar"),
profile.photo_url
);

}


function setAvatar(element,url){

element.innerHTML="";


if(url){

const image=
document.createElement("img");

image.src=url;

image.alt="Profile photo";

image.onerror=function(){

element.textContent="👤";

};

element.appendChild(image);

}

else{

element.textContent="👤";

}

}


/*
==================================================
OPEN EDIT PROFILE
==================================================
*/

get("editProfileButton")
.addEventListener(
"click",
openEditProfile
);


async function openEditProfile(){

get("profileMenu")
.classList.add("hidden");


const result=
await supabase
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();


get("profileDisplayName").value=
result.data?.display_name || "";


get("profilePhotoUrl").value=
result.data?.photo_url || "";


get("profileMessage")
.classList.add("hidden");


get("profileModal")
.classList.remove("hidden");

}


/*
==================================================
SAVE PROFILE
==================================================
*/

get("saveProfileButton")
.addEventListener(
"click",
saveProfile
);


async function saveProfile(){

const name=
get("profileDisplayName")
.value
.trim();

const photo=
get("profilePhotoUrl")
.value
.trim();


if(!name){

get("profileMessage")
.textContent=
"Please enter your name.";

get("profileMessage")
.classList.remove("hidden");

return;

}


const result=
await supabase
.from("profiles")
.upsert({

id:currentUser.id,

display_name:name,

photo_url:photo

});


if(result.error){

get("profileMessage")
.textContent=
result.error.message;

get("profileMessage")
.classList.remove("hidden");

return;

}


get("profileMenuName")
.textContent=name;

setAvatar(
get("profileAvatar"),
photo
);

get("profileModal")
.classList.add("hidden");

}


/*
==================================================
CLOSE PROFILE
==================================================
*/

get("closeProfileButton")
.addEventListener(
"click",
function(){

get("profileModal")
.classList.add("hidden");

}
);


/*
==================================================
LOGOUT
==================================================
*/

get("logoutButton")
.addEventListener(
"click",
async function(){

get("profileMenu")
.classList.add("hidden");

await supabase.auth.signOut();

}
);


/*
==================================================
LOAD SHARED DATA
==================================================
*/

async function loadSharedData(){

if(!currentUser){

return;

}


data={};


const snacks=
await supabase
.from("snack_lists")
.select("*")
.order(
"list_date",
{
ascending:false
}
)
.order("id");


const suncream=
await supabase
.from("suncream_lists")
.select("*")
.order(
"list_date",
{
ascending:false
}
)
.order("id");


if(snacks.error){

console.log(snacks.error);

alert(snacks.error.message);

return;

}


if(suncream.error){

console.log(suncream.error);

alert(suncream.error.message);

return;

}


/*
SNACKS
*/

(snacks.data || [])
.forEach(function(item){

createDay(item.list_date);

const key=
item.snack_time==="am"
?"amSnack"
:"pmSnack";


data[item.list_date][key].push({

id:item.id,

name:item.child_name,

status:item.allergy_status || "none",

milk:item.alternative_milk || "",

done:!!item.done,

note:{

amount:item.amount || "",

what:item.food || ""

}

});

});


/*
SUNCREAM
*/

(suncream.data || [])
.forEach(function(item){

createDay(item.list_date);

data[item.list_date]
.suncream
.push({

id:item.id,

name:item.child_name,

product:item.product || "",

done:!!item.done

});

});

}

/*

==================================================

function createNoteBox(child){

const box=
document.createElement("div");

box.className=
"note-box";


const label=
document.createElement("label");

label.textContent=
"How much did they have?";

box.appendChild(label);


const amounts=[
"Little",
"Half",
"Almost all",
"All"
];


const buttons=
document.createElement("div");

buttons.className=
"amount-buttons";


amounts.forEach(
function(amount){

const button=
document.createElement("button");

button.type="button";

button.className=
"amount-button"+
(
child.note &&
child.note.amount===amount
?" selected"
:""
);

button.textContent=
amount;


button.onclick=
async function(){

child.note.amount=
amount;

await saveSnackNote(child);

};


buttons.appendChild(button);

});


box.appendChild(buttons);


const whatLabel=
document.createElement("label");

whatLabel.textContent=
"What did they have?";

box.appendChild(whatLabel);

document.createElement("input");

"e.g. banana, apple, different fruit";

child.note &&
child.note.what
?child.note.what
:"";

box.appendChild(input);


const row=
document.createElement("div");

row.className=
"note-save-row";


const save=
document.createElement("button");

save.type="button";

save.className="primary";

save.textContent="Save";


save.onclick=
async function(){

child.note.what=
input.value.trim();

await saveSnackNote(child);

};


const close=
document.createElement("button");

close.type="button";

close.className=
"secondary";

close.textContent="Close";


close.onclick=
function(){

openNoteIndex=null;

renderSnackList();

};


row.append(
save,
close
);

box.appendChild(row);


return box;

}


/*
==================================================
SAVE SNACK NOTE
==================================================
*/

async function saveSnackNote(child){

const result=
await supabase
.from("snack_lists")
.update({

amount:child.note.amount || "",

food:child.note.what || ""

})
.eq("id",child.id);


if(result.error){

alert(result.error.message);

return;

}


openNoteIndex=null;

renderSnackList();

}


/*
==================================================
GROUPED
==================================================
*/

function renderGrouped(){

const container=
get("groupedChildren");

container.innerHTML="";

createDay(currentDate);

const key=
groupedSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="grouped-empty">No children have been added yet.</div>';

return;

}


const amounts=[
"All",
"Almost all",
"Half",
"Little"
];

let found=false;


amounts.forEach(
function(amount){

const matching=
children.filter(
function(child){

return child.note &&
child.note.amount===amount &&
child.note.what &&
child.note.what.trim();

});


if(!matching.length){

return;

}


found=true;


const section=
document.createElement("div");

section.className=
"grouped-section";


const heading=
document.createElement("div");

heading.className=
"grouped-heading";

heading.textContent=
amount.toUpperCase();

section.appendChild(heading);


const groups={};


matching.forEach(
function(child){

const food=
child.note.what.trim();

const key=
food.toLowerCase();


if(!groups[key]){

groups[key]={

name:food,

children:[]

};

}


groups[key]
.children
.push(child.name);

});


Object.values(groups)

.sort(
function(a,b){

return a.name
.localeCompare(b.name);

})

.forEach(
function(group){

const snack=
document.createElement("div");

snack.className=
"grouped-snack";


const snackName=
document.createElement("div");

snackName.className=
"grouped-snack-name";

snackName.textContent=
"🍌 "+group.name;


const names=
document.createElement("div");

names.className=
"grouped-names";

names.textContent=
group.children.join(" • ");


snack.append(
snackName,
names
);

section.appendChild(snack);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="grouped-empty">Nothing has been recorded yet.<br><br>Use the 📝 button beside a child to add what they ate.</div>';

}

}

/*
==================================================
NEW DAY
==================================================
*/

function createNewDay(){

const answer=
prompt(
"Enter the date as DD/MM/YYYY"
);


if(!answer){

return;

}


const parts=
answer.split("/");


if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}


const day=
parts[0].padStart(2,"0");

const month=
parts[1].padStart(2,"0");

const year=
parts[2];


if(
year.length!==4 ||
Number(day)<1 ||
Number(day)>31 ||
Number(month)<1 ||
Number(month)>12
){

alert(
"Please enter a valid date using DD/MM/YYYY."
);

return;

}


currentDate=
year+"-"+month+"-"+day;

createDay(currentDate);

render();

}
