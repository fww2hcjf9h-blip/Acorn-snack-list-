<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f7f3;
  color:#29372d;
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:30px;
  padding:30px 20px;
  box-shadow:0 8px 35px rgba(0,0,0,.08);
  text-align:center;
}

.logo{
  font-size:52px;
  font-weight:900;
  color:#40774d;
}

.login-title{
  font-size:28px;
  font-weight:900;
  margin:7px 0 25px;
}

.no-account{
  padding:20px 5px;
}

.no-icon{
  font-size:65px;
}

.no-text{
  font-size:20px;
  font-weight:800;
  color:#687169;
  margin:10px 0 20px;
}

.selector{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.arrow{
  flex:none;
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:#e7eee8;
  color:#40774d;
  font-size:38px;
}

.adult-card{
  width:245px;
  min-height:320px;
  border:4px solid #40774d;
  border-radius:28px;
  background:#f0f5f0;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.adult-photo{
  width:175px;
  height:175px;
  border-radius:50%;
  background:#dfe8df;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
}

.adult-photo img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.adult-name{
  margin-top:15px;
  font-size:27px;
  font-weight:900;
  color:#40774d;
}

.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:15px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:10px;
  background:#ccd6cd;
}

.dot.active{
  width:23px;
  background:#40774d;
}

label{
  display:block;
  text-align:left;
  font-weight:800;
  margin:10px 0 6px;
}

input,select{
  width:100%;
  padding:13px;
  border:2px solid #d5ded6;
  border-radius:12px;
  background:#fff;
}

.code{
  text-align:center;
  font-size:25px;
  letter-spacing:8px;
}

.green{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#40774d;
  color:#fff;
  font-weight:900;
}

.grey{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#e7eee8;
  color:#315b3d;
  font-weight:800;
  margin-top:8px;
}

.plus{
  position:fixed;
  right:20px;
  bottom:20px;
  width:65px;
  height:65px;
  border:0;
  border-radius:50%;
  background:#40774d;
  color:#fff;
  font-size:40px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.message{
  padding:12px;
  border-radius:12px;
  margin:12px 0;
  font-weight:800;
}

.error{
  background:#f7dddd;
  color:#922e2e;
}

.success{
  background:#dff0e1;
  color:#28613a;
}

/* ---------- APP ---------- */

.top{
  background:#40774d;
  color:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;

}

.title{

  font-weight:900;
}

.top-right{

  align-items:center;

}

.small-photo{

.profile-btn{

.nav{

.main{

.card{

  padding:16px;

.row{

.field{

.tabs{

/* ---------- CHILD ---------- */

.child{

/* ---------- GROUP ---------- */

.group-box{

/* ---------- MENU ---------- */

  right:12px;

  width:255px;

  border-radius:15px;
  padding:14px;
  box-shadow:0 5px 25px rgba(0,0,0,.2);

.menu button{

/* ---------- MODALS ---------- */

.modal{

  inset:0;
  z-index:100;

  align-items:center;
  justify-content:center;

.preview{

.photo-label{

  }

  .delete-btn{
    display:none;
  }

</style>

<script>

const SUPABASE_URL =
"https://zzyyetnklrwzdzoraqqz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0";

let adults=[];
let adultIndex=0;
let currentAdult=null;

let entries=[];

let snackTime="am";
let groupTime="am";

let selectedDate=
new Date().toISOString().slice(0,10);

let recordId=null;
let recordAmount="";


function $(id){
  return document.getElementById(id);
}


function show(id){
  $(id).classList.remove("hidden");
}


function hide(id){
  $(id).classList.add("hidden");
}


function setMessage(id,text,type){

  const e=$(id);

  e.textContent=text;
  e.className="message "+type;
}


function setPhoto(element,url){

  element.innerHTML="";

  if(url && url.trim()){

    const img=
      document.createElement("img");

    img.src=url;

    img.alt="Profile photo";

    img.onerror=function(){
      element.innerHTML="👤";
    };

    element.appendChild(img);

  }else{

    element.textContent="👤";

  }
}


/* DATABASE */

async function db(path,options={}){

  const response=
    await fetch(
      SUPABASE_URL+path,
      {
        ...options,
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY,
          "Content-Type":
            "application/json",
          ...(options.headers||{})
        }
      }
    );

  const text=
    await response.text();

  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.hint ||
      data?.error ||
      text ||
      "Database error"
    );
  }

  return data;
}


/* ADULTS */

async function loadAdults(){

  try{

    const data=
      await db(
        "/rest/v1/rpc/list_adults",
        {
          method:"POST",
          body:"{}"
        }
      );

    adults=
      Array.isArray(data)
      ?data
      :[];

    if(adults.length===0){

      hide("selector");
      show("noAccounts");

    }else{

      hide("noAccounts");
      show("selector");

      if(adultIndex>=adults.length){
        adultIndex=0;
      }

      drawAdult();

    }

  }catch(error){

    setMessage(
      "loginMessage",
      "Couldn't load adult accounts: "+
      error.message,
      "error"
    );

  }
}


function drawAdult(){

  if(!adults.length)return;

  const adult=
    adults[adultIndex];

  $("adultName").textContent=
    adult.name;

  /*
    IMPORTANT:
    This takes the photo directly from
    the adult account returned by Supabase.
  */

  setPhoto(
    $("adultPhoto"),
    adult.photo_url
  );

  $("dots").innerHTML="";

  adults.forEach(
    (_,index)=>{

      const dot=
        document.createElement("div");

      dot.className=
        "dot "+
        (
          index===adultIndex
          ?"active"
          :""
        );

      $("dots").appendChild(dot);

    }
  );

}


$("left").onclick=function(){

  if(!adults.length)return;

  adultIndex--;

  if(adultIndex<0){
    adultIndex=
      adults.length-1;
  }

  drawAdult();

};


$("right").onclick=function(){

  if(!adults.length)return;

  adultIndex++;

  if(adultIndex>=adults.length){
    adultIndex=0;
  }

  drawAdult();

};


/* PHOTO RESIZE */

function resizePhoto(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=function(){

        const image=
          new Image();

        image.onload=function(){

          const canvas=
            document.createElement("canvas");

          const max=500;

          let width=image.width;
          let height=image.height;

          if(width>height){

            height=
              height*(max/width);

            width=max;

          }else{

            width=
              width*(max/height);

            height=max;

          }

          canvas.width=width;
          canvas.height=height;

          canvas
            .getContext("2d")
            .drawImage(
              image,
              0,
              0,
              width,
              height
            );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .72
            )
          );

        };

        image.onerror=reject;
        image.src=reader.result;

      };

      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );
}


/* ADD ADULT */

function openAdult(){

$("createAdult").onclick=
async function(){

  const name=
    $("newAdultName")
    .value
    .trim();

  const code=
    $("newCode")
    .value
    .trim();

  const confirm=
    $("confirmCode")
    .value
    .trim();

  const photo=
    $("newPhoto").dataset.photo||"";


  if(!name){

    setMessage(
      "adultError",
      "Please enter the adult's name.",
      "error"
    );

    return;
  }


  if(!/^[0-9]{4}$/.test(code)){

    setMessage(
      "adultError",
      "The code must be exactly 4 numbers.",
      "error"
    );

    return;
  }


  if(code!==confirm){

    setMessage(
      "adultError",
      "The codes don't match.",
      "error"
    );

    return;
  }


  try{

    await db(
      "/rest/v1/rpc/create_adult",
      {
        method:"POST",
        body:JSON.stringify({
          p_name:name,
          p_code:code,
          p_photo:photo
        })
      }
    );


    hide("adultModal");

    await loadAdults();


    const newIndex=
      adults.findIndex(
        adult=>
          adult.name.toLowerCase()===
          name.toLowerCase()
      );


    if(newIndex>=0){

      adultIndex=newIndex;

      drawAdult();

    }


    setMessage(
      "loginMessage",
      name+
      " has been added. Select their account and enter their code.",
      "success"
    );

  }catch(error){

    setMessage(
      "adultError",
      error.message,
      "error"
    );

  }

};

async function(){

      "loginMessage",

      "error"
    );

    return;
  }


  const adult=
    adults[adultIndex];

  const code=
    $("loginCode")
    .value
    .trim();


  if(!/^[0-9]{4}$/.test(code)){

    setMessage(
      "loginMessage",
      "Enter your 4-digit code.",
      "error"
    );

    return;
  }


  try{

    const result=
      await db(
        "/rest/v1/rpc/login_adult",
        {
          method:"POST",
          body:JSON.stringify({
            p_name:adult.name,
            p_code:code
          })
        }
      );


    currentAdult=
      Array.isArray(result)
      ?result[0]
      :result;


    localStorage.setItem(
      "acornAdult",
      JSON.stringify(currentAdult)
    );


    $("loginCode").value="";

    openApp();

  }catch{

    setMessage(
      "loginMessage",

/* RENDER SNACK LIST */

function renderSnacks(){

  const box=
    $("snackList");

  box.innerHTML="";


  const list=
    entries.filter(
      entry=>
        entry.list_date===selectedDate &&
        entry.snack_time===snackTime &&
        !entry.suncream_product
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No children added yet.</div>';

    return;
  }


  list.forEach(entry=>{

    const child=
      document.createElement("div");

    child.className=
      "child "+
      (entry.done?"done":"");


    const top=
      document.createElement("div");

    top.className="child-top";


    const tick=
      document.createElement("button");

    tick.className="tick";

    tick.textContent=
      entry.done?"✓":"";

    tick.onclick=
      ()=>toggleDone(entry);


    const name=
      document.createElement("div");

    name.className="child-name";

    name.textContent=
      entry.child_name;


    /*
      THIS IS THE RECORD BUTTON
      It is always visible beside
      the child's name.
    */

    const edit=
      document.createElement("button");

    edit.className="edit-btn";

    edit.textContent="📝";

    edit.title=
      "Record what they had";

    edit.onclick=
      ()=>openRecord(entry);


    top.append(
      tick,
      name,
      edit
    );


    child.appendChild(top);


    const details=
      document.createElement("div");

    details.className="details";


    let html="";


    if(entry.allergy_status==="red")
      html+="🔴 Allergy<br>";

    if(entry.allergy_status==="green")
      html+="🟢 Preference<br>";


    if(entry.alternative_milk)
      html+=
        "<strong>Milk:</strong> "+
        escapeHtml(
          entry.alternative_milk
        )+
        "<br>";


    if(entry.amount)
      html+=
        "<strong>Amount:</strong> "+
        escapeHtml(
          entry.amount
        )+
        "<br>";


    if(entry.food)
      html+=
        "<strong>Had:</strong> "+
        escapeHtml(
          entry.food
        );


    details.innerHTML=html;

    child.appendChild(details);


    const editChild=
      document.createElement("button");

    editChild.className="grey";

    editChild.textContent=
      "✏️ Edit child details";

    editChild.style.marginTop="10px";

    editChild.onclick=
      ()=>openChildEditor(entry);


    child.appendChild(editChild);


    box.appendChild(child);

  });

}

    entry.food||"";

    .querySelectorAll(".amount-button")
    .forEach(button=>{

        button.dataset.amount===
        recordAmount
      );

    });


  show("recordModal");

}

        this.dataset.amount;

        .querySelectorAll(".amount-button")
        .forEach(b=>

/* GROUP PAGE */

let groupTime="am";


$("groupAm").onclick=function(){

  groupTime="am";

  $("groupAm").classList.add("active");
  $("groupPm").classList.remove("active");

$("groupPm").onclick=function(){

  groupTime="pm";

  $("groupPm").classList.add("active");

function renderGroup(){

  const box=
    $("groupList");

  box.innerHTML="";


  const list=
    entries.filter(
      entry=>
        entry.list_date===selectedDate &&
        entry.snack_time===groupTime &&
        !entry.suncream_product &&
        entry.food
    );


  if(!list.length){

    box.innerHTML=
      '<div class="empty">Nothing has been recorded yet.</div>';

    return;

  }


  const groups={};


  list.forEach(entry=>{

    const amount=
      entry.amount||
      "Amount not recorded";

    const food=
      entry.food||
      "Food not recorded";

    const key=
      amount+"|||"+food;


    if(!groups[key])
      groups[key]=[];

    groups[key].push(
      entry.child_name
    );

  });


  Object.keys(groups)
    .forEach(key=>{

      const parts=
        key.split("|||");


      const group=
        document.createElement("div");

      group.className=
        "group-box";


      const title=
        document.createElement("div");

      title.className=
        "group-title";

      title.textContent=
        parts[0]+" — "+parts[1];


      group.appendChild(title);


      groups[key]
        .forEach(name=>{

          const child=
            document.createElement("div");

          child.className=
            "group-child";

          child.textContent=
            "• "+name;

          group.appendChild(child);

        });


      box.appendChild(group);

    });

}

/* ESCAPE */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* START */

async function start(){

  $("date").value=
    selectedDate;

  await loadAdults();


  const saved=
    localStorage.getItem(
      "acornAdult"
    );


  if(saved){

    try{

      currentAdult=
        JSON.parse(saved);

      if(
        currentAdult &&
        currentAdult.id
      ){

        openApp();

      }

    }catch{

      localStorage.removeItem(
        "acornAdult"
      );

    }

  }

}


start();
