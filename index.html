<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#202520}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:white;border-right:1px solid #ddd;padding:18px 12px}
.logo{font-size:23px;font-weight:bold;color:#2f6f45;padding:8px;margin-bottom:12px}
.folder-button{width:100%;text-align:left;background:#eef3ee;color:#294e34;margin-bottom:7px}
.folder-button.active{background:#2f6f45;color:white}
.main{width:100%;max-width:850px;margin:auto;padding:18px}
.header{background:#2f6f45;color:white;border-radius:17px;padding:20px;margin-bottom:14px}
.header h1{margin:0 0 4px}
.header p{margin:0}
.card{background:white;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 180px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input,select{width:100%;padding:11px;border:1px solid #d2d9d2;border-radius:10px}
.primary{background:#2f6f45;color:white}
.secondary{background:#e8eee9;color:#294e34}
.danger{background:#f7dddd;color:#8d2525}
.small{padding:7px 10px;font-size:13px}
.snack-tabs{display:flex;gap:8px;margin-bottom:14px}
.snack-tab{flex:1;background:#e8eee9;color:#294e34}
.snack-tab.active{background:#2f6f45;color:white}
.child{border:1px solid #dce2dc;border-radius:13px;padding:12px;margin-top:9px}
.child.done{background:#f0f7f1;border-color:#b9d4bf}
.child-top{display:flex;align-items:center;gap:9px}
.tick{width:31px;height:31px;padding:0;border-radius:50%;background:#edf0ed;color:#2f6f45;border:1px solid #ccd4cc}
.child.done .tick{background:#2f6f45;color:white}
.child-name{font-weight:bold;flex:1}
.badge{font-size:11px;font-weight:bold;padding:5px 7px;border-radius:7px}
.red{background:#f7dddd;color:#982626}
.green{background:#dff1e3;color:#246337}
.none{background:#edf0ed;color:#596159}
.detail{font-size:13px;color:#555;margin:8px 0 0 40px}
.empty{text-align:center;color:#687068;padding:20px}
.history-item{border-top:1px solid #e4e8e4;padding:11px 0;display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
@media(max-width:650px){
.app{display:block}
.sidebar{width:100%;border-right:0;border-bottom:1px solid #ddd;display:flex;gap:7px;overflow-x:auto;padding:9px}
.logo{display:none}
.folder-button{width:auto;white-space:nowrap;margin:0}
.main{padding:10px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">Acorn</div>

<button type="button" class="folder-button active" id="snackFolder">
Snack Lists
</button>

<button type="button" class="folder-button" id="suncreamFolder">
Suncream Lists
</button>

</aside>

<main class="main">

<header class="header">
<h1 id="pageTitle">Acorn Snack List</h1>
<p id="pageSubtitle">Daily records</p>
</header>

<section class="card">

<div class="row">

<div class="field">
<label>Date</label>
<input id="date" type="date">
</div>

<div class="field" style="align-self:end">
<button type="button" class="secondary" id="newDayButton">
Create new day
</button>
</div>

</div>

</section>


<div id="snackPage">

<section class="card">

<div class="snack-tabs">

<button type="button" class="snack-tab active" id="amButton">
AM Snack
</button>

<button type="button" class="snack-tab" id="pmButton">
PM Snack
</button>

</div>

<div class="row">

<div class="field">
<label>Child's name</label>
<input id="snackName" placeholder="Child's name">
</div>

<div class="field">
<label>Allergy / preference</label>

<select id="snackStatus">

<option value="none">
No allergy / preference
</option>

<option value="green">
Green - Preference
</option>

<option value="red">
Red - Allergy
</option>

</select>

</div>

<div class="field">
<label>Alternative milk</label>
<input id="snackMilk" placeholder="e.g. oat milk">
</div>

</div>

<button type="button" class="primary" id="addSnackButton" style="margin-top:10px">
Add child
</button>

</section>

<section class="card">

<h2 id="snackTitle">
AM Snack
</h2>

<div id="snackChildren"></div>

</section>

</div>


<div id="suncreamPage" class="hidden">

<section class="card">

<h2>Suncream List</h2>

<div class="row">

<div class="field">
<label>Child's name</label>
<input id="suncreamName" placeholder="Child's name">
</div>

<div class="field">
<label>Suncream</label>
<input id="suncreamProduct" placeholder="e.g. child's own SPF 50">
</div>

</div>

<button type="button" class="primary" id="addSuncreamButton" style="margin-top:10px">
Add child
</button>

</section>

<section class="card">

<h2>Today's Suncream</h2>

<div id="suncreamChildren"></div>

</section>

</div>


<section class="card">

<h2>Saved Days</h2>

<div id="savedDays"></div>

</section>

</main>
</div>


<script>

const STORAGE_KEY = "acornListsV5";

let data = {};
let currentDate = "";
let currentPage = "snacks";
let currentSnack = "am";


function get(id){
return document.getElementById(id);
}


function loadData(){

try{

const saved=localStorage.getItem(STORAGE_KEY);

if(saved){
data=JSON.parse(saved);
}

}catch(error){

data={};

}

}


function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function getToday(){

const d=new Date();

const local=new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={
amSnack:[],
pmSnack:[],
suncream:[]
};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


function openSnackList(){

currentPage="snacks";

get("snackPage").classList.remove("hidden");
get("suncreamPage").classList.add("hidden");

get("snackFolder").classList.add("active");
get("suncreamFolder").classList.remove("active");

get("pageTitle").textContent="Acorn Snack List";

render();

}


function openSuncreamList(){

currentPage="suncream";

get("snackPage").classList.add("hidden");
get("suncreamPage").classList.remove("hidden");

get("snackFolder").classList.remove("active");
get("suncreamFolder").classList.add("active");

get("pageTitle").textContent="Acorn Suncream List";

render();

}


function openAM(){

currentSnack="am";

get("amButton").classList.add("active");
get("pmButton").classList.remove("active");

get("snackTitle").textContent="AM Snack";

renderSnackList();

}


function openPM(){

currentSnack="pm";

get("pmButton").classList.add("active");
get("amButton").classList.remove("active");

get("snackTitle").textContent="PM Snack";

renderSnackList();

}


function render(){

createDay(currentDate);

get("date").value=currentDate;

get("pageSubtitle").textContent=formatDate(currentDate);

if(currentPage==="snacks"){

renderSnackList();

}else{

renderSuncreamList();

}

renderSavedDays();

}


function renderSnackList(){

const container=get("snackChildren");

container.innerHTML="";

const key=currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to this list yet.</div>';

return;

}


children.forEach((child,index)=>{

const item=document.createElement("div");

item.className="child"+(child.done?" done":"");


const top=document.createElement("div");

top.className="child-top";


const tick=document.createElement("button");

tick.type="button";
tick.className="tick";
tick.textContent=child.done?"✓":"";


tick.onclick=()=>{

child.done=!child.done;

saveData();

renderSnackList();

};


const name=document.createElement("div");

name.className="child-name";
name.textContent=child.name;


const badge=document.createElement("span");


if(child.status==="red"){

badge.className="badge red";
badge.textContent="RED";

}

else if(child.status==="green"){

badge.className="badge green";
badge.textContent="GREEN";

}

else{

badge.className="badge none";
badge.textContent="NONE";

}


const remove=document.createElement("button");

remove.type="button";
remove.className="danger small";
remove.textContent="Remove";


remove.onclick=()=>{

children.splice(index,1);

saveData();

renderSnackList();

};


top.append(
tick,
name,
badge,
remove
);


item.appendChild(top);


if(child.milk){

const milk=document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

item.appendChild(milk);

}


container.appendChild(item);

});

}


function renderSuncreamList(){

const container=get("suncreamChildren");

container.innerHTML="";

const children=data[currentDate].suncream;


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to today\'s suncream list yet.</div>';

return;

}


children.forEach((child,index)=>{

const item=document.createElement("div");

item.className="child"+(child.done?" done":"");


const top=document.createElement("div");

top.className="child-top";


const tick=document.createElement("button");

tick.type="button";
tick.className="tick";
tick.textContent=child.done?"✓":"";


tick.onclick=()=>{

child.done=!child.done;

saveData();

renderSuncreamList();

};


const name=document.createElement("div");

name.className="child-name";
name.textContent=child.name;


const remove=document.createElement("button");

remove.type="button";
remove.className="danger small";
remove.textContent="Remove";


remove.onclick=()=>{

children.splice(index,1);

saveData();

renderSuncreamList();

};


top.append(
tick,
name,
remove
);

item.appendChild(top);


const detail=document.createElement("div");

detail.className="detail";

detail.textContent=
child.product
?"Suncream: "+child.product
:"No specific suncream recorded";


item.appendChild(detail);

container.appendChild(item);

});

}


function renderSavedDays(){

const container=get("savedDays");

container.innerHTML="";

const dates=Object.keys(data).sort().reverse();


if(!dates.length){

container.innerHTML=
'<div class="empty">Saved days will appear here.</div>';

return;

}


dates.forEach(date=>{

const row=document.createElement("div");

row.className="history-item";


const title=document.createElement("strong");

title.textContent=formatDate(date);


const open=document.createElement("button");

open.type="button";
open.className="secondary small";
open.textContent="Open";


open.onclick=()=>{

currentDate=date;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


row.append(title,open);

container.appendChild(row);

});

}


function addSnack(){

const name=get("snackName").value.trim();


if(!name){

alert("Please enter the child's name.");

return;

}


const key=currentSnack==="am"
?"amSnack"
:"pmSnack";


data[currentDate][key].push({

name:name,

status:get("snackStatus").value,

milk:get("snackMilk").value.trim(),

done:false

});


get("snackName").value="";
get("snackMilk").value="";
get("snackStatus").value="none";


saveData();

renderSnackList();

}


function addSuncream(){

const name=get("suncreamName").value.trim();


if(!name){

alert("Please enter the child's name.");

return;

}


data[currentDate].suncream.push({

name:name,

product:get("suncreamProduct").value.trim(),

done:false

});


get("suncreamName").value="";
get("suncreamProduct").value="";


saveData();

renderSuncreamList();

}


function createNewDay(){

const answer=prompt(
"Enter the date as DD/MM/YYYY"
);


if(!answer)return;


const parts=answer.split("/");


if(parts.length!==3){

alert("Please use DD/MM/YYYY.");

return;

}


currentDate=
parts[2]+"-"+
parts[1].padStart(2,"0")+"-"+
parts[0].padStart(2,"0");


createDay(currentDate);

saveData();

render();

}


/* BUTTONS */

get("snackFolder")
.addEventListener(
"click",
openSnackList
);


get("suncreamFolder")
.addEventListener(
"click",
openSuncreamList
);


get("amButton")
.addEventListener(
"click",
openAM
);


get("pmButton")
.addEventListener(
"click",
openPM
);


get("addSnackButton")
.addEventListener(
"click",
addSnack
);


get("addSuncreamButton")
.addEventListener(
"click",
addSuncream
);


get("newDayButton")
.addEventListener(
"click",
createNewDay
);


get("date")
.addEventListener(
"change",
()=>{

currentDate=get("date").value;

createDay(currentDate);

saveData();

render();

}
);


/* START */

loadData();

currentDate=getToday();

createDay(currentDate);

saveData();

render();

</script>

</body>
</html>
