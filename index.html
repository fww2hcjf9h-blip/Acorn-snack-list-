<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:18px 12px;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2f6f45;
padding:8px;
margin-bottom:15px;
}

.folder-button{
width:100%;
text-align:left;
background:#eef3ee;
color:#294e34;
margin-bottom:8px;
}

.folder-button.active{
background:#2f6f45;
color:white;
}

.main{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:#2f6f45;
color:white;
border-radius:17px;
padding:20px;
margin-bottom:15px;
}

.header h1{
margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;
border-radius:10px;
background:white;
}

.primary{
background:#2f6f45;
color:white;
}

.secondary{
background:#e8eee9;
color:#294e34;
}

.danger{
background:#f7dddd;
color:#8d2525;
}

.small{
padding:7px 10px;
font-size:13px;
}

.snack-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.snack-tab{
flex:1;
background:#e8eee9;
color:#294e34;
}

.snack-tab.active{
background:#2f6f45;
color:white;
}

.child{
border:1px solid #dce2dc;
border-radius:13px;
padding:12px;
margin-top:9px;
}

.child.done{
background:#f0f7f1;
border-color:#b9d4bf;
}

.child-top{
display:flex;
align-items:center;
gap:8px;
}

.tick{
width:32px;
height:32px;
padding:0;
border-radius:50%;
background:#edf0ed;
color:#2f6f45;
border:1px solid #ccd4cc;
flex-shrink:0;
}

.child.done .tick{
background:#2f6f45;
color:white;
}

.child-name{
font-weight:bold;
flex:1;
}

.badge{
font-size:10px;
font-weight:bold;
padding:5px 7px;
border-radius:7px;
}

.red{
background:#f7dddd;
color:#982626;
}

.green{
background:#dff1e3;
color:#246337;
}

.none{
background:#edf0ed;
color:#596159;
}

.note-button{
background:#eef3ee;
color:#294e34;
padding:7px 9px;
font-size:15px;
}

.note-button.has-note{
background:#dcefe0;
color:#246337;
}

.note-box{
margin:12px 0 2px 40px;
padding:12px;
background:#f7faf7;
border:1px solid #dce5dc;
border-radius:12px;
}

.amount-buttons{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.amount-button{
background:white;
border:1px solid #ccd4cc;
color:#394239;
}

.amount-button.selected{
background:#2f6f45;
color:white;
}

.note-save-row{
display:flex;
gap:7px;
margin-top:10px;
}

.detail{
font-size:13px;
color:#555;
margin:8px 0 0 40px;
}

.empty{
text-align:center;
color:#687068;
padding:20px;
}

.history-item{
border-top:1px solid #e4e8e4;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.history-buttons{
display:flex;
gap:6px;
}

.hidden{
display:none!important;
}

@media(max-width:650px){

.app{
display:block;
}

.sidebar{
width:100%;
border-right:0;
border-bottom:1px solid #ddd;
display:flex;
gap:7px;
overflow-x:auto;
padding:9px;
}

.logo{
display:none;
}

.folder-button{
width:auto;
white-space:nowrap;
margin:0;
}

.main{
padding:10px;
}

.child-top{
flex-wrap:wrap;
}

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
Acorn
</div>

<button
type="button"
class="folder-button active"
id="snackFolder">
Snack Lists
</button>

<button
type="button"
class="folder-button"
id="suncreamFolder">
Suncream Lists
</button>

</aside>


<main class="main">

<header class="header">

<h1 id="pageTitle">
Acorn Snack List
</h1>

<p id="pageSubtitle">
Daily records
</p>

</header>


<section class="card">

<div class="row">

<div class="field">

<label>Date</label>

<input
id="date"
type="date">

</div>

<div
class="field"
style="align-self:end">

<button
type="button"
class="secondary"
id="newDayButton">

Create new day

</button>

</div>

</div>

</section>


<!-- SNACK PAGE -->

<div id="snackPage">

<section class="card">

<div class="snack-tabs">

<button
type="button"
class="snack-tab active"
id="amButton">
AM Snack
</button>

<button
type="button"
class="snack-tab"
id="pmButton">
PM Snack
</button>

</div>


<div class="row">

<div class="field">

<label>Child's name</label>

<input
id="snackName"
placeholder="Child's name">

</div>


<div class="field">

<label>Allergy / preference</label>

<select id="snackStatus">

<option value="none">
No allergy / preference
</option>

<option value="green">
Green - Preference
</option>

<option value="red">
Red - Allergy
</option>

</select>

</div>


<div class="field">

<label>Alternative milk</label>

<input
id="snackMilk"
placeholder="e.g. oat milk">

</div>

</div>


<button
type="button"
class="primary"
id="addSnackButton"
style="margin-top:10px">

Add child

</button>

</section>


<section class="card">

<h2 id="snackTitle">
AM Snack
</h2>

<div id="snackChildren"></div>

</section>

</div>


<!-- SUNCREAM PAGE -->

<div
id="suncreamPage"
class="hidden">

<section class="card">

<h2>
Suncream List
</h2>

<div class="row">

<div class="field">

<label>Child's name</label>

<input
id="suncreamName"
placeholder="Child's name">

</div>


<div class="field">

<label>Suncream</label>

<input
id="suncreamProduct"
placeholder="e.g. child's own SPF 50">

</div>

</div>


<button
type="button"
class="primary"
id="addSuncreamButton"
style="margin-top:10px">

Add child

</button>

</section>


<section class="card">

<h2>
Today's Suncream
</h2>

<div id="suncreamChildren"></div>

</section>

</div>


<!-- SAVED DAYS -->

<section class="card">

<h2>
Saved Days
</h2>

<div id="savedDays"></div>

</section>

</main>

</div>


<script>

const STORAGE_KEY="acornListsV8";

let data={};

let currentDate="";

let currentPage="snacks";

let currentSnack="am";

let openNoteIndex=null;


function get(id){
return document.getElementById(id);
}


function loadData(){

try{

const saved=
localStorage.getItem(STORAGE_KEY);

if(saved){
data=JSON.parse(saved);
}

}catch(error){

data={};

}

}


function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function getToday(){

const d=new Date();

const local=new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={
amSnack:[],
pmSnack:[],
suncream:[]
};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* SWITCH TO SNACKS */

function openSnackList(){

currentPage="snacks";

get("snackPage")
.classList.remove("hidden");

get("suncreamPage")
.classList.add("hidden");

get("snackFolder")
.classList.add("active");

get("suncreamFolder")
.classList.remove("active");

get("pageTitle")
.textContent="Acorn Snack List";

render();

}


/* SWITCH TO SUNCREAM */

function openSuncreamList(){

currentPage="suncream";

get("snackPage")
.classList.add("hidden");

get("suncreamPage")
.classList.remove("hidden");

get("snackFolder")
.classList.remove("active");

get("suncreamFolder")
.classList.add("active");

get("pageTitle")
.textContent="Acorn Suncream List";

render();

}


/* AM */

function openAM(){

currentSnack="am";

openNoteIndex=null;

get("amButton")
.classList.add("active");

get("pmButton")
.classList.remove("active");

get("snackTitle")
.textContent="AM Snack";

renderSnackList();

}


/* PM */

function openPM(){

currentSnack="pm";

openNoteIndex=null;

get("pmButton")
.classList.add("active");

get("amButton")
.classList.remove("active");

get("snackTitle")
.textContent="PM Snack";

renderSnackList();

}


/* MAIN RENDER */

function render(){

createDay(currentDate);

get("date").value=currentDate;

get("pageSubtitle")
.textContent=formatDate(currentDate);

if(currentPage==="snacks"){

renderSnackList();

}else{

renderSuncreamList();

}

renderSavedDays();

}


/* RENDER SNACKS */

function renderSnackList(){

const container=get("snackChildren");

container.innerHTML="";

const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to this list yet.</div>';

return;

}


children.forEach((child,index)=>{

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


/* TICK */

const tick=
document.createElement("button");

tick.type="button";

tick.className="tick";

tick.textContent=
child.done?"✓":"";


tick.onclick=function(){

child.done=!child.done;

saveData();

renderSnackList();

};


/* NAME */

const name=
document.createElement("div");

name.className="child-name";

name.textContent=child.name;


/* ALLERGY */

const badge=
document.createElement("span");


if(child.status==="red"){

badge.className="badge red";

badge.textContent="RED";

}

else if(child.status==="green"){

badge.className="badge green";

badge.textContent="GREEN";

}

else{

badge.className="badge none";

badge.textContent="NONE";

}


/* NOTE BUTTON */

const noteButton=
document.createElement("button");

noteButton.type="button";

noteButton.className=
"note-button"+
(
child.note &&
(child.note.amount||child.note.what)
?" has-note"
:""
);

noteButton.textContent="📝";

noteButton.title="Add snack note";


noteButton.onclick=function(){

if(openNoteIndex===index){

openNoteIndex=null;

}else{

openNoteIndex=index;

}

renderSnackList();

};


/* REMOVE */

const remove=
document.createElement("button");

remove.type="button";

remove.className="danger small";

remove.textContent="Remove";


remove.onclick=function(){

children.splice(index,1);

openNoteIndex=null;

saveData();

renderSnackList();

};


/* TOP ROW */

top.append(
tick,
name,
badge,
noteButton,
remove
);

item.appendChild(top);


/* MILK */

if(child.milk){

const milk=
document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

item.appendChild(milk);

}


/* NOTE */

if(openNoteIndex===index){

item.appendChild(
createNoteBox(child)
);

}


container.appendChild(item);

});

}


/* CREATE NOTE BOX */

function createNoteBox(child){

const box=
document.createElement("div");

box.className="note-box";


const amountLabel=
document.createElement("label");

amountLabel.textContent=
"How much did they have?";


box.appendChild(amountLabel);


const amounts=
[
"Little",
"Half",
"Almost all",
"All"
];


const amountButtons=
document.createElement("div");

amountButtons.className=
"amount-buttons";


amounts.forEach(amount=>{

const button=
document.createElement("button");

button.type="button";

button.className=
"amount-button"+
(
child.note &&
child.note.amount===amount
?" selected"
:""
);

button.textContent=amount;


button.onclick=function(){

if(!child.note){
child.note={};
}

child.note.amount=amount;

saveData();

renderSnackList();

};


amountButtons.appendChild(button);

});


box.appendChild(amountButtons);


/* WHAT THEY HAD */

const whatLabel=
document.createElement("label");

whatLabel.textContent=
"What did they have?";


box.appendChild(whatLabel);


const whatInput=
document.createElement("input");

whatInput.type="text";

whatInput.placeholder=
"e.g. banana, apple, different fruit";

whatInput.value=
child.note &&
child.note.what
?child.note.what
:"";


box.appendChild(whatInput);


const saveRow=
document.createElement("div");

saveRow.className="note-save-row";


const saveButton=
document.createElement("button");

saveButton.type="button";

saveButton.className="primary";

saveButton.textContent="Save";


saveButton.onclick=function(){

if(!child.note){
child.note={};
}

child.note.what=
whatInput.value.trim();

saveData();

openNoteIndex=null;

renderSnackList();

};


const cancelButton=
document.createElement("button");

cancelButton.type="button";

cancelButton.className="secondary";

cancelButton.textContent="Close";


cancelButton.onclick=function(){

openNoteIndex=null;

renderSnackList();

};


saveRow.append(
saveButton,
cancelButton
);

box.appendChild(saveRow);


return box;

}


/* SUNCREAM */

function renderSuncreamList(){

const container=
get("suncreamChildren");

container.innerHTML="";

const children=
data[currentDate].suncream;


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to today\'s suncream list yet.</div>';

return;

}


children.forEach((child,index)=>{

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


const tick=
document.createElement("button");

tick.type="button";

tick.className="tick";

tick.textContent=
child.done?"✓":"";


tick.onclick=function(){

child.done=!child.done;

saveData();

renderSuncreamList();

};


const name=
document.createElement("div");

name.className="child-name";

name.textContent=child.name;


const remove=
document.createElement("button");

remove.type="button";

remove.className="danger small";

remove.textContent="Remove";


remove.onclick=function(){

children.splice(index,1);

saveData();

renderSuncreamList();

};


top.append(
tick,
name,
remove
);

item.appendChild(top);


const detail=
document.createElement("div");

detail.className="detail";

detail.textContent=
child.product
?"Suncream: "+child.product
:"No specific suncream recorded";


item.appendChild(detail);

container.appendChild(item);

});

}


/* SAVED DAYS */

function renderSavedDays(){

const container=
get("savedDays");

container.innerHTML="";

const dates=
Object.keys(data)
.sort()
.reverse();


if(!dates.length){

container.innerHTML=
'<div class="empty">Saved days will appear here.</div>';

return;

}


dates.forEach(date=>{

const row=
document.createElement("div");

row.className="history-item";


const title=
document.createElement("strong");

title.textContent=
formatDate(date);


const buttons=
document.createElement("div");

buttons.className="history-buttons";


const open=
document.createElement("button");

open.type="button";

open.className="secondary small";

open.textContent="Open";


open.onclick=function(){

currentDate=date;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


const deleteButton=
document.createElement("button");

deleteButton.type="button";

deleteButton.className="danger small";

deleteButton.textContent="Delete";


deleteButton.onclick=function(){

const confirmed=
confirm(
"Are you sure you want to delete "+
formatDate(date)+
"?\n\nThis will delete the AM snack, PM snack and suncream list for this day."
);


if(!confirmed){
return;
}


delete data[date];

saveData();


if(currentDate===date){

currentDate=getToday();

createDay(currentDate);

saveData();

}


render();

};


buttons.append(
open,
deleteButton
);


row.append(
title,
buttons
);


container.appendChild(row);

});

}


/* ADD SNACK CHILD */

function addSnack(){

const name=
get("snackName")
.value
.trim();


if(!name){

alert(
"Please enter the child's name."
);

return;

}


const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";


data[currentDate][key].push({

name:name,

status:
get("snackStatus").value,

milk:
get("snackMilk")
.value
.trim(),

done:false,

note:{
amount:"",
what:""
}

});


get("snackName").value="";

get("snackMilk").value="";

get("snackStatus").value="none";


saveData();

renderSnackList();

}


/* ADD SUNCREAM CHILD */

function addSuncream(){

const name=
get("suncreamName")
.value
.trim();


if(!name){

alert(
"Please enter the child's name."
);

return;

}


data[currentDate]
.suncream
.push({

name:name,

product:
get("suncreamProduct")
.value
.trim(),

done:false

});


get("suncreamName").value="";

get("suncreamProduct").value="";


saveData();

renderSuncreamList();

}


/* CREATE NEW DAY */

function createNewDay(){

const answer=
prompt(
"Enter the date as DD/MM/YYYY"
);


if(!answer){
return;
}


const parts=
answer.split("/");


if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}


currentDate=
parts[2]+"-"+
parts[1].padStart(2,"0")+"-"+
parts[0].padStart(2,"0");


createDay(currentDate);

saveData();

render();

}


/* BUTTON EVENTS */

get("snackFolder")
.addEventListener(
"click",
openSnackList
);


get("suncreamFolder")
.addEventListener(
"click",
openSuncreamList
);


get("amButton")
.addEventListener(
"click",
openAM
);


get("pmButton")
.addEventListener(
"click",
openPM
);


get("addSnackButton")
.addEventListener(
"click",
addSnack
);


get("addSuncreamButton")
.addEventListener(
"click",
addSuncream
);


get("newDayButton")
.addEventListener(
"click",
createNewDay
);


get("date")
.addEventListener(
"change",
function(){

currentDate=
get("date").value;

createDay(currentDate);

saveData();

render();

}
);


/* START */

loadData();

currentDate=getToday();

createDay(currentDate);

saveData();

render();

</script>

</body>
</html>
