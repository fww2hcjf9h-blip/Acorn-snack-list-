<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:18px 12px;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2f6f45;
padding:8px;
margin-bottom:15px;
}

.folder-button{
width:100%;
text-align:left;
background:#eef3ee;
color:#294e34;
margin-bottom:8px;
}

.folder-button.active{
background:#2f6f45;
color:white;
}

.grouped-button{
width:100%;
text-align:left;
background:#dcefe0;
color:#245d36;
margin-bottom:8px;
}

.grouped-button.active{
background:#2f6f45;
color:white;
}

.main{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:#2f6f45;
color:white;
border-radius:17px;
padding:20px;
margin-bottom:15px;
}

.header h1{
margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;
border-radius:10px;
background:white;
}

.primary{
background:#2f6f45;
color:white;
}

.secondary{
background:#e8eee9;
color:#294e34;
}

.danger{
background:#f7dddd;
color:#8d2525;
}

.small{
padding:7px 10px;
font-size:13px;
}

/* LOGIN */

.login-screen{
min-height:100vh;
background:#f4f7f4;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:650px;
background:white;
border-radius:22px;
padding:25px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.login-logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#2f6f45;
margin-bottom:20px;
}

.profile-scroll{
display:flex;
gap:12px;
overflow-x:auto;
padding:8px 3px 15px;
}

.profile-card{
min-width:125px;
background:#f4f7f4;
border:2px solid transparent;
border-radius:16px;
padding:12px;
text-align:center;
cursor:pointer;
}

.profile-card.selected{
border-color:#2f6f45;
background:#eef7ef;
}

.profile-photo{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
background:#dcefe0;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 8px;
font-size:30px;
}

.profile-name{
font-weight:bold;
font-size:14px;
word-break:break-word;
}

.add-profile-card{
min-width:125px;
background:#eef3ee;
border:2px dashed #9ab19f;
border-radius:16px;
padding:12px;
text-align:center;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.plus-large{
font-size:35px;
color:#2f6f45;
}

.code-box{
margin-top:10px;
}

.code-input{
text-align:center;
font-size:24px;
letter-spacing:8px;
}

.profile-preview{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
display:block;
margin:10px auto;
background:#dcefe0;
}

.hidden{
display:none!important;
}

/* APP PROFILE BAR */

.top-profile{
display:flex;
align-items:center;
justify-content:flex-end;
gap:8px;
margin-bottom:10px;
}

.top-profile-photo{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
background:#dcefe0;
}

.top-profile-name{
font-weight:bold;
font-size:14px;
}

.logout-button{
padding:7px 10px;
font-size:12px;
background:#f7dddd;
color:#8d2525;
}

/* SNACKS */

.snack-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.snack-tab{
flex:1;
background:#e8eee9;
color:#294e34;
}

.snack-tab.active{
background:#2f6f45;
color:white;
}

.child{
border:1px solid #dce2dc;
border-radius:13px;
padding:12px;
margin-top:9px;
}

.child.done{
background:#f0f7f1;
border-color:#b9d4bf;
}

.child-top{
display:flex;
align-items:center;
gap:8px;
}

.tick{
width:32px;
height:32px;
padding:0;
border-radius:50%;
background:#edf0ed;
color:#2f6f45;
border:1px solid #ccd4cc;
flex-shrink:0;
}

.child.done .tick{
background:#2f6f45;
color:white;
}

.child-name{
font-weight:bold;
flex:1;
min-width:100px;
}

.badge{
font-size:10px;
font-weight:bold;
padding:5px 7px;
border-radius:7px;
}

.red{
background:#f7dddd;
color:#982626;
}

.green{
background:#dff1e3;
color:#246337;
}

.none{
background:#edf0ed;
color:#596159;
}

.note-button{
background:#eef3ee;
color:#294e34;
padding:7px 9px;
font-size:15px;
}

.note-button.has-note{
background:#dcefe0;
color:#246337;
}

.note-box{
margin:12px 0 2px 40px;
padding:12px;
background:#f7faf7;
border:1px solid #dce5dc;
border-radius:12px;
}

.amount-buttons{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.amount-button{
background:white;
border:1px solid #ccd4cc;
color:#394239;
}

.amount-button.selected{
background:#2f6f45;
color:white;
}

.note-save-row{
display:flex;
gap:7px;
margin-top:10px;
}

.detail{
font-size:13px;
color:#555;
margin:8px 0 0 40px;
}

.eaten-detail{
font-size:14px;
font-weight:bold;
color:#2f6f45;
margin:7px 0 0 40px;
}

.empty{
text-align:center;
color:#687068;
padding:20px;
}

/* GROUPED */

.grouped-section{
border:1px solid #dce2dc;
border-radius:14px;
margin-bottom:14px;
overflow:hidden;
}

.grouped-heading{
padding:13px 15px;
font-size:18px;
font-weight:bold;
background:#eef3ee;
color:#294e34;
}

.grouped-snack{
padding:13px 15px;
border-top:1px solid #e4e8e4;
}

.grouped-snack-name{
font-size:16px;
font-weight:bold;
color:#2f6f45;
}

.grouped-names{
font-size:14px;
color:#555;
margin-top:5px;
line-height:1.6;
}

.grouped-empty{
text-align:center;
padding:25px;
color:#687068;
}

.back-button{
margin-bottom:12px;
}

/* SAVED DAYS */

.history-item{
border-top:1px solid #e4e8e4;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.history-buttons{
display:flex;
gap:6px;
}

/* FLOATING ADD ACCOUNT */

.floating-add{
position:fixed;
right:20px;
bottom:20px;
width:58px;
height:58px;
border-radius:50%;
background:#2f6f45;
color:white;
font-size:30px;
padding:0;
box-shadow:0 4px 15px rgba(0,0,0,.2);
z-index:1000;
}

@media(max-width:650px){

.app{
display:block;
}

.sidebar{
width:100%;
border-right:0;
border-bottom:1px solid #ddd;
display:flex;
gap:7px;
overflow-x:auto;
padding:9px;
}

.logo{
display:none;
}

.folder-button,
.grouped-button{
width:auto;
white-space:nowrap;
margin:0;
}

.main{
padding:10px;
}

.child-top{
flex-wrap:wrap;
}

.floating-add{
right:16px;
bottom:16px;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

<div class="login-box">

<div class="login-logo">
🌱 Acorn
</div>

<h2 style="text-align:center;margin-top:0;">
Who's using Acorn?
</h2>

<p style="text-align:center;color:#687068;">
Select your profile and enter your personal code.
</p>

<div id="profileScroll" class="profile-scroll"></div>

<div id="loginCodeArea" class="code-box hidden">

<label>
Your 4-digit code
</label>

<input
id="loginCode"
class="code-input"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••">

<button
type="button"
class="primary"
id="loginButton"
style="width:100%;margin-top:10px;">

Log in

</button>

</div>

<div
id="loginMessage"
style="text-align:center;color:#982626;margin-top:10px;">
</div>

</div>

</div>


<!-- CREATE ACCOUNT -->

<div id="accountScreen" class="login-screen hidden">

<div class="login-box">

<div class="login-logo">
🌱 Acorn
</div>

<h2 style="text-align:center;">
Create adult account
</h2>

<div class="field">

<label>
Your name
</label>

<input
id="newProfileName"
placeholder="Enter your name"
autocomplete="off">

</div>

<div class="field" style="margin-top:12px;">

<label>
Create a 4-digit code
</label>

<input
id="newProfileCode"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••">

</div>

<div class="field" style="margin-top:12px;">

<label>
Confirm your code
</label>

<input
id="newProfileCodeConfirm"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••">

</div>

<div class="field" style="margin-top:12px;">

<label>
Profile photo
</label>

<input
id="profilePhotoInput"
type="file"
accept="image/*">

</div>

<img
id="profilePreview"
class="profile-preview hidden">

<div
id="accountMessage"
style="color:#982626;text-align:center;margin:10px 0;">
</div>

<button
type="button"
class="primary"
id="createAccountButton"
style="width:100%;margin-top:10px;">

Create account

</button>

<button
type="button"
class="secondary"
id="cancelAccountButton"
style="width:100%;margin-top:8px;">

← Back to profiles

</button>

</div>

</div>


<!-- MAIN APP -->

<div id="mainApp" class="hidden">

<div class="app">

<aside class="sidebar">

<div class="logo">
Acorn
</div>

<button
type="button"
class="folder-button active"
id="snackFolder">
Snack Lists
</button>

<button
type="button"
class="grouped-button"
id="groupedButton">
📋 Grouped
</button>

<button
type="button"
class="folder-button"
id="suncreamFolder">
Suncream Lists
</button>

</aside>


<main class="main">

<div class="top-profile">

<img
id="currentProfilePhoto"
class="top-profile-photo">

<span
id="currentProfileName"
class="top-profile-name">
</span>

<button
type="button"
class="logout-button"
id="logoutButton">
Log out
</button>

</div>


<header class="header">

<h1 id="pageTitle">
Acorn Snack List
</h1>

<p id="pageSubtitle">
Daily records
</p>

</header>


<section class="card">

<div class="row">

<div class="field">

<label>Date</label>

<input
id="date"
type="date">

</div>

<div
class="field"
style="align-self:end">

<button
type="button"
class="secondary"
id="newDayButton">

Create new day

</button>

</div>

</div>

</section>


<!-- SNACK PAGE -->

<div id="snackPage">

<section class="card">

<div class="snack-tabs">

<button
type="button"
class="snack-tab active"
id="amButton">
AM Snack
</button>

<button
type="button"
class="snack-tab"
id="pmButton">
PM Snack
</button>

</div>


<div class="row">

<div class="field">

<label>Child's name</label>

<input
id="snackName"
placeholder="Child's name"
autocomplete="off">

</div>


<div class="field">

<label>Allergy / preference</label>

<select id="snackStatus">

<option value="none">
No allergy / preference
</option>

Green - Preference
</option>

</option>

</div>


<div class="field">

<label>Alternative milk</label>

<input
id="snackMilk"
placeholder="e.g. oat milk">

<button
type="button"
class="primary"
id="addSnackButton"
style="margin-top:10px">

Add child

</button>

</section>


<section class="card">

<h2 id="snackTitle">
AM Snack
</h2>

<div id="snackChildren"></div>

</section>

</div>


<!-- GROUPED PAGE -->

<div id="groupedPage" class="hidden">

<button
type="button"
class="secondary back-button"
id="backToSnackButton">

← Back to Snack List

</button>


<section class="card">

<h2>
📋 Grouped Snacks
</h2>

<p style="color:#687068;font-size:14px">

Snacks are grouped by amount and then by snack.

</p>


<div class="snack-tabs">

<button
type="button"
class="snack-tab active"
id="groupedAmButton">

AM Snack

</button>

<button
type="button"
class="snack-tab"
id="groupedPmButton">

PM Snack

</button>

</div>


<div id="groupedChildren"></div>

</section>

</div>


<!-- SUNCREAM PAGE -->

<div id="suncreamPage" class="hidden">

<section class="card">

<h2>
Suncream List
</h2>

<div class="row">

<div class="field">

<label>Child's name</label>

<input
id="suncreamName"
placeholder="Child's name"
autocomplete="off">

</div>


<div class="field">

<label>Suncream</label>

<input
id="suncreamProduct"
placeholder="e.g. child's own SPF 50">

</div>

</div>


<button
type="button"
class="primary"
id="addSuncreamButton"
style="margin-top:10px">

Add child

</button>

</section>


<section class="card">

<h2>
Today's Suncream
</h2>

<div id="suncreamChildren"></div>

</section>

</div>


<!-- SAVED DAYS -->

<section class="card">

<h2>
Saved Days
</h2>

<div id="savedDays"></div>

</section>

</main>

</div>

</div>


<!-- FLOATING + -->

<button
type="button"
class="floating-add"
id="floatingAddAccount"
title="Add adult account">

+

</button>


<script>

const STORAGE_KEY="acornListsV10";

let data={};

let profiles=[];

let currentProfile=null;

let currentDate="";

let currentPage="snacks";

let currentSnack="am";

let groupedSnack="am";

let openNoteIndex=null;


/* GET ELEMENT */

function get(id){
return document.getElementById(id);
}


/* LOAD EVERYTHING */

function loadData(){

try{

const saved=
localStorage.getItem(STORAGE_KEY);

if(saved){

const parsed=JSON.parse(saved);

data=parsed.data || {};

profiles=parsed.profiles || [];

}

}catch(error){

data={};
profiles=[];

}

}


/* SAVE EVERYTHING */

function saveData(){

try{

localStorage.setItem(
STORAGE_KEY,
JSON.stringify({
data:data,
profiles:profiles
})
);

}catch(error){

console.log("Save error",error);

}

}


/* TODAY */

function getToday(){

const d=new Date();

const local=new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


/* CREATE DAY */

function createDay(date){

if(!data[date]){

data[date]={
amSnack:[],
pmSnack:[],
suncream:[]
};

}

}


/* FORMAT DATE */

function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* PROFILE PHOTO */

function photoForProfile(profile){

if(profile.photo){

return profile.photo;

}

return "";

}


/* RENDER LOGIN PROFILES */

function renderProfiles(){

const container=
get("profileScroll");

container.innerHTML="";


profiles.forEach(function(profile){

const card=
document.createElement("div");

card.className="profile-card";

card.onclick=function(){

selectProfile(profile.id);

};


const photo=
document.createElement("img");

photo.className="profile-photo";

if(profile.photo){

photo.src=profile.photo;

}else{

photo.style.display="flex";

photo.alt="👤";

photo.src="";

photo.onerror=function(){

this.style.display="none";

};

}

if(!profile.photo){

const icon=
document.createElement("div");

icon.className="profile-photo";

icon.textContent="👤";

card.appendChild(icon);

}else{

card.appendChild(photo);

}


const name=
document.createElement("div");

name.className="profile-name";

name.textContent=profile.name;

card.appendChild(name);

container.appendChild(card);

});


const add=
document.createElement("div");

add.className="add-profile-card";

add.onclick=function(){

showCreateAccount();

};

const plus=
document.createElement("div");

plus.className="plus-large";

plus.textContent="+";

const text=
document.createElement("div");

text.textContent="Add account";

add.append(
plus,
text
);

container.appendChild(add);

}


/* SELECT PROFILE */

function selectProfile(id){

currentProfile=
profiles.find(function(profile){

return profile.id===id;

});

if(!currentProfile){

return;

}

get("loginCodeArea")
.classList.remove("hidden");

get("loginCode")
.value="";

get("loginCode")
focus();

get("loginMessage")
.textContent="";

}


/* LOGIN */

function login(){

if(!currentProfile){

return;

}

const code=
get("loginCode")
.value.trim();

if(code===currentProfile.code){

get("loginScreen")
.classList.add("hidden");

get("mainApp")
.classList.remove("hidden");

setupProfileBar();

startApp();

}else{

get("loginMessage")
.textContent=
"Incorrect code. Please try again.";

get("loginCode").value="";

get("loginCode").focus();

}

}


/* PROFILE BAR */

function setupProfileBar(){

get("currentProfileName")
.textContent=
currentProfile.name;

const image=
get("currentProfilePhoto");

if(currentProfile.photo){

image.src=currentProfile.photo;

}else{

image.src="";

image.alt="👤";

}

}


/* CREATE ACCOUNT SCREEN */

function showCreateAccount(){

get("loginScreen")
.classList.add("hidden");

get("accountScreen")
.classList.remove("hidden");

get("newProfileName").value="";

get("newProfileCode").value="";

get("newProfileCodeConfirm").value="";

get("profilePhotoInput").value="";

get("profilePreview").classList.add("hidden");

get("accountMessage").textContent="";

}


/* CANCEL ACCOUNT */

function cancelCreateAccount(){

get("accountScreen")
.classList.add("hidden");

get("loginScreen")
.classList.remove("hidden");

renderProfiles();

}


/* CREATE ACCOUNT */

function createAccount(){

const name=
get("newProfileName")
.value.trim();

const code=
get("newProfileCode")
.value.trim();

const confirmCode=
get("newProfileCodeConfirm")
.value.trim();


if(!name){

get("accountMessage")
.textContent="Please enter your name.";

return;

}


if(!/^\d{4}$/.test(code)){

get("accountMessage")
.textContent=
"Your code must be exactly 4 numbers.";

return;

}


if(code!==confirmCode){

get("accountMessage")
.textContent=
"The codes do not match.";

return;

}


if(profiles.some(function(profile){

return profile.name.toLowerCase()===name.toLowerCase();

})){

get("accountMessage")
.textContent=
"An account with this name already exists.";

return;

}


const file=
get("profilePhotoInput").files[0];


function finishCreate(photo){

const profile={

id:
Date.now().toString(),

name:name,

code:code,

photo:photo || ""

};


profiles.push(profile);

saveData();

currentProfile=profile;

get("accountScreen")
.classList.add("hidden");

get("mainApp")
.classList.remove("hidden");

setupProfileBar();

startApp();

}


if(file){

const reader=
new FileReader();

reader.onload=function(event){

finishCreate(event.target.result);

};

reader.readAsDataURL(file);

}else{

finishCreate("");

}

}


/* LOGOUT */

function logout(){

currentProfile=null;

get("mainApp")
.classList.add("hidden");

get("loginScreen")
.classList.remove("hidden");

get("loginCodeArea")
.classList.add("hidden");

get("loginCode").value="";

get("loginMessage").textContent="";

renderProfiles();

}


/* SNACK PAGE */

function openSnackList(){

currentPage="snacks";

openNoteIndex=null;

get("snackPage")
.classList.remove("hidden");

get("groupedPage")
.classList.add("hidden");

get("suncreamPage")
.classList.add("hidden");

get("snackFolder")
.classList.add("active");

get("groupedButton")
.classList.remove("active");

get("suncreamFolder")
.classList.remove("active");

get("pageTitle")
.textContent="Acorn Snack List";

render();

}


/* GROUPED PAGE */

function openGroupedList(){

currentPage="grouped";

openNoteIndex=null;

get("snackPage")
.classList.add("hidden");

get("groupedPage")
.classList.remove("hidden");

get("suncreamPage")
.classList.add("hidden");

get("snackFolder")
.classList.remove("active");

get("groupedButton")
.classList.add("active");

get("suncreamFolder")
.classList.remove("active");

get("pageTitle")
.textContent="Grouped Snacks";

renderGrouped();

}


/* SUNCREAM */

/* SNACK LIST */

function renderSnackList(){

const container=
get("snackChildren");

container.innerHTML="";

const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to this list yet.</div>';

return;

}


children.forEach(function(child,index){

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


const tick=
document.createElement("button");

tick.type="button";

tick.className="tick";

tick.textContent=
child.done?"✓":"";


tick.onclick=function(){

child.done=!child.done;

saveData();

renderSnackList();

};


const name=
document.createElement("div");

name.className="child-name";

name.textContent=child.name;


const badge=
document.createElement("span");


if(child.status==="red"){

badge.className="badge red";

badge.textContent="RED";

}

else if(child.status==="green"){

badge.className="badge green";

badge.textContent="GREEN";

}

else{

badge.className="badge none";

badge.textContent="NONE";

}


const noteButton=
document.createElement("button");

noteButton.type="button";

noteButton.className=
"note-button"+
(
child.note &&
(child.note.amount||child.note.what)
?" has-note"
:""
);

noteButton.textContent="📝";

noteButton.title="Add snack";


noteButton.onclick=function(){

if(openNoteIndex===index){

openNoteIndex=null;

}else{

openNoteIndex=index;

}

renderSnackList();

};


const remove=
document.createElement("button");

remove.type="button";

remove.className="danger small";

remove.textContent="Remove";


remove.onclick=function(){

children.splice(index,1);

openNoteIndex=null;

saveData();

renderSnackList();

};


top.append(
tick,
name,
badge,
noteButton,
remove
);

item.appendChild(top);


/* MILK */

if(child.milk){

const milk=
document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

item.appendChild(milk);

}


/* EATEN */

if(
child.note &&
(child.note.amount||child.note.what)
){

const eaten=
document.createElement("div");

eaten.className="eaten-detail";

let text="Eaten: ";

if(child.note.amount){

text+=child.note.amount;

}

if(child.note.what){

if(child.note.amount){

text+=" — ";

}

text+=child.note.what;

}

eaten.textContent=text;

item.appendChild(eaten);

}


/* NOTE BOX */

if(openNoteIndex===index){

item.appendChild(
createNoteBox(child)
);

}


container.appendChild(item);

});

}


/* NOTE BOX */

function createNoteBox(child){

const box=
document.createElement("div");

box.className="note-box";


const amountLabel=
document.createElement("label");

amountLabel.textContent=
"How much did they have?";

box.appendChild(amountLabel);


const amounts=[
"Little",
"Half",
"Almost all",
"All"
];


const amountButtons=
document.createElement("div");

amountButtons.className="amount-buttons";


amounts.forEach(function(amount){

const button=
document.createElement("button");

button.type="button";

button.className=
"amount-button"+
(
child.note &&
child.note.amount===amount
?" selected"
:""
);

button.textContent=amount;


button.onclick=function(){

if(!child.note){

child.note={};

}

child.note.amount=amount;

saveData();

renderSnackList();

};


amountButtons.appendChild(button);

});


box.appendChild(amountButtons);


const whatLabel=
document.createElement("label");

whatLabel.textContent=
"What did they have?";

box.appendChild(whatLabel);


const whatInput=
document.createElement("input");

whatInput.type="text";

whatInput.placeholder=
"e.g. banana, apple, cookie";

whatInput.value=
child.note &&
child.note.what
?child.note.what
:"";

box.appendChild(whatInput);


const saveRow=
document.createElement("div");

saveRow.className="note-save-row";


const saveButton=
document.createElement("button");

saveButton.type="button";

saveButton.className="primary";

saveButton.textContent="Save";


saveButton.onclick=function(){

if(!child.note){

child.note={};

}

child.note.what=
whatInput.value.trim();

saveData();

openNoteIndex=null;

renderSnackList();

};


const closeButton=
document.createElement("button");

closeButton.type="button";

closeButton.className="secondary";

closeButton.textContent="Close";


closeButton.onclick=function(){

openNoteIndex=null;

renderSnackList();

};


saveRow.append(
saveButton,
closeButton
);

box.appendChild(saveRow);


return box;

}


/* GROUPED */

function renderGrouped(){

const container=
get("groupedChildren");

container.innerHTML="";

createDay(currentDate);

const key=
groupedSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="grouped-empty">No children have been added yet.</div>';

return;

}


const amounts=[
"All",
"Almost all",
"Half",
"Little"
];

let found=false;


amounts.forEach(function(amount){

const matching=
children.filter(function(child){

return child.note &&
child.note.amount===amount &&
child.note.what &&
child.note.what.trim();

});


if(!matching.length){

return;

}


found=true;


const section=
document.createElement("div");

section.className="grouped-section";


const heading=
document.createElement("div");

heading.className="grouped-heading";

heading.textContent=
amount.toUpperCase();

section.appendChild(heading);


const groups={};


matching.forEach(function(child){

const food=
child.note.what.trim();

const groupKey=
food.toLowerCase();


if(!groups[groupKey]){

groups[groupKey]={
name:food,
children:[]
};

}


groups[groupKey].children.push(
child.name
);

});


Object.values(groups)
.sort(function(a,b){

return a.name.localeCompare(b.name);

})
.forEach(function(group){

const snack=
document.createElement("div");

snack.className="grouped-snack";


const snackName=
document.createElement("div");

snackName.className=
"grouped-snack-name";

snackName.textContent=
group.name;


const names=
document.createElement("div");

names.className="grouped-names";

names.textContent=
group.children.join(" • ");


snack.append(
snackName,
names
);

section.appendChild(snack);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="grouped-empty">Nothing has been recorded yet.<br><br>Use the 📝 button beside a child to add what they ate.</div>';

}

}

/* NEW DAY */

function createNewDay(){

const answer=
prompt(
"Enter the date as DD/MM/YYYY"
);


if(!answer){

return;

}


const parts=
answer.split("/");


if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}


const day=
parts[0].padStart(2,"0");

const month=
parts[1].padStart(2,"0");

const year=
parts[2];


if(
year.length!==4 ||
Number(day)<1 ||
Number(day)>31 ||
Number(month)<1 ||
Number(month)>12
){

alert(
"Please enter a valid date using DD/MM/YYYY."
);

return;

}


currentDate=
year+"-"+month+"-"+day;

createDay(currentDate);

saveData();

render();

}
