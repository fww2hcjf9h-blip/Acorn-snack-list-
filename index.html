
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

.hidden{
display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
min-height:100vh;
background:#f4f7f4;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:500px;
}

.login-logo{
text-align:center;
font-size:34px;
font-weight:bold;
color:#2f6f45;
margin-bottom:8px;
}

.login-subtitle{
text-align:center;
color:#687068;
margin-bottom:20px;
}

.profile-scroll{
display:flex;
gap:12px;
overflow-x:auto;
padding:5px 2px 15px;
}

.profile-card{
background:white;
border:2px solid #dce2dc;
border-radius:15px;
min-width:115px;
padding:13px 10px;
text-align:center;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.profile-card:hover{
border-color:#2f6f45;
}

.profile-photo{
width:65px;
height:65px;
border-radius:50%;
object-fit:cover;
background:#dcefe0;
display:block;
margin:0 auto 8px;
}

.profile-initial{
width:65px;
height:65px;
border-radius:50%;
background:#dcefe0;
color:#2f6f45;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:bold;
margin:0 auto 8px;
}

.profile-name{
font-weight:bold;
font-size:14px;
word-break:break-word;
}

.add-profile-card{
background:#eef3ee;
border:2px dashed #9db5a2;
}

.add-profile-card .profile-initial{
background:white;
font-size:30px;
}

.login-message{
text-align:center;
color:#8d2525;
font-size:14px;
margin:10px 0;
}

.pin-box{
background:white;
border-radius:16px;
padding:18px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
margin-top:5px;
}

.pin-title{
font-size:18px;
font-weight:bold;
text-align:center;
margin-bottom:12px;
}

.pin-input{
text-align:center;
font-size:24px;
letter-spacing:6px;
}

.pin-buttons{
display:flex;
gap:8px;
margin-top:10px;
}

.pin-buttons button{
flex:1;
}

/* =========================
   APP
========================= */

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:18px 12px;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2f6f45;
padding:8px;
margin-bottom:15px;
}

.folder-button{
width:100%;
text-align:left;
background:#eef3ee;
color:#294e34;
margin-bottom:8px;
}

.folder-button.active{
background:#2f6f45;
color:white;
}

.grouped-button{
width:100%;
text-align:left;
background:#dcefe0;
color:#245d36;
margin-bottom:8px;
}

.grouped-button.active{
background:#2f6f45;
color:white;
}

.logged-user{
border-top:1px solid #e1e5e1;
margin-top:15px;
padding-top:15px;
}

.logged-user-top{
display:flex;
align-items:center;
gap:8px;
margin-bottom:8px;
}

.logged-user-photo{
width:35px;
height:35px;
border-radius:50%;
object-fit:cover;
background:#dcefe0;
}

.logged-user-initial{
width:35px;
height:35px;
border-radius:50%;
background:#dcefe0;
color:#2f6f45;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.logged-user-name{
font-weight:bold;
font-size:13px;
flex:1;
}

.main{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:#2f6f45;
color:white;
border-radius:17px;
padding:20px;
margin-bottom:15px;
}

.header h1{
margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;
border-radius:10px;
background:white;
}

.primary{
background:#2f6f45;
color:white;
}

.secondary{
background:#e8eee9;
color:#294e34;
}

.danger{
background:#f7dddd;
color:#8d2525;
}

.small{
padding:7px 10px;
font-size:13px;
}

.snack-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.snack-tab{
flex:1;
background:#e8eee9;
color:#294e34;
}

.snack-tab.active{
background:#2f6f45;
color:white;
}

.child{
border:1px solid #dce2dc;
border-radius:13px;
padding:12px;
margin-top:9px;
}

.child.done{
background:#f0f7f1;
border-color:#b9d4bf;
}

.child-top{
display:flex;
align-items:center;
gap:8px;
}

.tick{
width:32px;
height:32px;
padding:0;
border-radius:50%;
background:#edf0ed;
color:#2f6f45;
border:1px solid #ccd4cc;
flex-shrink:0;
}

.child.done .tick{
background:#2f6f45;
color:white;
}

.child-name{
font-weight:bold;
flex:1;
min-width:100px;
}

.badge{
font-size:10px;
font-weight:bold;
padding:5px 7px;
border-radius:7px;
}

.red{
background:#f7dddd;
color:#982626;
}

.green{
background:#dff1e3;
color:#246337;
}

.none{
background:#edf0ed;
color:#596159;
}

.note-button{
background:#eef3ee;
color:#294e34;
padding:7px 9px;
font-size:15px;
}

.note-button.has-note{
background:#dcefe0;
color:#246337;
}

.note-box{
margin:12px 0 2px 40px;
padding:12px;
background:#f7faf7;
border:1px solid #dce5dc;
border-radius:12px;
}

.amount-buttons{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.amount-button{
background:white;
border:1px solid #ccd4cc;
color:#394239;
}

.amount-button.selected{
background:#2f6f45;
color:white;
}

.note-save-row{
display:flex;
gap:7px;
margin-top:10px;
}

.detail{
font-size:13px;
color:#555;
margin:8px 0 0 40px;
}

.eaten-detail{
font-size:14px;
font-weight:bold;
color:#2f6f45;
margin:7px 0 0 40px;
}

.empty{
text-align:center;
color:#687068;
padding:20px;
}

/* =========================
   GROUPED
========================= */

.grouped-section{
border:1px solid #dce2dc;
border-radius:14px;
margin-bottom:14px;
overflow:hidden;
}

.grouped-heading{
padding:13px 15px;
font-size:18px;
font-weight:bold;
background:#eef3ee;
color:#294e34;
}

.grouped-snack{
padding:13px 15px;
border-top:1px solid #e4e8e4;
}

.grouped-snack-name{
font-size:16px;
font-weight:bold;
color:#2f6f45;
}

.grouped-names{
font-size:14px;
color:#555;
margin-top:5px;
line-height:1.6;
}

.grouped-empty{
text-align:center;
padding:25px;
color:#687068;
}

.back-button{
margin-bottom:12px;
}

/* =========================
   PROFILE
========================= */

.profile-header{
display:flex;
align-items:center;
gap:15px;
}

.profile-large-photo{
width:85px;
height:85px;
border-radius:50%;
object-fit:cover;
background:#dcefe0;
}

.profile-large-initial{
width:85px;
height:85px;
border-radius:50%;
background:#dcefe0;
color:#2f6f45;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
}

.profile-header-info{
flex:1;
}

.profile-header-name{
font-size:22px;
font-weight:bold;
}

.profile-header-small{
font-size:13px;
color:#687068;
margin-top:3px;
}

/* =========================
   SAVED DAYS
========================= */

.history-item{
border-top:1px solid #e4e8e4;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.history-buttons{
display:flex;
gap:6px;
}

/* =========================
   FLOATING +
========================= */

.add-account-floating{
position:fixed;
right:22px;
bottom:22px;
width:58px;
height:58px;
border-radius:50%;
background:#2f6f45;
color:white;
font-size:31px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 14px rgba(0,0,0,.25);
z-index:999;
}

.add-account-floating:hover{
transform:scale(1.05);
}

/* =========================
   MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:1000;
}

.modal-box{
background:white;
width:100%;
max-width:480px;
border-radius:18px;
padding:20px;
max-height:90vh;
overflow:auto;
}

.modal-title{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.modal-buttons{
display:flex;
gap:8px;
margin-top:15px;
}

.modal-buttons button{
flex:1;
}

.photo-preview{
width:85px;
height:85px;
border-radius:50%;
object-fit:cover;
background:#dcefe0;
display:block;
margin:8px 0 12px;
}

@media(max-width:650px){

.app{
display:block;
}

.sidebar{
width:100%;
border-right:0;
border-bottom:1px solid #ddd;
display:flex;
gap:7px;
overflow-x:auto;
padding:9px;
}

.logo{
display:none;
}

.folder-button,
.grouped-button{
width:auto;
white-space:nowrap;
margin:0;
}

.logged-user{
display:none;
}

.main{
padding:10px;
}

.child-top{
flex-wrap:wrap;
}

.add-account-floating{
right:16px;
bottom:16px;
}

}
</style>
</head>

<script>

/* =========================
   STORAGE
========================= */

const DATA_KEY="acornListsDataV10";

const PROFILE_KEY="acornAdultProfilesV1";

let data={};

let profiles=[];

let currentProfile=null;

let currentDate="";

let currentPage="snacks";

let currentSnack="am";

let groupedSnack="am";

let openNoteIndex=null;


/* =========================
   HELPERS
========================= */

function get(id){
return document.getElementById(id);
}


function loadEverything(){

try{

const savedData=
localStorage.getItem(DATA_KEY);

if(savedData){
data=JSON.parse(savedData);
}

}catch(e){
data={};
}


try{

const savedProfiles=
localStorage.getItem(PROFILE_KEY);

if(savedProfiles){
profiles=JSON.parse(savedProfiles);
}

}catch(e){
profiles=[];
}

}


function saveData(){

localStorage.setItem(
DATA_KEY,
JSON.stringify(data)
);

}


function saveProfiles(){

localStorage.setItem(
PROFILE_KEY,
JSON.stringify(profiles)
);

}


function getToday(){

const d=new Date();

const local=new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={
amSnack:[],
pmSnack:[],
suncream:[]
};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


function getInitial(name){

return name
?name.trim().charAt(0).toUpperCase()
:"?";

}


/* =========================
   PROFILE PHOTO
========================= */

function makeProfileVisual(profile,className){

if(profile.photo){

const img=
document.createElement("img");

img.src=profile.photo;

img.className=className;

return img;

}

const div=
document.createElement("div");

div.className=
className==="profile-large-photo"
?"profile-large-initial"
:"profile-initial";

div.textContent=
getInitial(profile.name);

return div;

}


/* =========================
   LOGIN SCREEN
========================= */

function renderLoginProfiles(){

const container=
get("loginProfiles");

container.innerHTML="";


profiles.forEach(function(profile,index){

const card=
document.createElement("div");

card.className="profile-card";


const visual=
makeProfileVisual(
profile,
"profile-photo"
);

card.appendChild(visual);


const name=
document.createElement("div");

name.className="profile-name";

name.textContent=profile.name;

card.appendChild(name);


card.onclick=function(){

selectProfile(index);

};


container.appendChild(card);

});


const add=
document.createElement("div");

add.className=
"profile-card add-profile-card";


const visual=
document.createElement("div");

visual.className="profile-initial";

visual.textContent="+";

add.appendChild(visual);


const name=
document.createElement("div");

name.className="profile-name";

name.textContent="Add Account";

add.appendChild(name);


add.onclick=function(){

openAccountModal();

};


container.appendChild(add);

}


let selectedProfileIndex=null;


function selectProfile(index){

selectedProfileIndex=index;

const profile=
profiles[index];

get("pinArea")
.classList.remove("hidden");

get("pinTitle")
.textContent=
"Enter code for "+profile.name;

function openAccountModal(){

function createAccount(){

const name=
get("newProfileName")
.value.trim();

const pin=
get("newProfilePin")
.value;

const confirmPin=
get("newProfilePinConfirm")
.value;


if(!name){

get("accountMessage")
.textContent=
"Please enter a name.";

return;

}


if(!pin){

get("accountMessage")
.textContent=
"Please create a code.";

return;

}


if(pin!==confirmPin){

get("accountMessage")
.textContent=
"The codes do not match.";

return;

}


if(profiles.some(function(p){

return p.name.toLowerCase()===name.toLowerCase();

})){

get("accountMessage")
.textContent=
"An account with that name already exists.";

return;

}


const photoInput=
get("newProfilePhoto");


function finishCreate(photo){

const profile={
id:Date.now().toString(),
name:name,
pin:pin,
photo:photo||""
};

profiles.push(profile);

saveProfiles();

closeAccountModal();

renderLoginProfiles();

selectProfile(profiles.length-1);

}


if(
photoInput.files &&
photoInput.files[0]
){

const reader=
new FileReader();

reader.onload=function(e){

finishCreate(e.target.result);

};

reader.readAsDataURL(
photoInput.files[0]
);

}else{

finishCreate("");

}

}

){

/* =========================
   SNACK LIST
========================= */

function renderSnackList(){

const container=
get("snackChildren");

container.innerHTML="";

const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to this list yet.</div>';

return;

}


children.forEach(function(child,index){

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


const tick=
document.createElement("button");

tick.type="button";
tick.className="tick";
tick.textContent=child.done?"✓":"";

tick.onclick=function(){

child.done=!child.done;

saveData();

renderSnackList();

};


const name=
document.createElement("div");

name.className="child-name";
name.textContent=child.name;


const badge=
document.createElement("span");

if(child.status==="red"){

badge.className="badge red";
badge.textContent="RED";

}else if(child.status==="green"){

badge.className="badge green";
badge.textContent="GREEN";

}else{

badge.className="badge none";
badge.textContent="NONE";

}


const noteButton=
document.createElement("button");

noteButton.type="button";

noteButton.className=
"note-button"+
(
child.note &&
(child.note.amount||child.note.what)
?" has-note"
:""
);

noteButton.textContent="📝";

noteButton.onclick=function(){

if(openNoteIndex===index){

openNoteIndex=null;

}else{

openNoteIndex=index;

}

renderSnackList();

};


const remove=
document.createElement("button");

remove.type="button";
remove.className="danger small";
remove.textContent="Remove";

remove.onclick=function(){

children.splice(index,1);

openNoteIndex=null;

saveData();

renderSnackList();

};


top.append(
tick,
name,
badge,
noteButton,
remove
);

item.appendChild(top);


if(child.milk){

const milk=
document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

item.appendChild(milk);

}


if(
child.note &&
(child.note.amount||child.note.what)
){

const eaten=
document.createElement("div");

eaten.className="eaten-detail";

let text="Eaten: ";

if(child.note.amount){
text+=child.note.amount;
}

if(child.note.what){

if(child.note.amount){
text+=" — ";
}

text+=child.note.what;

}

eaten.textContent=text;

item.appendChild(eaten);

}


if(openNoteIndex===index){

item.appendChild(
createNoteBox(child)
);

}


container.appendChild(item);

});

}


/* =========================
   NOTE BOX
========================= */

function createNoteBox(child){

const box=
document.createElement("div");

box.className="note-box";


const label=
document.createElement("label");

label.textContent=
"How much did they have?";

box.appendChild(label);


const amounts=[
"Little",
"Half",
"Almost all",
"All"
];


const amountButtons=
document.createElement("div");

amountButtons.className="amount-buttons";


amounts.forEach(function(amount){

const button=
document.createElement("button");

button.type="button";

button.className=
"amount-button"+
(
child.note &&
child.note.amount===amount
?" selected"
:""
);

button.textContent=amount;


button.onclick=function(){

if(!child.note){
child.note={};
}

child.note.amount=amount;

saveData();

renderSnackList();

};

amountButtons.appendChild(button);

});

box.appendChild(amountButtons);


const whatLabel=
document.createElement("label");

whatLabel.textContent=
"What did they have?";

box.appendChild(whatLabel);


const whatInput=
document.createElement("input");

whatInput.type="text";

whatInput.placeholder=
"e.g. banana, apple, cookie";

whatInput.value=
child.note &&
child.note.what
?child.note.what
:"";

box.appendChild(whatInput);


const saveRow=
document.createElement("div");

saveRow.className="note-save-row";


const saveButton=
document.createElement("button");

saveButton.type="button";
saveButton.className="primary";
saveButton.textContent="Save";

saveButton.onclick=function(){

if(!child.note){
child.note={};
}

child.note.what=
whatInput.value.trim();

saveData();

openNoteIndex=null;

renderSnackList();

};


const closeButton=
document.createElement("button");

closeButton.type="button";
closeButton.className="secondary";
closeButton.textContent="Close";

closeButton.onclick=function(){

openNoteIndex=null;

renderSnackList();

};


saveRow.append(
saveButton,
closeButton
);

box.appendChild(saveRow);

return box;

}


/* =========================
   GROUPED
========================= */

function renderGrouped(){

const container=
get("groupedChildren");

container.innerHTML="";

createDay(currentDate);

const key=
groupedSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="grouped-empty">No children have been added yet.</div>';

return;

}


const amounts=[
"All",
"Almost all",
"Half",
"Little"
];

let found=false;


amounts.forEach(function(amount){

const matching=
children.filter(function(child){

return child.note &&
child.note.amount===amount &&
child.note.what &&
child.note.what.trim();

});


if(!matching.length){
return;
}

found=true;


const section=
document.createElement("div");

section.className="grouped-section";


const heading=
document.createElement("div");

heading.className="grouped-heading";

heading.textContent=
amount.toUpperCase();

section.appendChild(heading);


const groups={};


matching.forEach(function(child){

const food=
child.note.what.trim();

const groupKey=
food.toLowerCase();


if(!groups[groupKey]){

groups[groupKey]={
name:food,
children:[]
};

}

groups[groupKey].children.push(
child.name
);

});


Object.values(groups)
.sort(function(a,b){

return a.name.localeCompare(b.name);

})
.forEach(function(group){

const snack=
document.createElement("div");

snack.className="grouped-snack";


const snackName=
document.createElement("div");

snackName.className=
"grouped-snack-name";

/*
 No banana icon is automatically added.
 The actual food name is shown.
*/

snackName.textContent=
group.name;


const names=
document.createElement("div");

names.className="grouped-names";

names.textContent=
group.children.join(" • ");


snack.append(
snackName,
names
);

section.appendChild(snack);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="grouped-empty">Nothing has been recorded yet.<br><br>Use the 📝 button beside a child to add what they ate.</div>';

}

}

/* =========================
   NEW DAY
========================= */

function createNewDay(){

const answer=
prompt(
"Enter the date as DD/MM/YYYY"
);

if(!answer){
return;
}

const parts=
answer.split("/");

if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}

const day=
parts[0].padStart(2,"0");

const month=
parts[1].padStart(2,"0");

const year=
parts[2];


if(
year.length!==4 ||
Number(day)<1 ||
Number(day)>31 ||
Number(month)<1 ||
Number(month)>12
){

alert(
"Please enter a valid date using DD/MM/YYYY."
);

return;

}


currentDate=
year+"-"+month+"-"+day;

createDay(currentDate);

saveData();

render();

}
