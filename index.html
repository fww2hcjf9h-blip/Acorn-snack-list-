<!DOCTYPE html>
<html lang="en">

<title>Acorn</title>

<style>
*{box-sizing:border-box}

body{
margin:0;

background:#f3f7f3;

}

button,input,select{

}

button{

}

/* ================= LOGIN ================= */

.login-screen{
position:fixed;
inset:0;
background:#f3f7f3;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

}

.login-box{
width:100%;

background:white;
border-radius:28px;
padding:28px 22px 25px;

}

.logo{

.login-subtitle{

margin-bottom:20px;
color:#4b554d;
}

.profile-carousel{
display:flex;
align-items:center;
justify-content:center;
gap:12px;

}

.carousel-arrow{
width:44px;
height:44px;
border-radius:50%;

color:#315b3d;
font-size:28px;

}

width:190px;
min-height:220px;
border-radius:22px;
background:#f1f5f1;

align-items:center;

.selected-profile-photo{
width:140px;
height:140px;

background:#dfe8df;
display:flex;
align-items:center;
justify-content:center;

.selected-profile-photo img{

height:100%;

}

.selected-profile-name{

}

.profile-dots{

justify-content:center;
gap:6px;

height:7px;

.profile-dot.active{

.code-input{

<script type="module">

import{
createClient
}from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ================= SUPABASE ================= */

const supabase=createClient(
"https://zzyyetnklrwzdzoraqqz.supabase.co",
"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0"
);


/* ================= STATE ================= */

let adults=[];
let selectedAdultIndex=0;
let currentAdult=null;

let currentDate="";
let currentSnack="am";
let groupedSnack="am";
let currentPage="snacks";
let openNoteIndex=null;

let data={};


/* ================= HELPERS ================= */

const $=id=>document.getElementById(id);


function today(){

const d=new Date();

const local=
new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={
amSnack:[],
pmSnack:[],
suncream:[]
};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* ================= PHOTO ================= */

function compressPhoto(file){

return new Promise(
(resolve,reject)=>{

const reader=new FileReader();

reader.onload=function(){

const image=new Image();

image.onload=function(){

const max=500;

let width=image.width;
let height=image.height;

if(width>height){

if(width>max){

height=
height*(max/width);

width=max;

}

}else{

if(height>max){

width=
width*(max/height);

height=max;

}

}

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.75
)
);

};

image.onerror=reject;

image.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


function setImage(element,url){

element.innerHTML="";

if(url){

const img=
document.createElement("img");

img.src=url;

img.onerror=()=>{
element.textContent="👤";
};

element.appendChild(img);

}else{

element.textContent="👤";

}

}


/* ================= ADULTS ================= */

async function loadAdults(){

const result=
await supabase
.from("adults")
.select("id,name,photo_url")
.order("name");

if(result.error){

console.error(result.error);

showLoginMessage(
"Unable to load adult profiles."
);

return;

}

adults=result.data||[];

if(selectedAdultIndex>=adults.length){

selectedAdultIndex=
Math.max(0,adults.length-1);

}

renderAdultCarousel();

}


function renderAdultCarousel(){

const noAdults=
$("noAdults");

const area=
$("codeArea");

if(!adults.length){

noAdults.classList.remove("hidden");

area.classList.add("hidden");

$("profileCarousel")
.classList.add("hidden");

$("profileDots")
.classList.add("hidden");

return;

}

noAdults.classList.add("hidden");

area.classList.remove("hidden");

$("profileCarousel")
.classList.remove("hidden");

$("profileDots")

/* TOUCH SWIPE */

let touchStartX=0;


$("selectedProfile").addEventListener(
"touchstart",
e=>{
touchStartX=e.changedTouches[0].screenX;
},
{passive:true}
);


$("selectedProfile").addEventListener(
"touchend",
e=>{

const difference=
e.changedTouches[0].screenX-
touchStartX;

if(Math.abs(difference)<40)return;

if(difference<0){

$("nextAdult").click();

}else{

$("previousAdult").click();

}

},
{passive:true}
);

/* ================= DATA ================= */

async function loadData(){

data={};


const snacks=
await supabase
.from("snack_lists")
.select("*")
.order("list_date",{ascending:false})
.order("id");


const suncream=
await supabase
.from("suncream_lists")
.select("*")
.order("list_date",{ascending:false})
.order("id");


if(snacks.error){

alert(snacks.error.message);

return;

}


if(suncream.error){

alert(suncream.error.message);

return;

}


(snacks.data||[]).forEach(
item=>{

createDay(item.list_date);

const key=
item.snack_time==="am"
?"amSnack"
:"pmSnack";

data[item.list_date][key].push({

id:item.id,

name:item.child_name,

status:item.allergy_status||"none",

milk:item.alternative_milk||"",

done:!!item.done,

note:{
amount:item.amount||"",
what:item.food||""
}

});

});


(suncream.data||[]).forEach(
item=>{

createDay(item.list_date);

data[item.list_date]
.suncream.push({

id:item.id,

name:item.child_name,

product:item.product||"",

done:!!item.done

});

});

}

/* ================= SNACK LIST ================= */

function renderSnackList(){

const container=
$("snackChildren");

container.innerHTML="";

createDay(currentDate);

const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added yet.</div>';

return;

}


children.forEach(
(child,index)=>{

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


const tick=
document.createElement("button");

tick.className="tick";

tick.textContent=
child.done?"✓":"";


tick.onclick=async()=>{

const result=
await supabase
.from("snack_lists")
.update({
done:!child.done
})
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

child.done=!child.done;

renderSnackList();

};


const name=
document.createElement("div");

name.className="child-name";

name.textContent=child.name;


const badge=
document.createElement("span");

if(child.status==="red"){

badge.className="badge red";

badge.textContent="RED";

}else if(child.status==="green"){

badge.className="badge green";

badge.textContent="GREEN";

}else{

badge.className="badge none";

badge.textContent="NONE";

}


const note=
document.createElement("button");

note.className=
"note-button"+
(
child.note.amount||
child.note.what
?" has-note":""
);

note.textContent="📝";

note.onclick=()=>{

openNoteIndex=
openNoteIndex===index
?null:index;

renderSnackList();

};


const remove=
document.createElement("button");

remove.className="danger small";

remove.textContent="Remove";

remove.onclick=async()=>{

if(!confirm(
"Remove "+child.name+"?"
))return;

const result=
await supabase
.from("snack_lists")
.delete()
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

await loadData();

render();

};


top.append(
tick,
name,
badge,
note,
remove
);

item.appendChild(top);


if(child.milk){

const milk=
document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

item.appendChild(milk);

}


if(child.note.amount||child.note.what){

const eaten=
document.createElement("div");

eaten.className="eaten-detail";

eaten.textContent=
"Eaten: "+
child.note.amount+
(
child.note.what
?" — "+child.note.what
:""
);

item.appendChild(eaten);

}


if(openNoteIndex===index){

item.appendChild(
createNoteBox(child)
);

}


container.appendChild(item);

});

}


/* ================= NOTES ================= */

function createNoteBox(child){

const box=
document.createElement("div");

box.className="note-box";


const label=
document.createElement("label");

label.textContent=
"How much did they have?";

box.appendChild(label);


const amounts=[
"Little",
"Half",
"Almost all",
"All"
];


const buttons=
document.createElement("div");

buttons.className=
"amount-buttons";


amounts.forEach(
amount=>{

const b=
document.createElement("button");

b.className=
"amount-button"+
(
child.note.amount===amount
?" selected":""
);

b.textContent=amount;

b.onclick=async()=>{

child.note.amount=amount;

await saveNote(child);

};

buttons.appendChild(b);

});


box.appendChild(buttons);


const foodLabel=
document.createElement("label");

foodLabel.textContent=
"What did they have?";

box.appendChild(foodLabel);


const input=
document.createElement("input");

input.value=
child.note.what;

input.placeholder=
"e.g. banana, apple, yoghurt";

box.appendChild(input);


const row=
document.createElement("div");

row.className="note-save";


const save=
document.createElement("button");

save.className="primary";

save.textContent="Save";

save.onclick=async()=>{

child.note.what=
input.value.trim();

await saveNote(child);

};


const close=
document.createElement("button");

close.className="secondary";

close.textContent="Close";

close.onclick=()=>{

openNoteIndex=null;

renderSnackList();

};


row.append(save,close);

box.appendChild(row);

return box;

}


async function saveNote(child){

const result=
await supabase
.from("snack_lists")
.update({
amount:child.note.amount||"",
food:child.note.what||""
})
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

openNoteIndex=null;

renderSnackList();

}


/* ================= GROUPED ================= */

function renderGrouped(){

const container=
$("groupedChildren");

container.innerHTML="";

createDay(currentDate);

const children=
data[currentDate]
[
groupedSnack==="am"
?"amSnack"
:"pmSnack"
];


const amounts=[
"All",
"Almost all",
"Half",
"Little"
];

let found=false;


amounts.forEach(
amount=>{

const matching=
children.filter(
child=>
child.note.amount===amount &&
child.note.what.trim()
);

if(!matching.length)return;

found=true;


const section=
document.createElement("div");

section.className=
"grouped-section";


const heading=
document.createElement("div");

heading.className=
"grouped-heading";

heading.textContent=
amount.toUpperCase();

section.appendChild(heading);


const groups={};


matching.forEach(
child=>{

const key=
child.note.what
.trim()
.toLowerCase();

if(!groups[key]){

groups[key]={
name:child.note.what.trim(),
children:[]
};

}

groups[key]
.children
.push(child.name);

});


Object.values(groups).forEach(
group=>{

const snack=
document.createElement("div");

snack.className=
"grouped-snack";


const food=
document.createElement("div");

food.className=
"grouped-food";

food.textContent=
"🍎 "+group.name;


const names=
document.createElement("div");

names.className=
"grouped-names";

names.textContent=
group.children.join(" • ");


snack.append(
food,
names
);

section.appendChild(snack);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="empty">Nothing has been recorded yet.<br><br>Use 📝 beside a child to add what they ate.</div>';

}

}

/* ================= NEW DAY ================= */

$("newDayButton").onclick=()=>{

const value=
prompt(
"Enter date as DD/MM/YYYY"
);

if(!value)return;

const parts=
value.split("/");

if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}

const day=
parts[0].padStart(2,"0");

const month=
parts[1].padStart(2,"0");

const year=parts[2];

currentDate=
year+"-"+month+"-"+day;

createDay(currentDate);

render();

};

login();

loadAdults();

if(saved){

try{

JSON.parse(saved);

adults.findIndex(
a=>a.id===savedAdult.id

if(found>=0){

selectedAdultIndex=found;

currentAdult={
...savedAdult,

};

}

}catch{}

}
