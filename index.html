<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

.hidden{display:none!important}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:18px 12px;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2f6f45;
padding:8px;
margin-bottom:15px;
}

.folder-button,
.grouped-button{
width:100%;
text-align:left;
background:#eef3ee;
color:#294e34;
margin-bottom:8px;
}

.folder-button.active,
.grouped-button.active{
background:#2f6f45;
color:white;
}

.grouped-button{
background:#dcefe0;
color:#245d36;
}

.main{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:#2f6f45;
color:white;
border-radius:17px;
padding:20px;
margin-bottom:15px;
}

.header h1{
margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,
select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;
border-radius:10px;
background:white;
}

.primary{
background:#2f6f45;
color:white;
}

.secondary{
background:#e8eee9;
color:#294e34;
}

.danger{
background:#f7dddd;
color:#8d2525;
}

.small{
padding:7px 10px;
font-size:13px;
}

.snack-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.snack-tab{
flex:1;
background:#e8eee9;
color:#294e34;
}

.snack-tab.active{
background:#2f6f45;
color:white;
}

.child{
border:1px solid #dce2dc;
border-radius:13px;
padding:12px;
margin-top:9px;
}

.child.done{
background:#f0f7f1;
border-color:#b9d4bf;
}

.child-top{
display:flex;
align-items:center;
gap:8px;
}

.tick{
width:32px;
height:32px;
padding:0;
border-radius:50%;
background:#edf0ed;
color:#2f6f45;
border:1px solid #ccd4cc;
flex-shrink:0;
}

.child.done .tick{
background:#2f6f45;
color:white;
}

.child-name{
font-weight:bold;
flex:1;
min-width:100px;
}

.badge{
font-size:10px;
font-weight:bold;
padding:5px 7px;
border-radius:7px;
}

.red{
background:#f7dddd;
color:#982626;
}

.green{
background:#dff1e3;
color:#246337;
}

.none{
background:#edf0ed;
color:#596159;
}

.note-button{
background:#eef3ee;
color:#294e34;
padding:7px 9px;
font-size:15px;
}

.note-button.has-note{
background:#dcefe0;
color:#246337;
}

.note-box{
margin:12px 0 2px 40px;
padding:12px;
background:#f7faf7;
border:1px solid #dce5dc;
border-radius:12px;
}

.amount-buttons{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.amount-button{
background:white;
border:1px solid #ccd4cc;
color:#394239;
}

.amount-button.selected{
background:#2f6f45;
color:white;
}

.note-save-row{
display:flex;
gap:7px;
margin-top:10px;
}

.detail{
font-size:13px;
color:#555;
margin:8px 0 0 40px;
}

.eaten-detail{
font-size:14px;
font-weight:bold;
color:#2f6f45;
margin:7px 0 0 40px;
}

.empty,
.grouped-empty{
text-align:center;
color:#687068;
padding:20px;
}

.grouped-section{
border:1px solid #dce2dc;
border-radius:14px;
margin-bottom:14px;
overflow:hidden;
}

.grouped-heading{
padding:13px 15px;
font-size:18px;
font-weight:bold;
background:#eef3ee;
color:#294e34;
}

.grouped-snack{
padding:13px 15px;
border-top:1px solid #e4e8e4;
}

.grouped-snack-name{
font-size:16px;
font-weight:bold;
color:#2f6f45;
}

.grouped-names{
font-size:14px;
color:#555;
margin-top:5px;
line-height:1.6;
}

.history-item{
border-top:1px solid #e4e8e4;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.history-buttons{
display:flex;
gap:6px;
}

/* LOGIN */

.login-screen{
position:fixed;
inset:0;
background:#f4f7f4;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.login-box{
background:white;
border-radius:20px;
padding:25px;
width:100%;
max-width:420px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.login-logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#2f6f45;
}

.login-subtitle{
text-align:center;
color:#687068;
margin:6px 0 20px;
}

.login-tabs{
display:flex;
gap:7px;
margin-bottom:15px;
}

.login-tabs button{
flex:1;
background:#e8eee9;
color:#294e34;
}

.login-tabs button.active{
background:#2f6f45;
color:white;
}

.login-message{
padding:10px;
border-radius:10px;
margin-bottom:12px;
font-size:14px;
}

.error{
background:#f7dddd;
color:#8d2525;
}

.success{
background:#dff1e3;
color:#246337;
}

/* PROFILE */

.fab{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
background:#2f6f45;
color:white;
font-size:30px;
box-shadow:0 4px 15px rgba(0,0,0,.2);
z-index:40;
}

.profile-menu{
position:fixed;
right:20px;
bottom:90px;
background:white;
border:1px solid #ddd;
border-radius:14px;
padding:12px;
width:240px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
z-index:50;
}

.profile-menu button{
width:100%;
margin-top:7px;
text-align:left;
}

.profile-header{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:#e8eee9;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:22px;
flex-shrink:0;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

/* MODALS */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:80;
}

.modal-box{
background:white;
width:100%;
max-width:450px;
border-radius:18px;
padding:20px;
}

@media(max-width:650px){

.app{
display:block;
}

.sidebar{
width:100%;
border-right:0;
border-bottom:1px solid #ddd;
display:flex;
gap:7px;
overflow-x:auto;
padding:9px;
}

.logo{
display:none;
}

.folder-button,
.grouped-button{
width:auto;
white-space:nowrap;
margin:0;
}

.main{
padding:10px;
}

.child-top{
flex-wrap:wrap;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

<div class="login-box">

<div class="login-logo">
🌳 Acorn
</div>

<div class="login-subtitle">
Adult access
</div>

<div class="login-tabs">

<button
id="loginTab"
class="active"
type="button">
Log in
</button>

<button
id="createTab"
type="button">
Create account
</button>

</div>

<div
id="authMessage"
class="login-message hidden">
</div>

<div class="field">

<label>
Adult name
</label>

<input
id="adultName"
type="text"
placeholder="e.g. Sarah"
autocomplete="off">

</div>

<div class="field">

<label>
4-digit code
</label>

<input
id="adultCode"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••"
autocomplete="off">

</div>

<div
id="confirmCodeField"
class="field hidden">

<label>
Confirm 4-digit code
</label>

<input
id="confirmCode"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••"
autocomplete="off">

</div>

<button
id="authButton"
type="button"
class="primary"
style="width:100%;margin-top:10px">

Log in

</button>

</div>

</div>


<!-- APP -->

<div
id="app"
class="hidden">

<div class="app">

<aside class="sidebar">

<div class="logo">
Acorn
</div>

<button
type="button"
class="folder-button active"
id="snackFolder">
Snack Lists
</button>

<button
type="button"
class="grouped-button"
id="groupedButton">
📋 Grouped
</button>

<button
type="button"
class="folder-button"
id="suncreamFolder">
Suncream Lists
</button>

</aside>


<main class="main">

<header class="header">

<div
style="display:flex;justify-content:space-between;align-items:center;gap:10px">

<div>

<h1 id="pageTitle">
Acorn Snack List
</h1>

<p id="pageSubtitle">
Daily records
</p>

</div>

<button
id="profileButton"
type="button"
class="secondary small">

👤 Profile

</button>

</div>

</header>


<section class="card">

<div class="row">

<div class="field">

<label>
Date
</label>

<input
id="date"
type="date">

</div>

<div
class="field"
style="align-self:end">

<button
type="button"
class="secondary"
id="newDayButton">

Create new day

</button>

</div>

</div>

</section>


<!-- SNACK PAGE -->

<div id="snackPage">

<section class="card">

<div class="snack-tabs">

<button
type="button"
class="snack-tab active"
id="amButton">
AM Snack
</button>

<button
type="button"
class="snack-tab"
id="pmButton">
PM Snack
</button>

</div>


<div class="row">

<div class="field">

<label>
Child's name
</label>

<input
id="snackName"
placeholder="Child's name"
autocomplete="off">

</div>


<div class="field">

<label>
Allergy / preference
</label>

<select id="snackStatus">

<option value="none">
No allergy / preference
</option>

<option value="green">
Green - Preference
</option>

<option value="red">
Red - Allergy
</option>

</select>

</div>


<div class="field">

<label>
Alternative milk
</label>

<input
id="snackMilk"
placeholder="e.g. oat milk">

</div>

</div>


<button
type="button"
class="primary"
id="addSnackButton"
style="margin-top:10px">

Add child

</button>

</section>


<section class="card">

<h2 id="snackTitle">
AM Snack
</h2>

<div id="snackChildren"></div>

</section>

</div>


<!-- GROUPED -->

<div
id="groupedPage"
class="hidden">

<button
type="button"
class="secondary"
id="backToSnackButton">

← Back to Snack List

</button>


<section class="card">

<h2>
📋 Grouped Snacks
</h2>

<p style="color:#687068;font-size:14px">

Snacks are grouped by amount and then by snack.

</p>


<div class="snack-tabs">

<button
type="button"
class="snack-tab active"
id="groupedAmButton">

AM Snack

</button>

<button
type="button"
class="snack-tab"
id="groupedPmButton">

PM Snack

</button>

</div>


<div id="groupedChildren"></div>

</section>

</div>


<!-- SUNCREAM -->

<div
id="suncreamPage"
class="hidden">

<section class="card">

<h2>
Suncream List
</h2>

<div class="row">

<div class="field">

<label>
Child's name
</label>

<input
id="suncreamName"
placeholder="Child's name"
autocomplete="off">

</div>


<div class="field">

<label>
Suncream
</label>

<input
id="suncreamProduct"
placeholder="e.g. child's own SPF 50">

</div>

</div>


<button
type="button"
class="primary"
id="addSuncreamButton"
style="margin-top:10px">

Add child

</button>

</section>


<section class="card">

<h2>
Today's Suncream
</h2>

<div id="suncreamChildren"></div>

</section>

</div>


<!-- SAVED DAYS -->

<section class="card">

<h2>
Saved Days
</h2>

<div id="savedDays"></div>

</section>

</main>

</div>

</div>


<!-- PLUS BUTTON -->

<button
id="accountFab"
class="fab"
type="button">

+

</button>


<!-- PROFILE MENU -->

<div
id="profileMenu"
class="profile-menu hidden">

<div class="profile-header">

<div
id="profileAvatar"
class="avatar">

👤

</div>

<div>

<strong id="profileMenuName">
Adult
</strong>

<div
style="font-size:12px;color:#687068">

Adult account

</div>

</div>

</div>


<button
id="editProfileButton"
type="button"
class="secondary">

✏️ Edit profile

</button>


<button
id="addAdultButton"
type="button"
class="secondary">

➕ Add another adult

</button>


<button
id="logoutButton"
type="button"
class="danger">

🚪 Log out

</button>

</div>


<!-- EDIT PROFILE -->

<div
id="profileModal"
class="modal hidden">

<div class="modal-box">

<h2>
Edit profile
</h2>

<div class="field">

<label>
Your name
</label>

<input
id="profileNameInput"
placeholder="Your name">

</div>


<div class="field">

<label>
Profile photo URL
</label>

<input
id="profilePhotoInput"
placeholder="Optional photo URL">

</div>


<div
id="profileMessage"
class="login-message hidden">
</div>


<button
id="saveProfileButton"
type="button"
class="primary"
style="width:100%">

Save profile

</button>


<button
id="closeProfileButton"
type="button"
class="secondary"
style="width:100%;margin-top:7px">

Close

</button>

</div>

</div>


<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* SUPABASE */

const supabase=createClient(

"https://zzyyetnklrwzdzoraqqz.supabase.co",

"sb_publishable_EcnKMGz-uEOLnVe8_QctmA_7wlwhsp0"

);


/* VARIABLES */

let currentAdult=null;

let data={};

let currentDate="";

let currentPage="snacks";

let currentSnack="am";

let groupedSnack="am";

let openNoteIndex=null;

let authMode="login";


/* HELPERS */

const $=id=>document.getElementById(id);


function today(){

const d=new Date();

const local=
new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={

amSnack:[],
pmSnack:[],
suncream:[]

};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* LOGIN MODE */

$("loginTab").onclick=()=>{

authMode="login";

$("loginTab").classList.add("active");

$("createTab").classList.remove("active");

$("confirmCodeField").classList.add("hidden");

$("authButton").textContent="Log in";

$("authMessage").classList.add("hidden");

};


$("createTab").onclick=()=>{

authMode="create";

$("createTab").classList.add("active");

$("loginTab").classList.remove("active");

$("confirmCodeField").classList.remove("hidden");

$("authButton").textContent="Create account";

$("authMessage").classList.add("hidden");

};


/* LOGIN MESSAGE */

function authMessage(text,success=false){

const box=$("authMessage");

box.textContent=text;

box.classList.remove("hidden");

box.classList.toggle("success",success);

box.classList.toggle("error",!success);

}


/* CREATE / LOGIN */

$("authButton").onclick=auth;


async function auth(){

const name=
$("adultName").value.trim();

const code=
$("adultCode").value.trim();


if(!name){

authMessage(
"Please enter your name."
);

return;

}


if(!/^\d{4}$/.test(code)){

authMessage(
"Please enter a 4-digit code."
);

return;

}


if(authMode==="create"){

const confirm=
$("confirmCode").value.trim();


if(code!==confirm){

authMessage(
"The codes don't match."
);

return;

}


const result=
await supabase.rpc(
"create_adult",
{
p_name:name,
p_code:code
}
);


if(result.error){

authMessage(
result.error.message
);

return;

}


currentAdult=result.data;

saveLogin();

showApp();

return;

}


/* LOGIN */

const result=
await supabase.rpc(
"login_adult",
{
p_name:name,
p_code:code
}
);


if(result.error){

authMessage(
"Incorrect name or code."
);

return;

}


currentAdult=result.data;

saveLogin();

showApp();

}


/* SAVE LOGIN */

function saveLogin(){

localStorage.setItem(
"acornAdult",
JSON.stringify(currentAdult)
);

}


/* SHOW APP */

async function showApp(){

$("loginScreen")
.classList.add("hidden");

$("app")
.classList.remove("hidden");

currentDate=today();

await loadData();

render();

updateProfile();

}


/* AUTO LOGIN */

async function checkLogin(){

const saved=
localStorage.getItem(
"acornAdult"
);

if(!saved){

$("loginScreen")
.classList.remove("hidden");

return;

}


try{

currentAdult=
JSON.parse(saved);

if(!currentAdult.id){

throw new Error();

}

await loadData();

$("loginScreen")
.classList.add("hidden");

$("app")
.classList.remove("hidden");

updateProfile();

render();

}

catch(error){

localStorage.removeItem(
"acornAdult"
);

$("loginScreen")
.classList.remove("hidden");

}

}


/* PROFILE */

async function updateProfile(){

if(!currentAdult){

return;

}


$("profileMenuName")
.textContent=
currentAdult.name || "Adult";


let result=
await supabase
.from("adults")
.select("photo_url")
.eq("id",currentAdult.id)
.maybeSingle();


if(result.data){

setAvatar(
$("profileAvatar"),
result.data.photo_url
);

}

}


function setAvatar(element,url){

element.innerHTML="";

if(url){

const image=
document.createElement("img");

image.src=url;

image.onerror=
()=>element.textContent="👤";

element.appendChild(image);

}

else{

element.textContent="👤";

}

}


/* PROFILE MENU */

$("profileButton").onclick=()=>{

$("profileMenu")
.classList.toggle("hidden");

};


$("accountFab").onclick=()=>{

$("profileMenu")
.classList.toggle("hidden");

};


/* EDIT PROFILE */

$("editProfileButton").onclick=
async function(){

$("profileMenu")
.classList.add("hidden");


const result=
await supabase
.from("adults")
.select("*")
.eq("id",currentAdult.id)
.maybeSingle();


if(result.data){

$("profileNameInput").value=
result.data.name || "";

$("profilePhotoInput").value=
result.data.photo_url || "";

}


$("profileModal")
.classList.remove("hidden");

};


$("closeProfileButton").onclick=()=>{

$("profileModal")
.classList.add("hidden");

};


/* SAVE PROFILE */

$("saveProfileButton").onclick=
async function(){

const name=
$("profileNameInput")
.value
.trim();

const photo=
$("profilePhotoInput")
.value
.trim();


if(!name){

$("profileMessage")
.textContent=
"Please enter your name.";

$("profileMessage")
.classList.remove("hidden");

return;

}


const result=
await supabase.rpc(
"update_adult",
{
p_id:currentAdult.id,
p_name:name,
p_photo_url:photo
}
);


if(result.error){

$("profileMessage")
.textContent=
result.error.message;

$("profileMessage")
.classList.remove("hidden");

return;

}


currentAdult.name=name;

saveLogin();

$("profileModal")
.classList.add("hidden");

updateProfile();

};


/* ADD ADULT */

$("addAdultButton").onclick=()=>{

$("profileMenu")
.classList.add("hidden");

$("adultName").value="";

$("adultCode").value="";

$("confirmCode").value="";

$("loginScreen").classList.remove("hidden");

$("app").classList.add("hidden");

$("createTab").click();

};


/* LOG OUT */

$("logoutButton").onclick=()=>{

localStorage.removeItem(
"acornAdult"
);

currentAdult=null;

$("profileMenu")
.classList.add("hidden");

$("app").classList.add("hidden");

$("loginScreen").classList.remove("hidden");

$("adultName").value="";

$("adultCode").value="";

};


/* LOAD DATA */

async function loadData(){

data={};


const snacks=
await supabase
.from("snack_lists")
.select("*")
.order("list_date",{ascending:false})
.order("id");


const suncream=
await supabase
.from("suncream_lists")
.select("*")
.order("list_date",{ascending:false})
.order("id");

console.log(snacks.error);

alert(snacks.error.message);

return;

}

console.log(suncream.error);

alert(suncream.error.message);

return;

}


(snacks.data||[])
.forEach(
function(item){

createDay(item.list_date);

const key=
item.snack_time==="am"
?"amSnack"
:"pmSnack";

data[item.list_date][key]
.push({

id:item.id,

name:item.child_name,

status:item.allergy_status||"none",

milk:item.alternative_milk||"",

done:!!item.done,

note:{

amount:item.amount||"",

what:item.food||""

}

});

});


(suncream.data||[])
.forEach(
function(item){

createDay(item.list_date);

data[item.list_date]
.suncream
.push({

id:item.id,

name:item.child_name,

product:item.product||"",

done:!!item.done

});

});

}

/* SNACK LIST */

function renderSnackList(){

const container=
$("snackChildren");

container.innerHTML="";

createDay(currentDate);

const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to this list yet.</div>';

return;

}


children.forEach(
function(child,index){

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


const tick=
document.createElement("button");

tick.className="tick";

tick.textContent=
child.done?"✓":"";


tick.onclick=
async function(){

const result=
await supabase
.from("snack_lists")
.update({
done:!child.done
})
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

child.done=!child.done;

renderSnackList();

};


const name=
document.createElement("div");

name.className="child-name";

name.textContent=
child.name;


const badge=
document.createElement("span");

if(child.status==="red"){

badge.className="badge red";

badge.textContent="RED";

}

else if(child.status==="green"){

badge.className="badge green";

badge.textContent="GREEN";

}

else{

badge.className="badge none";

badge.textContent="NONE";

}


const note=
document.createElement("button");

note.className=
"note-button"+
(
child.note.amount||
child.note.what
?" has-note":""
);

note.textContent="📝";

note.onclick=()=>{

openNoteIndex=
openNoteIndex===index
?null
:index;

renderSnackList();

};


const remove=
document.createElement("button");

remove.className=
"danger small";

remove.textContent="Remove";

remove.onclick=
async function(){

if(!confirm(
"Remove "+child.name+"?"
))return;

const result=
await supabase
.from("snack_lists")
.delete()
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

await loadData();

render();

};


top.append(
tick,
name,
badge,
note,
remove
);

item.appendChild(top);

document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

}


if(
child.note.amount||
child.note.what
){

const eaten=
document.createElement("div");

eaten.className=
"eaten-detail";

eaten.textContent=
"Eaten: "+
child.note.amount+
(
child.note.what
?
" — "+child.note.what
:""
);

item.appendChild(
createNoteBox(child)
);

/* NOTE BOX */

function createNoteBox(child){

const box=
document.createElement("div");

box.className="note-box";


const label=
document.createElement("label");

label.textContent=
"How much did they have?";

box.appendChild(label);


const amounts=[
"Little",
"Half",
"Almost all",
"All"
];


const buttons=
document.createElement("div");

buttons.className=
"amount-buttons";


amounts.forEach(
function(amount){

const button=
document.createElement("button");

button.className=
"amount-button"+
(
child.note.amount===amount
?" selected":""
);

button.textContent=
amount;

button.onclick=
async function(){

child.note.amount=amount;

await saveNote(child);

};

buttons.appendChild(button);

});


box.appendChild(buttons);


const foodLabel=
document.createElement("label");

foodLabel.textContent=
"What did they have?";

box.appendChild(foodLabel);


const input=
document.createElement("input");

input.placeholder=
"e.g. banana, apple, different fruit";

child.note.what;

box.appendChild(input);


const row=
document.createElement("div");

row.className=
"note-save-row";


const save=
document.createElement("button");

save.className="primary";

save.textContent="Save";

async function(){

child.note.what=
input.value.trim();

await saveNote(child);

};


const close=
document.createElement("button");

close.className="secondary";

close.textContent="Close";

close.onclick=()=>{

openNoteIndex=null;

renderSnackList();

};


row.append(save,close);

box.appendChild(row);

return box;

}


/* SAVE NOTE */

async function saveNote(child){

const result=
await supabase
.from("snack_lists")
.update({

amount:child.note.amount||"",

food:child.note.what||""

})
.eq("id",child.id);

if(result.error){

alert(result.error.message);

return;

}

openNoteIndex=null;

renderSnackList();

}


/* GROUPED */

function renderGrouped(){

const container=
$("groupedChildren");

container.innerHTML="";

createDay(currentDate);

const children=
data[currentDate]
[
groupedSnack==="am"
?"amSnack"
:"pmSnack"
];

const amounts=[
"All",
"Almost all",
"Half",
"Little"
];

let found=false;


amounts.forEach(
function(amount){

const matching=
children.filter(
function(child){

return child.note.amount===amount &&
child.note.what &&
child.note.what.trim();

});


if(!matching.length)return;

found=true;


const section=
document.createElement("div");

section.className=
"grouped-section";


const heading=
document.createElement("div");

heading.className=
"grouped-heading";

heading.textContent=
amount.toUpperCase();

section.appendChild(heading);


const groups={};


matching.forEach(
function(child){

const food=
child.note.what.trim();

const key=
food.toLowerCase();

if(!groups[key]){

groups[key]={
name:food,
children:[]
};

}

groups[key]
.children
.push(child.name);

});


Object.values(groups)
.sort(
(a,b)=>
a.name.localeCompare(b.name)
)
.forEach(
function(group){

const snack=
document.createElement("div");

snack.className=
"grouped-snack";


const title=
document.createElement("div");

title.className=
"grouped-snack-name";

title.textContent=
"🍌 "+group.name;


const names=
document.createElement("div");

names.className=
"grouped-names";

names.textContent=
group.children.join(" • ");


snack.append(
title,
names
);

section.appendChild(snack);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="grouped-empty">Nothing has been recorded yet.<br><br>Use the 📝 button beside a child to add what they ate.</div>';

}

}

/* NEW DAY */

function createNewDay(){

const answer=
prompt(
"Enter the date as DD/MM/YYYY"
);

if(!answer)return;

const parts=
answer.split("/");

if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}

const day=
parts[0].padStart(2,"0");

const month=
parts[1].padStart(2,"0");

const year=
parts[2];

if(
year.length!==4 ||
Number(day)<1 ||
Number(day)>31 ||
Number(month)<1 ||
Number(month)>12
){

alert(
"Please enter a valid date."
);

return;

}

currentDate=
year+"-"+month+"-"+day;

createDay(currentDate);

render();

}
