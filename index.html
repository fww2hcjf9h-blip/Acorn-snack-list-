<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:18px 12px;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2f6f45;
padding:8px;
margin-bottom:15px;
}

.folder-button{
width:100%;
text-align:left;
background:#eef3ee;
color:#294e34;
margin-bottom:8px;
}

.folder-button.active{
background:#2f6f45;
color:white;
}

.main{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:#2f6f45;
color:white;
border-radius:17px;
padding:20px;
margin-bottom:15px;
}

.header h1{
margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;
border-radius:10px;
background:white;
}

.primary{
background:#2f6f45;
color:white;
}

.secondary{
background:#e8eee9;
color:#294e34;
}

.danger{
background:#f7dddd;
color:#8d2525;
}

.small{
