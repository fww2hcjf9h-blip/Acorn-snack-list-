<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorn Lists</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f4;
color:#202520;
}

button,input,select{font:inherit}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.hidden{
display:none!important;
}

/* =========================
LOGIN
========================= */

.login-screen{
min-height:100vh;
background:#f4f7f4;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:520px;
background:white;
border-radius:22px;
padding:25px;
box-shadow:0 4px 25px rgba(0,0,0,.08);
}

.login-logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#2f6f45;
margin-bottom:5px;
}

.login-subtitle{
text-align:center;
color:#687068;
margin-bottom:22px;
}

.profile-scroll{
display:flex;
gap:12px;
overflow-x:auto;
padding:5px 2px 15px;
}

.profile-card{
min-width:125px;
background:#f4f7f4;
border:2px solid #dce2dc;
border-radius:15px;
padding:13px 8px;
text-align:center;
cursor:pointer;
}

.profile-card:hover{
border-color:#2f6f45;
}

.profile-card.selected{
border-color:#2f6f45;
background:#eaf3ec;
}

.profile-photo{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
background:#dce8de;
display:block;
margin:0 auto 8px;
}

.profile-placeholder{
width:70px;
height:70px;
border-radius:50%;
background:#dce8de;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
margin:0 auto 8px;
}

.profile-name{
font-weight:bold;
color:#294e34;
word-break:break-word;
}

.login-form{
margin-top:15px;
}

.login-form label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

.login-form input{
width:100%;
padding:12px;
border:1px solid #d2d9d2;
border-radius:10px;
margin-bottom:10px;
}

.login-buttons{
display:flex;
gap:8px;
}

.login-buttons button{
flex:1;
}

.profile-actions{
display:flex;
gap:8px;
margin-top:15px;
}

.profile-actions button{
flex:1;
}

/* ADD ACCOUNT CIRCLE */

.add-account-button{
position:fixed;
right:20px;
bottom:20px;
width:62px;
height:62px;
border-radius:50%;
background:#2f6f45;
color:white;
font-size:32px;
padding:0;
box-shadow:0 4px 15px rgba(0,0,0,.2);
z-index:1000;
}

.add-account-button:hover{
background:#245d36;
}

/* =========================
APP
========================= */

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:18px 12px;
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:#2f6f45;
padding:8px;
margin-bottom:15px;
}

.folder-button{
width:100%;
text-align:left;
background:#eef3ee;
color:#294e34;
margin-bottom:8px;
}

.folder-button.active{
background:#2f6f45;
color:white;
}

.grouped-button{
width:100%;
text-align:left;
background:#dcefe0;
color:#245d36;
margin-bottom:8px;
}

.grouped-button.active{
background:#2f6f45;
color:white;
}

/* LOGGED IN PROFILE */

.logged-profile{

border-radius:12px;
padding:10px;
margin-bottom:12px;
}

.logged-profile-row{
display:flex;
align-items:center;
gap:8px;
}

.logged-profile-photo{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
background:#dce8de;
}

.logged-profile-placeholder{
width:38px;
height:38px;
border-radius:50%;
background:#dce8de;
display:flex;
align-items:center;

.logged-profile-name{

font-size:13px;

}

.profile-menu-button{
width:100%;
margin-top:8px;
background:white;
color:#294e34;
border:1px solid #dce2dc;

.main{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
}

.header{
background:#2f6f45;
color:white;
border-radius:17px;
padding:20px;
margin-bottom:15px;
}

.header h1{
margin:0 0 5px;
}

.header p{
margin:0;
}

.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.field{
flex:1 1 180px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #d2d9d2;
border-radius:10px;
background:white;
}

.primary{
background:#2f6f45;
color:white;
}

.secondary{
background:#e8eee9;

}

.danger{

color:#8d2525;
}

.small{
padding:7px 10px;
font-size:13px;
}

.snack-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.snack-tab{
flex:1;
background:#e8eee9;
color:#294e34;
}

.snack-tab.active{
background:#2f6f45;
color:white;
}

.child{
border:1px solid #dce2dc;
border-radius:13px;
padding:12px;
margin-top:9px;
}

.child.done{
background:#f0f7f1;
border-color:#b9d4bf;
}

.child-top{
display:flex;
align-items:center;
gap:8px;
}

.tick{
width:32px;
height:32px;
padding:0;
border-radius:50%;
background:#edf0ed;

border:1px solid #ccd4cc;
flex-shrink:0;
}

.child.done .tick{
background:#2f6f45;
color:white;
}

.child-name{
font-weight:bold;
flex:1;
min-width:100px;
}

.badge{
font-size:10px;
font-weight:bold;
padding:5px 7px;
border-radius:7px;
}

.red{
background:#f7dddd;
color:#982626;
}

.green{
background:#dff1e3;
color:#246337;
}

.none{
background:#edf0ed;
color:#596159;
}

.note-button{
background:#eef3ee;
color:#294e34;
padding:7px 9px;
font-size:15px;
}

.note-button.has-note{
background:#dcefe0;
color:#246337;
}

.note-box{
margin:12px 0 2px 40px;
padding:12px;
background:#f7faf7;
border:1px solid #dce5dc;
border-radius:12px;
}

.amount-buttons{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.amount-button{
background:white;
border:1px solid #ccd4cc;
color:#394239;
}

.amount-button.selected{
background:#2f6f45;
color:white;
}

.note-save-row{
display:flex;
gap:7px;
margin-top:10px;
}

.detail{
font-size:13px;
color:#555;
margin:8px 0 0 40px;
}

.eaten-detail{
font-size:14px;
font-weight:bold;
color:#2f6f45;
margin:7px 0 0 40px;
}

.empty{
text-align:center;
color:#687068;
padding:20px;
}

/* =========================
GROUPED
========================= */

.grouped-section{
border:1px solid #dce2dc;
border-radius:14px;
margin-bottom:14px;
overflow:hidden;
}

.grouped-heading{
padding:13px 15px;
font-size:18px;
font-weight:bold;
background:#eef3ee;
color:#294e34;
}

.grouped-snack{
padding:13px 15px;
border-top:1px solid #e4e8e4;
}

.grouped-snack-name{
font-size:16px;
font-weight:bold;
color:#2f6f45;
}

.grouped-names{
font-size:14px;
color:#555;
margin-top:5px;
line-height:1.6;
}

.grouped-empty{
text-align:center;
padding:25px;
color:#687068;
}

.back-button{
margin-bottom:12px;
}

/* =========================
SAVED DAYS
========================= */

.history-item{
border-top:1px solid #e4e8e4;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.history-buttons{
display:flex;
gap:6px;
}

/* =========================
EDIT PROFILE
========================= */

.profile-preview{
text-align:center;
margin-bottom:15px;
}

.profile-preview img,
.profile-preview .profile-placeholder{
width:100px;
height:100px;
margin:0 auto 10px;
}

.profile-preview img{
border-radius:50%;
object-fit:cover;
}

.profile-preview .profile-placeholder{
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#dce8de;
font-size:42px;
}

/* =========================
MOBILE
========================= */

@media(max-width:650px){

.app{
display:block;
}

.sidebar{
width:100%;
border-right:0;
border-bottom:1px solid #ddd;
display:flex;
gap:7px;
overflow-x:auto;
padding:9px;
}

.logo{
display:none;
}

.folder-button,
.grouped-button{
width:auto;
white-space:nowrap;
margin:0;
}

.logged-profile{
min-width:170px;
}

.main{
padding:10px;
}

.child-top{
flex-wrap:wrap;
}

.add-account-button{
right:16px;
bottom:16px;
}

}
</style>
</head>

<script>

/* =====================================================
ACORN LISTS
LOGIN + PROFILE SYSTEM
===================================================== */

const STORAGE_KEY="acornListsV10";
const ACCOUNT_KEY="acornAdultAccountsV1";
const CURRENT_ACCOUNT_KEY="acornCurrentAccountV1";

let data={};
let accounts=[];
let currentAccountId=null;

let currentDate="";
let currentPage="snacks";
let currentSnack="am";
let groupedSnack="am";
let openNoteIndex=null;
let selectedLoginAccount=null;
let editPhotoData="";


/* =====================================================
HELPERS
===================================================== */

function get(id){
return document.getElementById(id);
}


/* =====================================================
LOAD / SAVE
===================================================== */

function loadAccounts(){

try{

const saved=
localStorage.getItem(ACCOUNT_KEY);

if(saved){
accounts=JSON.parse(saved);
}

}catch(error){

accounts=[];

}

}


function saveAccounts(){

try{

localStorage.setItem(
ACCOUNT_KEY,
JSON.stringify(accounts)
);

}catch(error){

console.log("Account save error",error);

}

}


function loadData(){

try{

const saved=
localStorage.getItem(STORAGE_KEY);

if(saved){
data=JSON.parse(saved);
}

}catch(error){

data={};

}

}


function saveData(){

try{

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}catch(error){

console.log("Data save error",error);

}

}


/* =====================================================
DATE
===================================================== */

function getToday(){

const d=new Date();

const local=new Date(
d.getTime()-
d.getTimezoneOffset()*60000
);

return local.toISOString().slice(0,10);

}


function createDay(date){

if(!data[date]){

data[date]={
amSnack:[],
pmSnack:[],
suncream:[]
};

}

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* =====================================================
LOGIN SCREEN
===================================================== */

function renderLoginProfiles(){

const container=
get("loginProfiles");

container.innerHTML="";

selectedLoginAccount=null;

get("loginForm")
.classList.add("hidden");

if(!accounts.length){

get("noAccountsMessage")
.classList.remove("hidden");

return;

}

get("noAccountsMessage")
.classList.add("hidden");


accounts.forEach(function(account){

const card=
document.createElement("div");

card.className="profile-card";


function selectProfile(){

document
.querySelectorAll(".profile-card")
.forEach(function(item){

item.classList.remove("selected");

});

card.classList.add("selected");

selectedLoginAccount=account;

get("loginForm")
.classList.remove("hidden");

get("loginPin").value="";

get("loginPin").focus();

}


if(account.photo){

const image=
document.createElement("img");

image.className="profile-photo";

image.src=account.photo;

card.appendChild(image);

}else{

const placeholder=
document.createElement("div");

placeholder.className=
"profile-placeholder";

placeholder.textContent="👤";

card.appendChild(placeholder);

}


const name=
document.createElement("div");

name.className="profile-name";

name.textContent=account.name;

card.appendChild(name);


card.addEventListener(
"click",
selectProfile
);


container.appendChild(card);

});

}


function showLogin(){

get("mainApp")
.classList.add("hidden");

get("loginScreen")
.classList.remove("hidden");

renderLoginProfiles();

}


/* =====================================================
ADD ACCOUNT
===================================================== */

function showAddAccount(){

const name=
prompt("Enter your name:");


if(!name || !name.trim()){

return;

}


const cleanName=
name.trim();


const existing=
accounts.some(function(account){

return account.name.toLowerCase()===
cleanName.toLowerCase();

});


if(existing){

alert(
"That name already has an account."
);

return;

}


const pin=
prompt(
"Create your personal code.\n\nUse 4–8 numbers."
);


if(!pin){

return;

}


if(!/^[0-9]{4,8}$/.test(pin)){

alert(
"Your code must be between 4 and 8 numbers."
);

return;

}


const account={

id:
"account_"+Date.now()+"_"+Math.random()
.toString(36)
.substring(2,8),

name:cleanName,

pin:pin,

photo:""

};


accounts.push(account);

saveAccounts();

alert(
"Account created! You can now log in."
);

renderLoginProfiles();

}


/* =====================================================
LOGIN
===================================================== */

function login(){

if(!selectedLoginAccount){

alert(
"Please select your profile first."
);

return;

}


const enteredPin=
get("loginPin").value.trim();


if(!enteredPin){

alert(
"Please enter your code."
);

return;

}


if(enteredPin!==selectedLoginAccount.pin){

alert(
"Incorrect code. Please try again."
);

get("loginPin").value="";

get("loginPin").focus();

return;

}


currentAccountId=
selectedLoginAccount.id;


localStorage.setItem(
CURRENT_ACCOUNT_KEY,
currentAccountId
);


get("loginScreen")
.classList.add("hidden");

get("mainApp")
.classList.remove("hidden");


currentDate=getToday();

createDay(currentDate);

saveData();

renderLoggedProfile();

render();

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

const confirmed=
confirm(
"Are you sure you want to log out?"
);


if(!confirmed){
return;
}


currentAccountId=null;

localStorage.removeItem(
CURRENT_ACCOUNT_KEY
);

selectedLoginAccount=null;

get("loginPin").value="";

showLogin();

}


/* =====================================================
CURRENT ACCOUNT
===================================================== */

function getCurrentAccount(){

return accounts.find(function(account){

return account.id===currentAccountId;

});

}


/* =====================================================
PROFILE DISPLAY
===================================================== */

function renderLoggedProfile(){

const container=

function saveProfile(){

const account=
getCurrentAccount();

if(!account){
return;
}


const name=
get("editProfileName")
.value.trim();


if(!name){

alert("Please enter your name.");

return;

}


const duplicate=
accounts.some(function(other){

return other.id!==account.id &&
other.name.toLowerCase()===
name.toLowerCase();

});


if(duplicate){

alert(
"Another account already uses that name."
);

return;

}


const newPin=
get("editProfilePin")
.value.trim();


if(newPin){

if(!/^[0-9]{4,8}$/.test(newPin)){

alert(
"Your code must be between 4 and 8 numbers."
);

return;

}

account.pin=newPin;

}


account.name=name;

account.photo=editPhotoData;


saveAccounts();

renderLoggedProfile();

openProfilePage();

alert(
"Your profile has been updated."
);

}

/* =====================================================
SNACK LIST
===================================================== */

function renderSnackList(){

const container=
get("snackChildren");

container.innerHTML="";

const key=
currentSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="empty">No children added to this list yet.</div>';

return;

}


children.forEach(function(child,index){

const item=
document.createElement("div");

item.className=
"child"+(child.done?" done":"");


const top=
document.createElement("div");

top.className="child-top";


/* TICK */

const tick=
document.createElement("button");

tick.type="button";

tick.className="tick";

tick.textContent=
child.done?"✓":"";


tick.onclick=function(){

child.done=!child.done;

saveData();

renderSnackList();

};


/* NAME */

const name=
document.createElement("div");

name.className="child-name";

name.textContent=child.name;


/* ALLERGY */

const badge=
document.createElement("span");


if(child.status==="red"){

badge.className="badge red";

badge.textContent="RED";

}

else if(child.status==="green"){

badge.className="badge green";

badge.textContent="GREEN";

}

else{

badge.className="badge none";

badge.textContent="NONE";

}


/* NOTE */

const noteButton=
document.createElement("button");

noteButton.type="button";

noteButton.className=
"note-button"+
(
child.note &&
(child.note.amount||child.note.what)
?" has-note"
:""
);

noteButton.textContent="📝";

noteButton.title="Add snack";


noteButton.onclick=function(){

if(openNoteIndex===index){

openNoteIndex=null;

}else{

openNoteIndex=index;

}

renderSnackList();

};


/* REMOVE */

const remove=
document.createElement("button");

remove.type="button";

remove.className="danger small";

remove.textContent="Remove";


remove.onclick=function(){

children.splice(index,1);

openNoteIndex=null;

saveData();

renderSnackList();

};


/* TOP */

top.append(
tick,
name,
badge,
noteButton,
remove
);

item.appendChild(top);


/* MILK */

if(child.milk){

const milk=
document.createElement("div");

milk.className="detail";

milk.textContent=
"Alternative milk: "+child.milk;

item.appendChild(milk);

}


/* EATEN */

if(
child.note &&
(child.note.amount||child.note.what)
){

const eaten=
document.createElement("div");

eaten.className="eaten-detail";

let text="Eaten: ";

if(child.note.amount){

text+=child.note.amount;

}

if(child.note.what){

if(child.note.amount){

text+=" — ";

}

text+=child.note.what;

}

eaten.textContent=text;

item.appendChild(eaten);

}


/* NOTE BOX */

if(openNoteIndex===index){

item.appendChild(
createNoteBox(child)
);

}


container.appendChild(item);

});

}


/* =====================================================
NOTE BOX
===================================================== */

function createNoteBox(child){

const box=
document.createElement("div");

box.className="note-box";


const amountLabel=
document.createElement("label");

amountLabel.textContent=
"How much did they have?";

box.appendChild(amountLabel);


const amounts=[
"Little",
"Half",
"Almost all",
"All"
];


const amountButtons=
document.createElement("div");

amountButtons.className="amount-buttons";


amounts.forEach(function(amount){

const button=
document.createElement("button");

button.type="button";

button.className=
"amount-button"+
(
child.note &&
child.note.amount===amount
?" selected"
:""
);

button.textContent=amount;


button.onclick=function(){

if(!child.note){

child.note={};

}

child.note.amount=amount;

saveData();

renderSnackList();

};


amountButtons.appendChild(button);

});


box.appendChild(amountButtons);


/* WHAT */

const whatLabel=
document.createElement("label");

whatLabel.textContent=
"What did they have?";

box.appendChild(whatLabel);


const whatInput=
document.createElement("input");

whatInput.type="text";

whatInput.placeholder=
"e.g. banana, apple, cookie";

whatInput.value=
child.note &&
child.note.what
?child.note.what
:"";

box.appendChild(whatInput);


/* SAVE */

const saveRow=
document.createElement("div");

saveRow.className="note-save-row";


const saveButton=
document.createElement("button");

saveButton.type="button";

saveButton.className="primary";

saveButton.textContent="Save";


saveButton.onclick=function(){

if(!child.note){

child.note={};

}

child.note.what=
whatInput.value.trim();

saveData();

openNoteIndex=null;

renderSnackList();

};


/* CLOSE */

const closeButton=
document.createElement("button");

closeButton.type="button";

closeButton.className="secondary";

closeButton.textContent="Close";


closeButton.onclick=function(){

openNoteIndex=null;

renderSnackList();

};


saveRow.append(
saveButton,
closeButton
);

box.appendChild(saveRow);


return box;

}

/* =====================================================
GROUPED
===================================================== */

function renderGrouped(){

const container=
get("groupedChildren");

container.innerHTML="";

createDay(currentDate);

const key=
groupedSnack==="am"
?"amSnack"
:"pmSnack";

const children=
data[currentDate][key];


if(!children.length){

container.innerHTML=
'<div class="grouped-empty">No children have been added yet.</div>';

return;

}


const amounts=[
"All",
"Almost all",
"Half",
"Little"
];

let found=false;


amounts.forEach(function(amount){

const matching=
children.filter(function(child){

return child.note &&
child.note.amount===amount &&
child.note.what &&
child.note.what.trim();

});


if(!matching.length){

return;

}


found=true;


const section=
document.createElement("div");

section.className="grouped-section";


const heading=
document.createElement("div");

heading.className="grouped-heading";

heading.textContent=
amount.toUpperCase();

section.appendChild(heading);


const groups={};


matching.forEach(function(child){

const food=
child.note.what.trim();

const groupKey=
food.toLowerCase();


if(!groups[groupKey]){

groups[groupKey]={
name:food,
children:[]
};

}


groups[groupKey].children.push(
child.name
);

});


Object.values(groups)
.sort(function(a,b){

return a.name.localeCompare(b.name);

})
.forEach(function(group){

const snack=
document.createElement("div");

snack.className="grouped-snack";


const snackName=
document.createElement("div");

snackName.className=
"grouped-snack-name";


const icon=
getFoodIcon(group.name);


snackName.textContent=
icon+" "+group.name;


const names=
document.createElement("div");

names.className="grouped-names";

names.textContent=
group.children.join(" • ");


snack.append(
snackName,
names
);

section.appendChild(snack);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="grouped-empty">Nothing has been recorded yet.<br><br>Use the 📝 button beside a child to add what they ate.</div>';

}

}

/* =====================================================
SAVED DAYS
===================================================== */

function renderSavedDays(){

const container=
get("savedDays");

container.innerHTML="";

const dates=
Object.keys(data)
.sort()
.reverse();


if(!dates.length){

container.innerHTML=
'<div class="empty">Saved days will appear here.</div>';

return;

}


dates.forEach(function(date){

const row=
document.createElement("div");

row.className="history-item";


const title=

formatDate(date);


const buttons=
document.createElement("div");

buttons.className="history-buttons";

document.createElement("button");

open.className="secondary small";

open.textContent="Open";


open.onclick=function(){

currentDate=date;

currentPage="snacks";

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


const deleteButton=
document.createElement("button");

deleteButton.type="button";

deleteButton.className="danger small";

deleteButton.textContent="Delete";


deleteButton.onclick=function(){

const confirmed=
confirm(
"Are you sure you want to delete "+
formatDate(date)+
"?\n\nThis will delete the AM snack, PM snack and suncream list for this day."
);


if(!confirmed){
return;
}


delete data[date];

saveData();


if(currentDate===date){

currentDate=getToday();

createDay(currentDate);

saveData();

}


render();

};


buttons.append(
open,
deleteButton
);

row.append(
title,
buttons
);

container.appendChild(row);

});

}

/* =====================================================
NEW DAY
===================================================== */

function createNewDay(){

const answer=
prompt(
"Enter the date as DD/MM/YYYY"
);


if(!answer){
return;
}


const parts=
answer.split("/");


if(parts.length!==3){

alert(
"Please use DD/MM/YYYY."
);

return;

}


const day=
parts[0].padStart(2,"0");

const month=
parts[1].padStart(2,"0");

const year=
parts[2];


if(
year.length!==4 ||
Number(day)<1 ||
Number(day)>31 ||
Number(month)<1 ||
Number(month)>12
){

alert(
"Please enter a valid date using DD/MM/YYYY."
);

return;

}


currentDate=
year+"-"+month+"-"+day;

createDay(currentDate);

saveData();

render();

}
